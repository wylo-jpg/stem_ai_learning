<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>數學氣球大戰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Courier New",Courier,"Microsoft JhengHei",monospace;background:#06121f;color:#e8f4ff;min-height:100vh;touch-action:manipulation}
.scan{position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px)}
header{background:#0d2a4d;border-bottom:4px solid #38bdf8;padding:12px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:2px;color:#ffe14d;text-shadow:2px 2px 0 #0c4a6e}
.hud{display:flex;justify-content:space-around;background:#0d2a4d;padding:10px;font-size:14px;font-weight:700;border-bottom:4px solid #38bdf8}
.hud b{color:#ffe14d}
.target{background:#0d2a4d;text-align:center;padding:8px;font-size:18px;font-weight:800;color:#7CFC98;border-bottom:4px solid #38bdf8}
.back{display:block;text-align:center;background:#123a63;color:#9fd0ff;text-decoration:none;padding:12px;font-size:15px;font-weight:700}
.wrap{max-width:440px;margin:0 auto;padding:12px 12px 40px}
#cv{width:100%;height:auto;display:block;background:linear-gradient(#06121f,#0a2540);border:4px solid #38bdf8;image-rendering:pixelated;touch-action:none}
.overlay{position:fixed;inset:0;background:rgba(3,10,20,.95);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:#0d2a4d;border:4px solid #38bdf8;padding:26px 22px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto}
.card h2{margin:0 0 10px;color:#ffe14d;font-size:22px;letter-spacing:2px}
.card p,.card li{font-size:15px;line-height:1.7}
.card ul{padding-left:20px}
.concept{background:#06121f;border:2px solid #38bdf8;padding:12px;margin:12px 0;font-size:14px}
.concept b{color:#7CFC98}
.card button{width:100%;min-height:58px;font-size:18px;font-weight:800;font-family:inherit;background:#e33;color:#fff;border:4px solid #fff;margin-top:10px;cursor:pointer;letter-spacing:2px}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
</style>
</head>
<body>
<div class="scan"></div>
<header><h1>🎈 數學氣球大戰</h1></header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<div class="wrap">
<div class="hud"><div>❤ <b id="lives">3</b></div><div>⏱ <b id="time">60</b>s</div><div>⭐ <b id="score">0</b></div></div>
<div class="target">🎯 目標分數：<span id="tgt">—</span></div>
<canvas id="cv" width="360" height="480"></canvas>
</div>
<div class="overlay" id="intro"><div class="card">
<h2>🎈 數學氣球大戰</h2>
<p><b>玩法：</b>氣球升上天，每個氣球有個分數。撳爆<b>等於目標分數</b>嘅氣球！記住：<b>2/4 = 1/2</b> 都算啱！撳錯扣一格命（3 格），限時 60 秒。</p>
<div class="concept">💡 <b>數學概念：</b>等值分數。分子分母同時乘同一個數，分數值不變：1/2 = 2/4 = 3/6。比較分數用交叉相乘：a/b = c/d ⟺ a×d = b×c。</div>
<button onclick="startGame()">▶ START</button>
<p class="blink" style="text-align:center;color:#9fd0ff">★ 8-BIT 挑戰 ★</p>
</div></div>
<div class="overlay" id="over" style="display:none"><div class="card">
<h2 id="overT">⏰ 時間到！</h2>
<p id="overS" style="font-size:17px"></p>
<button onclick="resetGame()">🔁 再玩一次</button>
</div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.07;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
var W=360,H=480;
var TG=[[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[4,5],[1,6],[5,6]];
var target=null,bals=[],parts=[],score=0,lives=3,timeLeft=60,run=false,spawnT=0,lastT=0,over=false;
var COLS=['#f87171','#fbbf24','#34d399','#60a5fa','#c084fc'];
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[ri(0,a.length-1)];}
function eq(n1,d1,n2,d2){return n1*d2===n2*d1;}
function newTarget(){target=pick(TG);document.getElementById('tgt').textContent=target[0]+'/'+target[1];}
function spawn(){
  var n,d;
  if(Math.random()<0.45){var k=ri(2,4);n=target[0]*k;d=target[1]*k;}
  else{do{n=ri(1,5);d=ri(2,6);}while(eq(n,d,target[0],target[1])||n>=d);}
  bals.push({x:ri(45,W-45),y:H+40,vy:-(0.5+Math.random()*0.7),n:n,d:d,c:pick(COLS),r:34,pop:0});
}
function burst(x,y,c,wrong){
  for(var i=0;i<14;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-1,life:30,c:wrong?'#f87171':c});
}
cv.addEventListener('pointerdown',function(e){
  if(!run||over)return;
  var r=cv.getBoundingClientRect();
  var mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  for(var i=bals.length-1;i>=0;i--){
    var b=bals[i];
    if(Math.hypot(b.x-mx,b.y-my)<=b.r+8){
      if(eq(b.n,b.d,target[0],target[1])){
        beep(880,0.1);score+=100;burst(b.x,b.y,b.c,false);
        document.getElementById('score').textContent=score;
      }else{
        beep(160,0.25);lives--;burst(b.x,b.y,b.c,true);
        document.getElementById('lives').textContent=lives;
        if(lives<=0){endGame(false);return;}
      }
      bals.splice(i,1);return;
    }
  }
});
function drawBalloon(b){
  var w=[8,14,20,24,26,24,20,14,8],s=2.4;
  ctx.fillStyle=b.c;
  for(var i=0;i<w.length;i++)ctx.fillRect(b.x-w[i]*s/2,b.y-22+i*5,w[i]*s,5);
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(b.x-14,b.y-14,6,10);
  ctx.fillStyle='#333';ctx.fillRect(b.x-3,b.y+23,6,6);
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y+29);ctx.lineTo(b.x,b.y+48);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 15px monospace';ctx.textAlign='center';
  ctx.fillText(b.n+'/'+b.d,b.x,b.y+5);
}
function loop(t){
  if(!run)return;
  var dt=Math.min(50,t-lastT);lastT=t;
  timeLeft-=dt/1000;
  if(timeLeft<=0){timeLeft=0;endGame(true);return;}
  document.getElementById('time').textContent=Math.ceil(timeLeft);
  spawnT-=dt;
  if(spawnT<=0&&bals.length<7){spawn();spawnT=900+Math.random()*600;}
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.15)';
  for(var s=0;s<25;s++)ctx.fillRect((s*89)%W,(s*53)%H,2,2);
  for(var i=bals.length-1;i>=0;i--){
    var b=bals[i];b.y+=b.vy*dt/16;
    if(b.y<-60){bals.splice(i,1);continue;}
    drawBalloon(b);
  }
  for(var p=parts.length-1;p>=0;p--){
    var q=parts[p];q.x+=q.vx;q.y+=q.vy;q.vy+=0.15;q.life--;
    ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4);
    if(q.life<=0)parts.splice(p,1);
  }
  requestAnimationFrame(loop);
}
function endGame(timeout){
  if(over)return;over=true;run=false;
  var best=0;try{best=parseInt(localStorage.getItem('balBest')||'0');}catch(e){}
  var nb='';if(score>best){try{localStorage.setItem('balBest',score);}catch(e){}nb=' 🏅 新紀錄！';}
  document.getElementById('overT').textContent=timeout?'⏰ 時間到！':'💥 氣球爆晒…';
  document.getElementById('overS').innerHTML='得分：<b style="color:#ffe14d">'+score+'</b>'+nb+'<br>最高紀錄：'+Math.max(best,score);
  document.getElementById('over').style.display='flex';
  beep(520,0.15);
}
function resetGame(){
  bals=[];parts=[];score=0;lives=3;timeLeft=60;over=false;spawnT=0;
  document.getElementById('score').textContent='0';
  document.getElementById('lives').textContent='3';
  document.getElementById('over').style.display='none';
  newTarget();run=true;lastT=performance.now();
  requestAnimationFrame(loop);
}
function startGame(){document.getElementById('intro').style.display='none';resetGame();}
window.startGame=startGame;window.resetGame=resetGame;
})();
</script>
</body>
</html>
