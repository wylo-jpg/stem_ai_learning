<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三角神射手 · 先計後射</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);color:#fff;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 20px}
h1{font-size:20px;text-align:center;margin:8px 0 2px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.sub{text-align:center;font-size:13px;color:#aee9ff;margin-bottom:8px}
.hud{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-size:14px}
.diffbar{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.diffbar button{flex:1;max-width:150px;padding:10px 4px;font-size:14px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;min-height:48px}
.diffbar button.on{background:#f59e0b;border-color:#fbbf24;color:#1a1a1a;font-weight:700}
#qcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px;margin-bottom:10px}
#qtext{font-size:16px;line-height:1.6;margin-bottom:6px}
#qtext b{color:#fde68a}
.step{font-size:13px;color:#aee9ff;margin-top:4px}
canvas{width:100%;display:block;border-radius:16px;background:linear-gradient(180deg,#1a2f4b 0%,#0d1b2e 100%);border:1px solid rgba(255,255,255,.15);touch-action:none}
#panel{display:flex;gap:8px;margin-top:10px}
#panel button{flex:1;padding:14px;font-size:16px;border-radius:14px;border:none;min-height:52px;font-weight:700}
#shootBtn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff}
#newBtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
#feedback{min-height:60px;margin-top:10px;font-size:14px;line-height:1.6;background:rgba(0,0,0,.25);border-radius:12px;padding:10px;display:none}
#feedback.show{display:block}
#feedback .ok{color:#4ade80;font-weight:700}
#feedback .no{color:#f87171;font-weight:700}
#feedback .sol{color:#fde68a;margin-top:6px}
.angleread{font-size:15px;text-align:center;margin-top:6px;color:#aee9ff}
.angleread b{font-size:22px;color:#fde68a}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 三角神射手</h1>
<div class="sub">先用三角比計出發射角 θ，再拖曳彈弓瞄準發射（±2° 命中）</div>
<div class="hud">
<span class="pill">第 <b id="qnum">1</b>/8 題</span>
<span class="pill">分數 <b id="score">0</b></span>
<span class="pill">最高 <b id="best">0</b></span>
</div>
<div class="diffbar">
<button data-d="easy" class="on">🌱 初階<br><small>特殊角</small></button>
<button data-d="mid">🌿 中階<br><small>SOHCAHTOA</small></button>
<button data-d="hard">🌳 高階<br><small>兩步計算</small></button>
</div>
<div id="qcard">
<div id="qtext"></div>
<div class="step">① 睇三角形，用三角比計出 θ　② 拖曳下面彈弓，瞄到你計出嘅角度　③ 放手發射！</div>
</div>
<canvas id="cv" width="520" height="380"></canvas>
<div class="angleread">瞄準角度：<b id="aimAng">—</b>°</div>
<div id="panel">
<button id="shootBtn">🚀 發射</button>
<button id="newBtn">↺ 新一局</button>
</div>
<div id="feedback"></div>
</div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=cv.width,H=cv.height;
var diff='easy',qnum=0,score=0,best=+(localStorage.getItem('trig_shooter_best')||0);
var Q=null,aimAngle=null,bird=null,target=null,sling=null,state='aim';
document.getElementById('best').textContent=best;
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- 出題 ---------- */
function genEasy(){
  var t=rnd(0,2),tri,ans,explain;
  if(t===0){
    var hyp=rnd(4,10)*2,adj=hyp/2,opp=Math.round(hyp*Math.sqrt(3)/2);
    tri={a:adj,b:opp,c:hyp};
    ans=30;
    explain='cos θ = 鄰邊/斜邊 = '+adj+'/'+hyp+' = 1/2，∴ θ = 30°（特殊角）';
  }else if(t===1){
    var leg=rnd(3,9);
    tri={a:leg,b:leg,c:Math.round(leg*Math.sqrt(2)*10)/10};
    ans=45;
    explain='tan θ = 對邊/鄰邊 = '+leg+'/'+leg+' = 1，∴ θ = 45°（等腰直角三角形）';
  }else{
    var hyp2=rnd(4,10)*2,opp2=Math.round(hyp2*Math.sqrt(3)/2),adj2=hyp2/2;
    tri={a:adj2,b:opp2,c:hyp2};
    ans=60;
    explain='sin θ = 對邊/斜邊 = '+opp2+'/'+hyp2+' = √3/2，∴ θ = 60°（特殊角）';
  }
  return {tri:tri,ans:ans,explain:explain,
    q:'下圖係直角三角形，已知兩邊長。用三角比求 <b>θ</b>（特殊角）。'};
}
function genMid(){
  var t=rnd(0,2),a,b,ans,formula,explain,tri;
  if(t===0){a=rnd(3,12);b=rnd(3,12);
    ans=Math.round(Math.atan(b/a)*180/Math.PI);
    formula='tan θ = 對邊/鄰邊 = '+b+'/'+a;
    tri={a:a,b:b,c:'?'};
  }else if(t===1){var hyp=rnd(8,20);a=rnd(3,hyp-2);
    ans=Math.round(Math.asin(a/hyp)*180/Math.PI);
    formula='sin θ = 對邊/斜邊 = '+a+'/'+hyp;
    tri={a:'?',b:a,c:hyp};
  }else{var hyp2=rnd(8,20);b=rnd(3,hyp2-2);
    ans=Math.round(Math.acos(b/hyp2)*180/Math.PI);
    formula='cos θ = 鄰邊/斜邊 = '+b+'/'+hyp2;
    tri={a:b,b:'?',c:hyp2};
  }
  explain=formula+'<br>θ = '+ans+'°（準確至最接近的度數）';
  return {tri:tri,ans:ans,explain:explain,
    q:'已知兩邊長，用 <b>SOHCAHTOA</b> 求 <b>θ</b>（準確至最接近的度數）。'};
}
function genHard(){
  var t=rnd(0,1),tri,ans,explain;
  if(t===0){
    var adj=rnd(5,12),opp=rnd(5,12);
    var hyp=Math.sqrt(adj*adj+opp*opp);
    ans=Math.round(Math.atan(opp/adj)*180/Math.PI);
    tri={a:adj,b:'?',c:Math.round(hyp*10)/10};
    explain='第一步：畢氏定理求對邊 = √('+Math.round(hyp*10)/10+'² − '+adj+'²) = '+opp+'<br>第二步：tan θ = '+opp+'/'+adj+'，θ = '+ans+'°';
  }else{
    var dist=rnd(20,50),h=rnd(10,30);
    ans=Math.round(Math.atan(h/dist)*180/Math.PI);
    tri={a:dist,b:h,c:'?'};
    explain='仰角 θ：tan θ = 高/水平距離 = '+h+'/'+dist+'<br>θ = '+ans+'°（準確至最接近的度數）';
  }
  return {tri:tri,ans:ans,explain:explain,
    q:t===0?'兩步計算：先求未知邊長，再求 <b>θ</b>。':'應用題：由地面望向塔頂，求<b>仰角 θ</b>。'};
}
function genQ(){
  if(diff==='easy')return genEasy();
  if(diff==='mid')return genMid();
  return genHard();
}

/* ---------- 繪圖 ---------- */
function drawTri(){
  ctx.clearRect(0,0,W,H);
  if(!Q)return;
  var tri=Q.tri;
  var ox=60,oy=40,w=200,h=160;
  var Ax=ox,Ay=oy+h,Bx=ox+w,By=oy+h,Cx=ox,Cy=oy;
  ctx.strokeStyle='#fde68a';ctx.lineWidth=4;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(Ax,Ay);ctx.lineTo(Bx,By);ctx.lineTo(Cx,Cy);ctx.closePath();ctx.stroke();
  ctx.fillStyle='rgba(253,230,138,.12)';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(Ax-12,Ay-12,12,12);
  ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
  function lab(v,x,y){ctx.fillStyle=v==='?'?'#f87171':'#aee9ff';ctx.fillText(String(v),x,y);}
  lab(tri.a,(Ax+Bx)/2,(Ay+By)/2+24);
  lab(tri.b,(Bx+Cx)/2+18,(By+Cy)/2);
  lab(tri.c,(Cx+Ax)/2-22,(Cy+Ay)/2);
  ctx.fillStyle='#f59e0b';ctx.font='bold 22px sans-serif';
  ctx.fillText('θ',Ax+30,Ay-16);
  ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(Ax,Ay,36,Math.PI*1.5,Math.PI*1.5+0.6);ctx.stroke();
}
function drawSling(){
  var sx=W/2,sy=H-70;
  sling={x:sx,y:sy};
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sx-22,sy+40);ctx.lineTo(sx,sy);ctx.lineTo(sx+22,sy+40);ctx.stroke();
  ctx.font='28px sans-serif';ctx.textAlign='center';
  ctx.fillText('🐦',sx,sy+10);
  if(aimAngle!==null){
    var rad=aimAngle*Math.PI/180;
    var ex=sx+Math.cos(-rad)*130,ey=sy+Math.sin(-rad)*130;
    ctx.strokeStyle='rgba(253,230,138,.6)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.setLineDash([]);
  }
}
function drawTarget(){
  if(!target)return;
  var tx=target.x,ty=target.y;
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(tx,ty,20,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tx,ty,13,0,7);ctx.fill();
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(tx,ty,6,0,7);ctx.fill();
}
function drawBird(){
  if(!bird)return;
  ctx.font='28px sans-serif';ctx.textAlign='center';
  ctx.fillText('🐦',bird.x,bird.y);
}
function render(){drawTri();drawTarget();drawSling();drawBird();}

/* ---------- 遊戲流程 ---------- */
function newQ(){
  qnum++;
  if(qnum>8){endGame();return;}
  document.getElementById('qnum').textContent=qnum;
  Q=genQ();
  document.getElementById('qtext').innerHTML=Q.q;
  var fb=document.getElementById('feedback');
  fb.style.display='none';fb.innerHTML='';
  aimAngle=null;bird=null;state='aim';
  document.getElementById('aimAng').textContent='—';
  var rad=Q.ans*Math.PI/180;
  var sx=W/2,sy=H-70,dist=170;
  target={x:sx+Math.cos(-rad)*dist,y:sy+Math.sin(-rad)*dist};
  target.x=Math.max(30,Math.min(W-30,target.x));
  target.y=Math.max(30,Math.min(H-110,target.y));
  render();
}
function shoot(){
  if(state!=='aim'){return;}
  if(aimAngle===null){alert('先拖曳彈弓瞄準！');return;}
  state='fly';
  var err=Math.abs(aimAngle-Q.ans);
  var hit=err<=2;
  var sx=W/2,sy=H-70;
  var rad=aimAngle*Math.PI/180;
  var dist=hit?Math.hypot(target.x-sx,target.y-sy):220;
  bird={x:sx,y:sy,t:0,dx:Math.cos(-rad)*dist/40,dy:Math.sin(-rad)*dist/40};
  var iv=setInterval(function(){
    bird.t++;bird.x+=bird.dx;bird.y+=bird.dy;render();
    if(bird.t>=40){clearInterval(iv);showResult(hit,err);}
  },30);
}
function showResult(hit,err){
  var fb=document.getElementById('feedback');
  fb.style.display='block';
  if(hit){
    score+=10;
    document.getElementById('score').textContent=score;
    fb.innerHTML='<span class="ok">✅ 命中！</span> 你計出 '+aimAngle+'°，正確係 '+Q.ans+'°（誤差 '+err.toFixed(1)+'°）。<div class="sol">'+Q.explain+'</div>';
  }else{
    fb.innerHTML='<span class="no">❌ 唔中。</span> 你瞄咗 '+aimAngle+'°，正確係 '+Q.ans+'°，差 '+err.toFixed(1)+'°。<div class="sol">💡 正確計法：<br>'+Q.explain+'</div>';
  }
  if(score>best){best=score;try{localStorage.setItem('trig_shooter_best',best);}catch(e){}document.getElementById('best').textContent=best;}
  state='done';
  setTimeout(newQ,hit?2000:5000);
}
function endGame(){
  var fb=document.getElementById('feedback');
  fb.style.display='block';
  fb.innerHTML='<span class="ok">🎉 完成 8 題！</span> 今次得分：'+score+'（最高 '+best+'）<br>撳「↺ 新一局」再玩過。';
  document.getElementById('qtext').innerHTML='局完！';
  Q=null;target=null;bird=null;render();
}
function resetGame(){
  qnum=0;score=0;
  document.getElementById('score').textContent='0';
  newQ();
}

/* ---------- 拖曳瞄準 ---------- */
var dragging=false;
function getPos(e){
  var r=cv.getBoundingClientRect();
  var cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  var cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*(W/r.width),y:cy*(H/r.height)};
}
function updateAim(p){
  if(state!=='aim'||!sling)return;
  var dx=p.x-sling.x,dy=p.y-sling.y;
  var ang=Math.atan2(-dy,dx)*180/Math.PI;
  ang=Math.max(0,Math.min(90,Math.round(ang)));
  aimAngle=ang;
  document.getElementById('aimAng').textContent=ang;
  render();
}
cv.addEventListener('pointerdown',function(e){dragging=true;updateAim(getPos(e));if(e.preventDefault)e.preventDefault();});
cv.addEventListener('pointermove',function(e){if(dragging)updateAim(getPos(e));});
window.addEventListener('pointerup',function(){dragging=false;});
document.getElementById('shootBtn').addEventListener('click',shoot);
document.getElementById('newBtn').addEventListener('click',resetGame);
document.querySelectorAll('.diffbar button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.diffbar button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');diff=b.dataset.d;resetGame();
  });
});
resetGame();
</script>
</body>
</html>
