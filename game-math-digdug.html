<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>數學掘地蟲</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Courier New",Courier,"Microsoft JhengHei",monospace;background:#0d1b2a;color:#e0f2fe;min-height:100vh;touch-action:manipulation}
.scan{position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px)}
header{background:#1b2a4a;border-bottom:4px solid #f472b6;padding:12px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:2px;color:#ffe14d;text-shadow:2px 2px 0 #831843}
.hud{display:flex;justify-content:space-around;background:#1b2a4a;padding:10px;font-size:14px;font-weight:700;border-bottom:4px solid #f472b6}
.hud b{color:#ffe14d}
.target{background:#1b2a4a;text-align:center;padding:8px;font-size:18px;font-weight:800;color:#7CFC98;border-bottom:4px solid #f472b6}
.back{display:block;text-align:center;background:#24365c;color:#a9c6f2;text-decoration:none;padding:12px;font-size:15px;font-weight:700}
.wrap{max-width:460px;margin:0 auto;padding:12px 12px 40px}
#cv{width:100%;height:auto;display:block;background:#0d1b2a;border:4px solid #f472b6;image-rendering:pixelated;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px auto;max-width:340px}
.pbtn{min-height:60px;font-size:24px;font-weight:800;font-family:inherit;background:#1b2a4a;color:#fff;border:4px solid #f472b6;border-radius:0;cursor:pointer}
.pbtn:active{background:#f472b6;transform:scale(.96)}
.tip{text-align:center;font-size:13px;color:#a9c6f2;margin-top:4px}
#msg{min-height:30px;text-align:center;font-size:15px;font-weight:700;margin-top:8px;color:#7CFC98}
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.96);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:#1b2a4a;border:4px solid #f472b6;padding:26px 22px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto}
.card h2{margin:0 0 10px;color:#ffe14d;font-size:22px;letter-spacing:2px}
.card p,.card li{font-size:15px;line-height:1.7}
.card ul{padding-left:20px}
.concept{background:#0d1b2a;border:2px solid #f472b6;padding:12px;margin:12px 0;font-size:14px}
.concept b{color:#7CFC98}
.card button{width:100%;min-height:58px;font-size:18px;font-weight:800;font-family:inherit;background:#e33;color:#fff;border:4px solid #fff;margin-top:10px;cursor:pointer;letter-spacing:2px}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
</style>
</head>
<body>
<div class="scan"></div>
<header><h1>⛏️ 數學掘地蟲</h1></header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<div class="wrap">
<div class="hud"><div>❤ <b id="lives">3</b></div><div>💎 <b id="gems">0</b>/5</div><div>⭐ <b id="score">0</b></div></div>
<div class="target">🎯 題目：<span id="tgt">—</span> ＝ ?</div>
<canvas id="cv" width="384" height="320"></canvas>
<div class="pad">
<div></div><button class="pbtn" id="up">▲</button><div></div>
<button class="pbtn" id="lf">◀</button><button class="pbtn" id="dn">▼</button><button class="pbtn" id="rt">▶</button>
</div>
<div class="tip">方向掣行路 · 撳隔籬泥土掘窿 · 行到寶石度：啱答案＋150，錯答案扣命！避開紅色怪獸</div>
<div id="msg"></div>
</div>
<div class="overlay" id="intro"><div class="card">
<h2>⛏️ 數學掘地蟲</h2>
<p><b>玩法：</b>地底有寶石，每粒寫住個數字。心算題目答案，掘窿去拎<b>等於答案</b>嘅寶石！錯答案寶石係陷阱，紅色怪獸會追你。拎齊 5 粒啱寶石過一版，共 3 版。</p>
<div class="concept">💡 <b>數學概念：</b>整數運算（＋－×÷）。先計答案，再揀寶石，唔好貪心！</div>
<button onclick="startGame()">▶ START</button>
<p class="blink" style="text-align:center;color:#a9c6f2">★ 8-BIT 挑戰 ★</p>
</div></div>
<div class="overlay" id="over" style="display:none"><div class="card">
<h2 id="overT">🏁 完成！</h2>
<p id="overS" style="font-size:17px"></p>
<button onclick="resetGame()">🔁 再玩一次</button>
</div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.07;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
var CS=32,COLS=12,ROWS=10;
var grid,gems,mons,px,py,lives,score,gemsGot,ans,level,moveCD,over,paused;
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function fmtD(n){return (''+n).replace(/-/g,'−');}
function mkQ(lv){
  var a,b,ans,q;
  if(lv===1){a=ri(4,20);b=ri(4,20);if(Math.random()<0.5){ans=a+b;q=a+' + '+b;}else{ans=a-b;q=a+' − '+b;}}
  else if(lv===2){a=ri(3,9);b=ri(3,9);if(Math.random()<0.5){ans=a*b;q=a+' × '+b;}else{ans=a;a=ans*b;q=a+' ÷ '+b;}}
  else{a=ri(-9,9);b=ri(-9,9);var t=Math.random();
    if(t<0.4){ans=a+b;q=fmtD(a)+' + '+fmtD(b);}
    else if(t<0.7){ans=a*b;q=fmtD(a)+' × '+fmtD(b);}
    else{ans=a-b;q=fmtD(a)+' − '+fmtD(b);}}
  return {q:q+' = ?',ans:ans};
}
function buildLevel(){
  grid=[];gems=[];mons=[];
  for(var r=0;r<ROWS;r++){grid.push([]);for(var c=0;c<COLS;c++)grid[r].push(r===0?0:1);}
  px=6;py=0;
  var q=mkQ(level);ans=q.ans;
  document.getElementById('tgt').textContent=q.q;
  var spots=[];
  for(var r2=2;r2<ROWS;r2++)for(var c2=1;c2<COLS-1;c2++)spots.push([r2,c2]);
  spots.sort(function(){return Math.random()-0.5;});
  var wrongs=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3,ans-3];
  wrongs=wrongs.filter(function(v,i){return wrongs.indexOf(v)===i;});
  for(var i=0;i<5;i++)gems.push({r:spots[i][0],c:spots[i][1],v:ans,ok:true,got:false});
  for(var j=0;j<4;j++)gems.push({r:spots[5+j][0],c:spots[5+j][1],v:wrongs[j%wrongs.length],ok:false,got:false});
  mons=[{r:8,c:1},{r:8,c:10}];
  mons.forEach(function(m){grid[m.r][m.c]=0;});
  gemsGot=0;
  document.getElementById('gems').textContent='0';
}
function draw(){
  ctx.clearRect(0,0,COLS*CS,ROWS*CS);
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var x=c*CS,y=r*CS;
    if(r===0){ctx.fillStyle='#0d1b2a';ctx.fillRect(x,y,CS,CS);}
    else if(grid[r][c]===1){ctx.fillStyle='#6b4226';ctx.fillRect(x,y,CS,CS);
      ctx.fillStyle='#54331d';ctx.fillRect(x+5,y+7,4,4);ctx.fillRect(x+20,y+18,4,4);ctx.fillRect(x+10,y+24,4,4);
      ctx.fillStyle='#8a5a30';ctx.fillRect(x,y,CS,2);}
    else{ctx.fillStyle='#0d1b2a';ctx.fillRect(x,y,CS,CS);}
  }
  gems.forEach(function(g){
    if(g.got)return;
    var x=g.c*CS,y=g.r*CS;
    ctx.fillStyle=g.ok?'#22d3ee':'#f472b6';
    ctx.beginPath();ctx.moveTo(x+CS/2,y+5);ctx.lineTo(x+CS-5,y+CS/2);ctx.lineTo(x+CS/2,y+CS-5);ctx.lineTo(x+5,y+CS/2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
    ctx.fillText(fmtD(g.v),x+CS/2,y+CS/2+5);
  });
  mons.forEach(function(m){
    var x=m.c*CS,y=m.r*CS;
    ctx.fillStyle='#dc2626';ctx.fillRect(x+6,y+6,CS-12,CS-12);
    ctx.fillStyle='#fff';ctx.fillRect(x+10,y+10,5,6);ctx.fillRect(x+CS-15,y+10,5,6);
    ctx.fillStyle='#000';ctx.fillRect(x+11,y+12,3,3);ctx.fillRect(x+CS-14,y+12,3,3);
  });
  var x=px*CS,y=py*CS;
  ctx.fillStyle='#facc15';ctx.fillRect(x+7,y+7,CS-14,CS-14);
  ctx.fillStyle='#000';ctx.fillRect(x+11,y+11,4,5);ctx.fillRect(x+CS-15,y+11,4,5);
  ctx.fillStyle='#7c4a1e';ctx.fillRect(x+CS/2-2,y+CS-12,4,8);
}
function dug(r,c){return r>=0&&c>=0&&r<ROWS&&c<COLS&&grid[r][c]===0;}
function move(dr,dc){
  if(paused||over||moveCD>performance.now())return;
  moveCD=performance.now()+170;
  var nr=py+dr,nc=px+dc;
  if(dug(nr,nc)){py=nr;px=nc;beep(440,0.05);afterMove();}
  draw();
}
function afterMove(){
  for(var i=0;i<gems.length;i++){
    var g=gems[i];
    if(!g.got&&g.r===py&&g.c===px){
      g.got=true;
      if(g.ok){beep(880,0.1);score+=150;gemsGot++;
        document.getElementById('score').textContent=score;
        document.getElementById('gems').textContent=gemsGot;
        document.getElementById('msg').textContent='💎 啱答案！+150';
        if(gemsGot>=5){nextLevel();return;}
      }else{beep(160,0.25);lives--;
        document.getElementById('lives').textContent=lives;
        document.getElementById('msg').textContent='💥 錯答案陷阱！正確係 '+fmtD(ans);
        if(lives<=0){lose();return;}
      }
    }
  }
  mons.forEach(function(m){if(m.r===py&&m.c===px)hit();});
}
function nextLevel(){
  level++;
  if(level>3){win();return;}
  document.getElementById('msg').textContent='🗺️ 第 '+level+' 版！';
  buildLevel();draw();
}
function hit(){
  beep(160,0.25);lives--;
  document.getElementById('lives').textContent=lives;
  document.getElementById('msg').textContent='💥 俾怪獸捉到！';
  px=6;py=0;
  if(lives<=0)lose();
}
cv.addEventListener('pointerdown',function(e){
  if(paused||over)return;
  var r=cv.getBoundingClientRect();
  var c=Math.floor((e.clientX-r.left)/(r.width/COLS)),rr=Math.floor((e.clientY-r.top)/(r.height/ROWS));
  if(Math.abs(c-px)+Math.abs(rr-py)===1&&rr>0&&grid[rr][c]===1){
    grid[rr][c]=0;beep(220,0.08);
    document.getElementById('msg').textContent='⛏️ 掘開咗！';
    draw();
  }
});
setInterval(function(){
  if(paused||over||document.getElementById('intro').style.display!=='none')return;
  mons.forEach(function(m){
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){
      var r=m.r+d[0],c=m.c+d[1];return dug(r,c);
    });
    if(dirs.length){var d=dirs[ri(0,dirs.length-1)];m.r+=d[0];m.c+=d[1];}
    if(m.r===py&&m.c===px)hit();
  });
  draw();
},1000);
function win(){
  over=true;
  var total=score+lives*200;
  var best=0;try{best=parseInt(localStorage.getItem('digBest')||'0');}catch(e){}
  var nb='';if(total>best){try{localStorage.setItem('digBest',total);}catch(e){}nb=' 🏅 新紀錄！';}
  document.getElementById('overT').textContent='🏆 掘地大師！';
  document.getElementById('overS').innerHTML='3 版全過！總分：<b style="color:#ffe14d">'+total+'</b>'+nb;
  document.getElementById('over').style.display='flex';
  beep(660,0.1);setTimeout(function(){beep(880,0.15);},130);
}
function lose(){
  over=true;
  document.getElementById('overT').textContent='💥 掘地蟲陣亡…';
  document.getElementById('overS').innerHTML='去到第 '+level+' 版，得分 '+score+'。再接再厲！';
  document.getElementById('over').style.display='flex';
}
function resetGame(){
  level=1;lives=3;score=0;over=false;paused=false;moveCD=0;
  document.getElementById('lives').textContent='3';
  document.getElementById('score').textContent='0';
  document.getElementById('msg').textContent='';
  document.getElementById('over').style.display='none';
  buildLevel();draw();
}
function startGame(){document.getElementById('intro').style.display='none';resetGame();}
document.getElementById('up').addEventListener('pointerdown',function(){move(-1,0);});
document.getElementById('dn').addEventListener('pointerdown',function(){move(1,0);});
document.getElementById('lf').addEventListener('pointerdown',function(){move(0,-1);});
document.getElementById('rt').addEventListener('pointerdown',function(){move(0,1);});
window.startGame=startGame;window.resetGame=resetGame;
draw();
})();
</script>
</body>
</html>
