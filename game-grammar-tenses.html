<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>時態分類員</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;touch-action:pan-y}
header{background:linear-gradient(135deg,#1e3a8a,#3b82f6);padding:16px;text-align:center}
header h1{margin:0;font-size:22px}
.back{display:block;text-align:center;background:#1e293b;color:#93c5fd;text-decoration:none;padding:12px;font-size:16px;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
.hud{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;margin-bottom:10px}
.hud span{color:#fbbf24}
.stage{position:relative;min-height:170px;background:#1e293b;border-radius:14px;margin-bottom:12px;overflow:hidden}
.fallcard{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#3b82f6;color:#fff;font-size:18px;font-weight:700;line-height:1.5;padding:16px 20px;border-radius:14px;max-width:92%;text-align:center;cursor:grab;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none;z-index:5}
.fallcard.dragging{cursor:grabbing;box-shadow:0 12px 28px rgba(0,0,0,.55);z-index:10}
.fallcard.selected{outline:4px solid #fbbf24}
.hint{text-align:center;font-size:14px;color:#94a3b8;padding:8px}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.box{min-height:120px;border-radius:14px;border:3px dashed #475569;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;font-size:15px;font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .1s}
.box .em{font-size:34px}
.box small{font-weight:600;font-size:12px;color:#cbd5e1}
.box.past{background:#7c2d12}.box.present{background:#14532d}.box.future{background:#4c1d95}
.box.hi{transform:scale(1.05);border-style:solid;border-color:#fbbf24}
.box.flash-ok{animation:ok .5s}
.box.flash-bad{animation:bad .5s}
@keyframes ok{0%{background:#166534}100%{}}
@keyframes bad{0%{background:#7f1d1d}100%{}}
.fallcard.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 10px))}75%{transform:translateX(calc(-50% + 10px))}}
.fb{min-height:34px;text-align:center;font-size:16px;font-weight:700;margin-top:8px}
.fb.good{color:#4ade80}.fb.bad{color:#f87171}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.96);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto}
.overlay.hide{display:none}
.card{background:#1e293b;border-radius:18px;padding:26px 22px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto}
.card h2{margin:0 0 10px;font-size:24px;color:#93c5fd}
.card p,.card li{font-size:15px;line-height:1.7}
.card ul{padding-left:20px}
.concept{background:#0f172a;border-radius:12px;padding:14px;margin:14px 0;font-size:14px;line-height:1.7}
.concept b{color:#4ade80}
.card .go{width:100%;min-height:56px;font-size:18px;font-weight:800;background:#3b82f6;color:#fff;border:none;border-radius:14px;margin-top:10px;cursor:pointer;touch-action:manipulation}
#finalScore{font-size:18px;line-height:1.8}
</style>
</head>
<body>
<header><h1>⏰ 時態分類員</h1></header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<div class="wrap">
<div class="hud"><div>第 <span id="qnum">1</span>/10 句</div><div>⭐ <span id="score">0</span></div><div>✅ <span id="acc">-</span></div></div>
<div class="stage" id="stage">
<div class="hint" id="stagetip">👆 拖曳上面嘅句子去啱嘅盒子<br>（或者撳句子再撳盒子）</div>
<div class="fallcard" id="card"></div>
</div>
<div class="boxes">
<div class="box past" data-t="past"><div class="em">🕰️</div>過去<small>Past</small></div>
<div class="box present" data-t="present"><div class="em">👀</div>現在<small>Present</small></div>
<div class="box future" data-t="future"><div class="em">🔮</div>將來<small>Future</small></div>
</div>
<div class="fb" id="fb"></div>
</div>
<div class="overlay" id="intro"><div class="card">
<h2>⏰ 時態分類員</h2>
<p><b>玩法：</b>句子會喺上面出現，<b>拖曳</b>佢去正確嘅時態盒子（過去／現在／將來）！唔想拖？撳一下句子，再撳盒子都得。共 10 句，拖錯扣 20 分，答啱 +100 分！</p>
<div class="concept">💡 <b>文法概念：</b>睇時間標記就知時態：
<br>• <b>過去</b>：yesterday、last week、ago
<br>• <b>現在</b>：every day、now、Look!
<br>• <b>將來</b>：tomorrow、next month、will</div>
<button class="go" id="startbtn">開始分類！</button>
</div></div>
<div class="overlay hide" id="end"><div class="card">
<h2>🏁 完成！</h2>
<p id="finalScore"></p>
<button class="go" id="againbtn">🔁 再玩一次</button>
</div></div>
<script>
(function(){
"use strict";
var S=[
{s:"I visited my grandma last Sunday.",t:"past",e:"last Sunday 係過去時間 → 過去式 visited。"},
{s:"She finished her homework an hour ago.",t:"past",e:"ago（…之前）一定係過去式。"},
{s:"They played basketball yesterday.",t:"past",e:"yesterday → 過去式 played。"},
{s:"She goes to school by bus every day.",t:"present",e:"every day 表示習慣 → Present Simple；She 第三人稱單數加 s。"},
{s:"Look! The baby is crying.",t:"present",e:"Look! 表示而家發生緊 → Present Continuous（is crying）。"},
{s:"I am doing my homework now.",t:"present",e:"now → 而家進行緊 → Present Continuous。"},
{s:"Dogs bark loudly.",t:"present",e:"講事實／習慣 → Present Simple。"},
{s:"I will help you tomorrow.",t:"future",e:"will + tomorrow → 將來。"},
{s:"We are going to travel next month.",t:"future",e:"be going to + next month → 將來。"},
{s:"She will call you later.",t:"future",e:"will + later → 將來。"}
];
var idx=0,score=0,correct=0,best=0,locked=false,order=[],selected=false,cardShown=false;
try{best=parseInt(localStorage.getItem('tenseSortBest')||'0',10)||0;}catch(e){}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function $(id){return document.getElementById(id);}
var card=$('card'),stage=$('stage');
var drag=null;
function showCard(){
  locked=false;selected=false;
  card.classList.remove('selected');
  $('qnum').textContent=idx+1;
  $('fb').className='fb';$('fb').textContent='';
  var item=S[order[idx]];
  card.textContent=item.s;
  card.style.transform='translateX(-50%)';
  card.style.left='50%';card.style.top='14px';
  card.style.display='block';
  cardShown=true;
}
function dropOn(box){
  if(locked||!cardShown)return;
  locked=true;
  var item=S[order[idx]];
  var ok=(box.getAttribute('data-t')===item.t);
  if(ok){
    box.classList.add('flash-ok');
    score+=100;correct++;selected=false;
    $('fb').className='fb good';
    $('fb').textContent='✅ 正確！+100 分｜'+item.e;
    card.style.display='none';cardShown=false;
    setTimeout(function(){box.classList.remove('flash-ok');next();},1100);
  }else{
    box.classList.add('flash-bad');
    card.classList.add('shake');
    score=Math.max(0,score-20);selected=false;card.classList.remove('selected');
    $('fb').className='fb bad';
    $('fb').textContent='❌ 唔啱！扣 20 分，再試過｜'+item.e;
    setTimeout(function(){box.classList.remove('flash-bad');card.classList.remove('shake');locked=false;},600);
  }
  $('score').textContent=score;
  $('acc').textContent=Math.round(correct/(idx+1)*100)+'%';
}
function next(){idx++;if(idx>=S.length){endGame();}else{showCard();}}
function endGame(){
  $('end').classList.remove('hide');
  var nb='';
  if(score>best){try{localStorage.setItem('tenseSortBest',String(score));}catch(e){}best=score;nb=' 🏅 新紀錄！';}
  var acc=Math.round(correct/S.length*100);
  $('finalScore').innerHTML='總分：<b>'+score+'</b> 分'+nb+'<br>準確率：'+acc+'%（'+correct+'/'+S.length+'）<br>歷史最佳：'+best+' 分<br>'+(acc===100?'🌟 完美分類員！':'💪 記住時間標記：ago/yesterday→過去，now/Look→現在，will/tomorrow→將來！');
}
function reset(){
  idx=0;score=0;correct=0;
  order=shuffle(S.map(function(_,i){return i;}));
  $('score').textContent='0';$('acc').textContent='-';
  $('end').classList.add('hide');showCard();
}
/* --- 拖曳（pointer events，mouse+touch 通用）--- */
card.addEventListener('pointerdown',function(e){
  if(locked)return;
  e.preventDefault();
  try{card.setPointerCapture(e.pointerId);}catch(err){}
  var r=card.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  drag={dx:e.clientX-r.left,dy:e.clientY-r.top,sr:sr};
  card.classList.add('dragging');
});
card.addEventListener('pointermove',function(e){
  if(!drag||locked)return;
  e.preventDefault();
  var sr=drag.sr;
  var x=e.clientX-sr.left-drag.dx, y=e.clientY-sr.top-drag.dy;
  x=Math.max(-20,Math.min(sr.width-60,x));
  y=Math.max(0,Math.min(sr.height-40,y));
  card.style.left=x+'px';card.style.top=y+'px';card.style.transform='none';
});
function endDrag(e){
  if(!drag)return;
  card.classList.remove('dragging');
  var cr=card.getBoundingClientRect();
  var cx=cr.left+cr.width/2, cy=cr.top+cr.height/2;
  drag=null;
  var boxes=document.querySelectorAll('.box'),hit=null;
  boxes.forEach(function(b){
    var r=b.getBoundingClientRect();
    b.classList.remove('hi');
    if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom)hit=b;
  });
  if(hit){dropOn(hit);}
  else{
    /* 冇掟中盒子：當係撳選 */
    toggleSelect();
    card.style.transform='translateX(-50%)';card.style.left='50%';card.style.top='14px';
  }
}
card.addEventListener('pointerup',endDrag);
card.addEventListener('pointercancel',function(){drag=null;card.classList.remove('dragging');card.style.transform='translateX(-50%)';card.style.left='50%';card.style.top='14px';});
function toggleSelect(){
  if(locked)return;
  selected=!selected;
  card.classList.toggle('selected',selected);
  $('fb').className='fb';$('fb').textContent=selected?'👆 已選取，再撳一個盒子':'';
}
document.querySelectorAll('.box').forEach(function(b){
  b.addEventListener('click',function(){
    if(selected){dropOn(b);}
  });
});
$('startbtn').addEventListener('click',function(){$('intro').classList.add('hide');reset();});
$('againbtn').addEventListener('click',reset);
reset();
$('intro').classList.remove('hide');
})();
</script>
</body>
</html>
