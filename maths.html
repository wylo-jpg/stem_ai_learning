<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>數學教學資源</title>
<style>
:root{--blue:#2563eb;--ink:#1f2937;--muted:#6b7280;--bg:#f3f4f6;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;padding:28px 24px;text-align:center}
header h1{margin:0 0 8px;font-size:26px}
header p{margin:0;opacity:.9;font-size:14px}
nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 16px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:10}
nav a{padding:14px 18px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav a.active{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{border:1px solid #d1d5db;background:#fff;border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer}
.filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column}
.card .cat{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:0 0 14px;font-size:13.5px;color:var(--muted);flex:1}
.card .tags{margin-bottom:12px}
.card .tag{display:inline-block;background:#eff6ff;color:#1d4ed8;font-size:11px;padding:3px 10px;border-radius:12px;margin-right:6px}
.card a.open{align-self:flex-start;background:var(--blue);color:#fff;text-decoration:none;padding:9px 22px;border-radius:8px;font-size:14px;font-weight:600}
.card a.open:hover{background:#1d4ed8}
.loading,.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>📐 數學教學資源</h1>
<p>互動工具 · 練習 · 遊戲 — 免費使用</p>
</header>
<nav>
<a href="index.html">🏠 首頁</a>
<a href="maths.html" class="active">📐 數學</a>
<a href="videos.html">🎬 影片</a>
<a href="games.html">🎮 遊戲</a>
<a href="stem.html">🔬 STEM</a>
<a href="ai.html">🤖 AI</a>
<a href="news.html">📰 資訊</a>
</nav>
<main>
<div class="filter-row" id="filters"></div>
<div class="grid" id="grid"><div class="loading">載入緊…</div></div>
</main>
<footer>教學資源共享 · 歡迎老師同學生使用</footer>

<script>
const SHEET_ID = '1_u6osVsOnWNNcvHqmv15nc0HZ6wSd4CWGiwHBCYkxfg';
const SHEET_NAME = '數學資源';
// 後備資料（Sheet 讀唔到嗰陣用）
const FALLBACK = [
  {cat:'互動工具',title:'三元一次方程 Cramer\'s Rule',desc:'輸入係數即時睇 D、Dx、Dy、Dz，Sarrus 展開，支援字母參數',link:'',tag:'方程'},
  {cat:'互動工具',title:'3D 向量投影到平面',desc:'拖動向量睇投影動畫，逐步計算',link:'',tag:'向量'},
  {cat:'互動工具',title:'2×2 矩陣特徵分解',desc:'A=PDP⁻¹ 五步計算＋幾何變換動畫',link:'',tag:'矩陣'},
  {cat:'互動工具',title:'Linear Programming',desc:'畫可行域，掃描動畫搵 max/min',link:'',tag:'不等式'},
  {cat:'互動工具',title:'DSE M2 出題機',desc:'16 個課題隨機出題，附詳細步驟',link:'',tag:'DSE'},
];
let allItems = [];
let activeFilter = '全部';

async function loadData(){
  try{
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47).slice(0,-2));
    const rows = json.table.rows || [];
    const items = [];
    for(let i=1;i<rows.length;i++){
      const c = rows[i].c || [];
      const v = k => c[k] && c[k].v ? String(c[k].v) : '';
      if(v(5).toUpperCase() !== 'TRUE') continue;
      items.push({cat:v(0),title:v(1),desc:v(2),link:v(3),tag:v(4)});
    }
    if(items.length) { allItems = items; render(); return; }
  }catch(e){ /* fallback */ }
  allItems = FALLBACK;
  render();
}

function render(){
  const grid = document.getElementById('grid');
  const cats = ['全部', ...new Set(allItems.map(i=>i.cat).filter(Boolean))];
  document.getElementById('filters').innerHTML = cats.map(c=>
    `<button class="filter-btn ${c===activeFilter?'active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
  const list = activeFilter==='全部' ? allItems : allItems.filter(i=>i.cat===activeFilter);
  if(!list.length){ grid.innerHTML = '<div class="empty">呢個分類暫時未有資源</div>'; return; }
  grid.innerHTML = list.map(i=>`
    <div class="card">
      <div class="cat">${i.cat||''}</div>
      <h3>${i.title||''}</h3>
      <p>${i.desc||''}</p>
      <div class="tags">${i.tag?`<span class="tag">${i.tag}</span>`:''}</div>
      ${i.link?`<a class="open" href="${i.link}" target="_blank">開啟 →</a>`:'<span style="font-size:12px;color:var(--muted)">連結稍後補上</span>'}
    </div>`).join('');
}
function setFilter(c){ activeFilter = c; render(); }
loadData();
</script>
</body>
</html>
