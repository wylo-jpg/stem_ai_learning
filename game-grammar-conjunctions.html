<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>句子合併師</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#172554;color:#e0e7ff;min-height:100vh}
header{background:linear-gradient(135deg,#1d4ed8,#3b82f6);padding:14px;text-align:center}
header h1{margin:0;font-size:22px}
.back{display:block;text-align:center;color:#93c5fd;text-decoration:none;padding:10px;font-size:15px}
.hud{display:flex;justify-content:space-around;background:#1e3a8a;padding:10px;font-size:15px;font-weight:700}
.hud span{color:#fbbf24}
main{max-width:640px;margin:0 auto;padding:14px}
.scards{display:flex;gap:10px;margin:6px 0}
.scard{flex:1;background:#1e3a8a;border-radius:12px;padding:14px;font-size:17px;text-align:center;font-weight:600}
.scard .lbl{font-size:14px;color:#93c5fd;display:block;margin-bottom:4px}
#stage1 h3,#stage2 h3{font-size:17px;margin:14px 0 8px;color:#bfdbfe}
#conjRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.conj{min-height:56px;min-width:88px;font-size:19px;font-weight:800;border-radius:12px;border:2px solid #3b82f6;background:#172554;color:#e0e7ff;cursor:pointer;padding:10px 16px}
.conj:active{transform:scale(.95)}
.conj.right{border-color:#4ade80;background:#14532d}
#stage2{display:none}
#tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.tile{background:#e0e7ff;color:#172554;font-size:19px;font-weight:700;min-height:54px;border-radius:12px;border:none;cursor:pointer;padding:10px 16px}
.tile:active{transform:scale(.95)}
#answer{background:#0f1e4d;border:2px dashed #3b82f6;border-radius:12px;min-height:70px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
#answer .hint{color:#64748b;font-size:14px;width:100%;text-align:center}
.at{background:#fbbf24;color:#172554;font-size:19px;font-weight:700;min-height:50px;border-radius:10px;border:none;cursor:pointer;padding:8px 14px}
#btnrow{display:flex;gap:10px;margin-top:10px}
#checkBtn{flex:1;min-height:58px;font-size:19px;font-weight:800;border:none;border-radius:14px;background:#22c55e;color:#052e16;cursor:pointer}
#clearBtn{flex:1;min-height:58px;font-size:19px;font-weight:800;border:none;border-radius:14px;background:#475569;color:#fff;cursor:pointer}
#fb{min-height:42px;text-align:center;font-size:17px;font-weight:700;margin-top:10px}
#fb.good{color:#4ade80}
#fb.bad{color:#f87171}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.tip{font-size:14px;color:#93c5fd;text-align:center;margin:2px 0 4px}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.95);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:#1e3a8a;border-radius:20px;padding:26px 22px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto}
.card h2{margin:0 0 12px;font-size:24px;color:#bfdbfe}
.card p,.card li{font-size:16px;line-height:1.7}
.card ul{padding-left:20px}
.concept{background:#172554;border-radius:12px;padding:14px;margin:14px 0;font-size:15px;line-height:1.8}
.concept b{color:#4ade80}
.card button{width:100%;min-height:56px;font-size:18px;font-weight:700;background:#3b82f6;color:#fff;border:none;border-radius:14px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<header><h1>🔗 句子合併師</h1></header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<div class="hud"><div>🔗 第 <span id="round">1</span>/8 題</div><div>⭐ <span id="score">0</span> 分</div></div>
<main>
<div class="scards">
<div class="scard"><span class="lbl">句子一</span><span id="s1"></span></div>
<div class="scard"><span class="lbl">句子二</span><span id="s2"></span></div>
</div>
<div id="stage1">
<h3>第一步：揀啱連接詞</h3>
<div id="conjRow"></div>
<div class="tip">8 個連接詞入面只有一個啱，諗下兩句係咩關係！</div>
</div>
<div id="stage2">
<h3>第二步：撳次序砌成一句</h3>
<div id="tiles"></div>
<div class="tip">👆 撳字砌句子（撳答案欄嘅字可以拎走）</div>
<div id="answer"><span class="hint">撳上面嘅字，砌出合併後嘅句子</span></div>
<div id="btnrow">
<button id="checkBtn">✅ 對答案</button>
<button id="clearBtn">🧹 清除</button>
</div>
</div>
<div id="fb"></div>
</main>
<div class="overlay" id="intro"><div class="card">
<h2>🔗 句子合併師</h2>
<p><b>玩法：</b>有兩句句子。第一步：由 8 個連接詞入面揀啱嗰個（因為？所以？雖然？）。第二步：撳打散咗嘅字，砌返成一句通順嘅合併句。8 題！</p>
<div class="concept">💡 <b>文法概念：</b><b>because</b>（因為）講原因、<b>so</b>（所以）講結果、<b>although</b>（雖然）講讓步、<b>but</b>（但係）講對比、<b>or</b>（否則）講選擇。合併之後意思要同原本兩句一樣！</div>
<button onclick="startGame()">開始合併！</button>
</div></div>
<div class="overlay" id="over" style="display:none"><div class="card">
<h2>🏁 合併完成！</h2>
<p id="finalScore" style="font-size:18px"></p>
<button onclick="newGame()">🔁 再玩一次</button>
</div></div>
<script>
var CONJS=["because","so","although","but","and","or","if","when"];
var ROUNDS=[
 {s1:"It was raining.",s2:"We stayed home.",conj:"because",target:"We stayed home because it was raining.",tiles:["We","stayed","home","because","it","was","raining"]},
 {s1:"She was tired.",s2:"She kept working.",conj:"although",target:"She kept working although she was tired.",tiles:["She","kept","working","although","she","was","tired"]},
 {s1:"I was hungry.",s2:"I ate a sandwich.",conj:"so",target:"I was hungry so I ate a sandwich.",tiles:["I","was","hungry","so","I","ate","a","sandwich"]},
 {s1:"The movie was boring.",s2:"We left early.",conj:"so",target:"The movie was boring so we left early.",tiles:["The","movie","was","boring","so","We","left","early"]},
 {s1:"He studied hard.",s2:"He passed the exam.",conj:"because",target:"He passed the exam because he studied hard.",tiles:["He","passed","the","exam","because","he","studied","hard"]},
 {s1:"It was late.",s2:"They went home.",conj:"so",target:"It was late so they went home.",tiles:["It","was","late","so","They","went","home"]},
 {s1:"She likes coffee.",s2:"He likes tea.",conj:"but",target:"She likes coffee but he likes tea.",tiles:["She","likes","coffee","but","he","likes","tea"]},
 {s1:"Hurry up.",s2:"You will miss the bus.",conj:"or",target:"Hurry up or you will miss the bus.",tiles:["Hurry","up","or","you","will","miss","the","bus"]}
];
var idx=0,score=0,best=0,conjTries=0,pool=[],answer=[],clock=false;
try{best=parseInt(localStorage.getItem("conjBest")||"0");}catch(e){}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function upd(){
  document.getElementById("round").textContent=Math.min(idx+1,8);
  document.getElementById("score").textContent=score;
}
function render(){
  var r=ROUNDS[idx];
  document.getElementById("s1").textContent=r.s1;
  document.getElementById("s2").textContent=r.s2;
  document.getElementById("stage1").style.display="block";
  document.getElementById("stage2").style.display="none";
  document.getElementById("fb").textContent="";document.getElementById("fb").className="";
  conjTries=0;
  var row=document.getElementById("conjRow");row.innerHTML="";
  var cs=shuffle(CONJS.slice());
  for(var i=0;i<cs.length;i++){
    (function(c){
      var b=document.createElement("button");
      b.className="conj";b.textContent=c;
      b.addEventListener("click",function(){
        var fb=document.getElementById("fb");
        if(c===r.conj){
          b.classList.add("right");
          var pts=conjTries===0?40:20;score+=pts;upd();
          fb.textContent="✅ "+c+" 啱！（+"+pts+"）而家砌句子…";
          fb.className="good";
          setTimeout(startTiles,800);
        }else{
          conjTries++;
          fb.textContent="❌ 唔係 "+c+"，諗下兩句係咩關係！";
          fb.className="bad";
          b.classList.add("shake");setTimeout(function(){b.classList.remove("shake");},450);
        }
      });
      row.appendChild(b);
    })(cs[i]);
  }
  upd();
}
function startTiles(){
  var r=ROUNDS[idx];
  document.getElementById("stage1").style.display="none";
  document.getElementById("stage2").style.display="block";
  document.getElementById("fb").textContent="";document.getElementById("fb").className="";
  pool=shuffle(r.tiles.slice());answer=[];
  drawTiles();drawAnswer();
}
function drawTiles(){
  var t=document.getElementById("tiles");t.innerHTML="";
  for(var i=0;i<pool.length;i++){
    (function(w,n){
      var b=document.createElement("button");
      b.className="tile";b.textContent=w;
      b.addEventListener("click",function(){
        pool.splice(n,1);answer.push(w);drawTiles();drawAnswer();
      });
      t.appendChild(b);
    })(pool[i],i);
  }
}
function drawAnswer(){
  var a=document.getElementById("answer");a.innerHTML="";
  if(answer.length===0){
    var h=document.createElement("span");h.className="hint";
    h.textContent="撳上面嘅字，砌出合併後嘅句子";a.appendChild(h);return;
  }
  for(var i=0;i<answer.length;i++){
    (function(w,n){
      var b=document.createElement("button");
      b.className="at";b.textContent=w;
      b.addEventListener("click",function(){
        answer.splice(n,1);pool.push(w);drawTiles();drawAnswer();
      });
      a.appendChild(b);
    })(answer[i],i);
  }
}
function clearTiles(){
  var r=ROUNDS[idx];
  pool=shuffle(r.tiles.slice());answer=[];
  drawTiles();drawAnswer();
}
function check(){
  if(clock)return;
  var r=ROUNDS[idx],fb=document.getElementById("fb");
  if(answer.length!==r.tiles.length){fb.textContent="⚠️ 仲未砌完！";fb.className="bad";return;}
  if(answer.join(" ").toLowerCase()===r.target.toLowerCase().replace(/\.$/,"")){
    clock=true;score+=60;upd();
    fb.textContent="✅ 啱晒！「"+r.target+"」（+60）";
    fb.className="good";
    idx++;setTimeout(function(){clock=false;if(idx>=ROUNDS.length)endGame();else render();},1500);
  }else{
    fb.textContent="❌ 次序唔啱，再排過！";
    fb.className="bad";
    document.getElementById("answer").classList.add("shake");
    setTimeout(function(){document.getElementById("answer").classList.remove("shake");},450);
  }
}
document.getElementById("checkBtn").addEventListener("click",check);
document.getElementById("clearBtn").addEventListener("click",clearTiles);
function endGame(){
  var msg="總分：<b style='color:#fbbf24'>"+score+"</b> / 800 分<br>";
  if(score>best){best=score;try{localStorage.setItem("conjBest",best);}catch(e){}msg+="🏅 新紀錄！<br>";}
  else{msg+="歷史最佳："+best+" 分<br>";}
  msg+=score>=700?"🌟 合併大師！連接詞＋詞序無懈可擊！":score>=450?"👍 好嘢，砌句子嗰陣要睇清楚邊句行先！":"💪 記住：because講原因、so講結果、although講讓步！";
  document.getElementById("finalScore").innerHTML=msg;
  document.getElementById("over").style.display="flex";
}
function newGame(){
  ROUNDS=shuffle(ROUNDS.slice());idx=0;score=0;
  document.getElementById("over").style.display="none";
  render();
}
function startGame(){document.getElementById("intro").style.display="none";newGame();}
</script>
</body>
</html>
