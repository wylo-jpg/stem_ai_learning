  <h2>🔍 數據偵探</h2>
  <p><b>玩法：</b>你係數據偵探，每單案件都有一組證物數據。<br>
  用<b style="color:#ffc93c">平均數／中位數／眾數</b>搵出真相，答啱就拎到線索 🕵️<br>

<script>
(function(){
"use strict";
/* ---------- 狀態（全部開頭初始化，防 rAF 未開始就 draw 炒車） ---------- */
var diff='easy',best=0,score=0,lives=3,clues=0,streak=0,caseNo=0,started=false,over=false,locked=true;
var cur=null;
var CASE_NAMES=['失蹤嘅平均分','離奇嘅離群值','神秘嘅問卷','頻數表之謎','分組數據疑雲','消失嘅中位數','眾數嘅秘密'];
function bestKey(){return 'ct_high_'+diff;}
function loadBest(){try{best=parseInt(localStorage.getItem(bestKey())||'0',10)||0;}catch(e){best=0;}}
function saveBest(){if(score>best){best=score;try{localStorage.setItem(bestKey(),String(best));}catch(e){}}}

/* ---------- 音效 ---------- */
function beep(f,d,type){try{
  var ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
  if(ac.state==='suspended')ac.resume();
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.10,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}catch(e){}}
function sndGood(){beep(660,0.12);setTimeout(function(){beep(880,0.18);},110);}
function sndBad(){beep(200,0.25,'sawtooth');}

/* ---------- 數學工具 ---------- */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sum(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s;}
function mean(a){return sum(a)/a.length;}
function median(a){var s=a.slice().sort(function(x,y){return x-y;});var n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
function fmt(x){return (Math.round(x*10)/10).toString();}
function numOpts(ans,cands){
  var vals=[ans],seen={};seen['k'+ans]=1;
  cands=shuffle(cands.slice());
  for(var i=0;i<cands.length&&vals.length<4;i++){
    var c=cands[i];if(typeof c!=='number'||!isFinite(c))continue;
    var k='k'+c;if(!seen[k]){seen[k]=1;vals.push(c);}
  }
  var d=1;
  while(vals.length<4&&d<60){var c2=Math.round((ans+d)*10)/10;d++;var k2='k'+c2;if(!seen[k2]){seen[k2]=1;vals.push(c2);}}
  vals=shuffle(vals);
  var idx=0;for(var j=0;j<vals.length;j++)if(vals[j]===ans)idx=j;
  return {opts:vals,idx:idx};
}
/* 保證整數平均數：隨機 n-1 個數，校準最後一個 */
function intMeanArr(n,lo,hi,mLo,mHi){
  var vals=[],m,tries=0;
  while(tries++<400){
    vals=[];for(var i=0;i<n-1;i++)vals.push(rnd(lo,hi));
    m=rnd(mLo,mHi);
    var last=m*n-sum(vals);
    if(last>=lo&&last<=hi){vals.push(last);break;}
  }
  return {vals:shuffle(vals),mean:m};
}

var DIFFS={
  easy:{concept:'集中趨勢描述一組數據嘅「中間」位置。平均數 = 全部加埋 ÷ 個數；中位數 = 由細到大排，中間嗰個數；眾數 = 出現最多次嘅數。'},
  mid:{concept:'當數據有離群值（特別大／細嘅數），平均數會被拉走，唔再代表典型值；中位數只睇中間位置，唔受離群值影響，所以更穩陣。'},
  hard:{concept:'頻數表求平均數要用加權：Σ(數值×次數) ÷ 總次數。分組數據只能用組中點估算，答案係估計值。常見錯誤：直接將唔同數值加埋除，冇考慮次數！'}
};

/* ---------- 出題 ---------- */
function genMeanEasy(){
  var r=intMeanArr(5,2,12,4,10),nums=r.vals,m=r.mean;
  var o=numOpts(m,[median(nums),m+2,m-2,m+1]);
  return {data:nums,txt:'求呢組數據嘅平均數。',
    opts:o.opts.map(fmt),idx:o.idx,
    explain:'平均數 = 總和 ÷ 個數 = '+sum(nums)+' ÷ '+nums.length+' = '+m};
}
function genMedianEasy(){
  var n=Math.random()<0.5?5:7,pool=[],v;
  for(v=1;v<=20;v++)pool.push(v);
  pool=shuffle(pool);
  var nums=pool.slice(0,n).sort(function(a,b){return a-b;});
  var ans=median(nums),mu=Math.round(mean(nums));
  var o=numOpts(ans,[mu,nums[0],nums[n-1],ans+1,ans-1]);
  return {data:nums,txt:'將數據由細到大排列，求中位數。',
    opts:o.opts.map(fmt),idx:o.idx,
    explain:'由細到大排：'+nums.join('、')+'，中間嗰個 = '+fmt(ans)};
}
function genModeEasy(){
  var m=rnd(2,12),pool=[],v;
  for(v=2;v<=12;v++)if(v!==m)pool.push(v);
  pool=shuffle(pool);
  var nums=shuffle([m,m,m,pool[0],pool[1]]);
  if(Math.random()<0.5)nums.push(pool[2]);
  nums=shuffle(nums);
  var o=numOpts(m,[pool[0],pool[1],Math.round(mean(nums)),m+1]);
  return {data:nums,txt:'求眾數（出現最多次嘅數）。',
    opts:o.opts.map(fmt),idx:o.idx,
    explain:'眾數 = 出現最多次嘅數 = '+m+'（出現咗 3 次）'};
}
function genMeanMid(){
  var r=intMeanArr(8,3,15,5,12),nums=r.vals,m=r.mean;
  var o=numOpts(m,[Math.round(median(nums)),m+2,m-2]);
  return {data:nums,txt:'8 個數據，求平均數。',
    opts:o.opts.map(fmt),idx:o.idx,
    explain:'平均數 = '+sum(nums)+' ÷ 8 = '+m};
}
function genOutlier(){
  var base=[],i;
  for(i=0;i<4;i++)base.push(rnd(3,9));
  var out=rnd(50,99);
  var nums=shuffle(base.concat([out]));
  if(Math.random()<0.5){
    var ans=median(nums);
    var o=numOpts(ans,[Math.round(mean(nums)),ans+1,ans-1]);
    return {data:nums,txt:'數據中有一個離群值（'+out+'），求中位數。',
      opts:o.opts.map(fmt),idx:o.idx,
      explain:'離群值 '+out+' 會拉高平均數（'+fmt(mean(nums))+'），但中位數只睇中間 = '+fmt(ans)+'，唔受影響'};
  }
  var opts=shuffle(['平均數','中位數','眾數','三個都一樣']);
  var idx=0;for(var j=0;j<opts.length;j++)if(opts[j]==='中位數')idx=j;
  return {data:nums,txt:'數據中有一個離群值（'+out+'），邊個集中趨勢最能代表「典型值」？',
    opts:opts,idx:idx,
    explain:'平均數 = '+fmt(mean(nums))+' 被離群值拉高咗；中位數 = '+fmt(median(nums))+' 最穩陣，最能代表典型值'};
}
function genFreq(){
  var r=intMeanArr(12,1,6,2,5),vals=r.vals,m=r.mean;
  var freq=[0,0,0,0,0,0],j;
  for(j=0;j<vals.length;j++)freq[vals[j]-1]++;
  var distinct=[],v;
  for(v=1;v<=6;v++)if(freq[v-1]>0)distinct.push(v);
  var unw=Math.round(mean(distinct)*10)/10;
  var o=numOpts(m,[unw,median(vals),m+1,m-1]);
  var rows='';
  for(v=1;v<=6;v++)if(freq[v-1]>0)rows+='<tr><td>'+v+'</td><td>'+freq[v-1]+'</td></tr>';
  return {data:null,table:'<table class="freq"><tr><th>數值 x</th><th>次數 f</th></tr>'+rows+'</table>',
    txt:'根據頻數表，求平均數。',
    opts:o.opts.map(fmt),idx:o.idx,
    explain:'加權平均數 = Σ(x×f) ÷ 總次數 = '+sum(vals)+' ÷ 12 = '+m+'。唔可以直接將 '+distinct.join('、')+' 加埋除！'};
}
function genGrouped(){
  var mids=[5,15,25,35],N=10,vals=[],m,tries=0;
  var targets=[15,20,25];
  while(tries++<600){
    vals=[];for(var i=0;i<N-1;i++)vals.push(mids[rnd(0,3)]);
    m=targets[rnd(0,2)];
    var last=m*N-sum(vals);
    if(mids.indexOf(last)>=0){vals.push(last);break;}
  }
  vals=shuffle(vals);
  var labels=['0 – <10','10 – <20','20 – <30','30 – <40'],rows='',v;
  for(v=0;v<4;v++){
    var c=0,j;
    for(j=0;j<vals.length;j++)if(vals[j]===mids[v])c++;
    rows+='<tr><td>'+labels[v]+'</td><td>'+c+'</td></tr>';
  }
  var o=numOpts(m,[20,m+5,m-5,10]);
  return {data:null,table:'<table class="freq"><tr><th>組別</th><th>次數 f</th></tr>'+rows+'</table>',
    txt:'根據分組數據，用組中點估算平均數。',
    opts:o.opts.map(fmt),idx:o.idx,
    explain:'用組中點 5、15、25、35 加權：Σ(中點×f) ÷ 總次數 = '+sum(vals)+' ÷ 10 = '+m+'（估計值）'};
}
function genQuestion(){
  var q;
  if(diff==='easy'){
    var p=Math.random();
    q=p<0.4?genMeanEasy():(p<0.7?genMedianEasy():genModeEasy());
  }else if(diff==='mid'){
    var p2=Math.random();
    q=p2<0.35?genMeanMid():(p2<0.7?genOutlier():genMedianEasy());
  }else{
    var p3=Math.random();
    q=p3<0.5?genFreq():genGrouped();
  }
  return q;
}

/* ---------- 遊戲流程 ---------- */
var CLIENTS=['委託人：陳同學','委託人：林老師','委託人：籃球隊隊長','委託人：便利店店長','委託人：社工姐姐','委託人：校長','委託人：補習社導師'];
function updHud(){
  document.getElementById('caseNo').textContent=started?String(caseNo):'–';
  document.getElementById('clues').textContent=clues;
  document.getElementById('lives').textContent=lives;
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}
function nextCase(){
  if(clues>=5){win();return;}
  if(lives<=0){gameOver();return;}
  caseNo++;
  locked=false;
  cur=genQuestion();
  document.getElementById('caseTitle').textContent='📁 案件'+caseNo+'：'+CASE_NAMES[(caseNo-1)%CASE_NAMES.length];
  document.getElementById('client').textContent=CLIENTS[rnd(0,CLIENTS.length-1)]+'：「偵探，幫我睇下呢堆數據！」';
  var da=document.getElementById('dataArea');
  da.innerHTML='';
  if(cur.data){
    cur.data.forEach(function(x){
      var s=document.createElement('span');s.className='chip';s.textContent=x;da.appendChild(s);
    });
  }else{
    da.innerHTML=cur.table;
  }
  document.getElementById('qq').textContent=cur.txt;
  var box=document.getElementById('opts');box.innerHTML='';
  cur.opts.forEach(function(label,i){
    var b=document.createElement('button');b.className='opt';b.textContent=label;
    b.addEventListener('pointerdown',function(e){e.preventDefault();answer(i,b);});
    box.appendChild(b);
  });
  var fb=document.getElementById('feedback');fb.className='feedback hide';fb.innerHTML='';
  document.getElementById('nextBtn').classList.add('hide');
  updHud();
}
function answer(i,btn){
  if(locked||over||!started)return;
  locked=true;
  var btns=document.getElementById('opts').children;
  btns[cur.idx].classList.add('right');
  var fb=document.getElementById('feedback');
  if(i===cur.idx){
    clues++;streak++;
    var pts=100+20*Math.min(streak,5);
    score+=pts;saveBest();
    sndGood();
    fb.className='feedback good';
    fb.innerHTML='✅ <b>破案！拎到線索</b>（+'+pts+'分）<br>💡 '+cur.explain+(streak>=2?'<br><span class="streak">🔥 連續答啱 '+streak+' 題！</span>':'');
  }else{
    lives--;streak=0;
    btn.classList.add('wrong');
    sndBad();
    fb.className='feedback bad';
    fb.innerHTML='❌ <b>查錯方向…</b> 正確答案係 <b>'+cur.opts[cur.idx]+'</b><br>💡 '+cur.explain;
  }
  document.getElementById('nextBtn').classList.remove('hide');
  updHud();
}
function win(){
  over=true;saveBest();sndGood();
  setTimeout(sndGood,300);
  showEnd('🎉 破案成功！','集齊 5 條線索<br>總分 <b>'+score+'</b> · 用咗 '+caseNo+' 單案');
}
function gameOver(){
  over=true;saveBest();sndBad();
  showEnd('🌧️ 案件擱置…','拎到 '+clues+' / 5 條線索<br>總分 <b>'+score+'</b>');
}
function showEnd(title,text){
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endText').innerHTML=text;
  document.getElementById('endBest').textContent=best;
  document.getElementById('endOverlay').classList.remove('hide');
}
function newGame(){
  score=0;lives=3;clues=0;streak=0;caseNo=0;over=false;
  loadBest();
  document.getElementById('endOverlay').classList.add('hide');
  nextCase();
  updHud();
}

/* ---------- 事件 ---------- */
document.getElementById('nextBtn').addEventListener('click',function(){beep(520,0.08);nextCase();});
document.getElementById('conceptTxt').textContent=DIFFS.easy.concept;
var diffBtns=document.querySelectorAll('.diff');
diffBtns.forEach(function(b){
  b.addEventListener('click',function(){
    diffBtns.forEach(function(x){x.classList.remove('sel');});
    b.classList.add('sel');
    diff=b.getAttribute('data-d');
    document.getElementById('conceptTxt').textContent=DIFFS[diff].concept;
    beep(660,0.08);
  });
});
document.getElementById('startBtn').addEventListener('click',function(){
  document.getElementById('intro').classList.add('hide');
  started=true;beep(660,0.1);newGame();
});
document.getElementById('againBtn').addEventListener('click',function(){started=true;newGame();beep(660,0.1);});
document.getElementById('changeDiffBtn').addEventListener('click',function(){
  document.getElementById('endOverlay').classList.add('hide');
  document.getElementById('intro').classList.remove('hide');
});
loadBest();updHud();
})();
</script>
</body>
</html>
