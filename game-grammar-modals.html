<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>情態動詞</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#701a1a;color:#fee2e2;min-height:100vh}
header{background:linear-gradient(135deg,#991b1b,#dc2626);padding:16px;text-align:center}
header h1{margin:0;font-size:22px}
.hud{display:flex;justify-content:space-around;background:#450a0a;padding:12px;font-size:16px;font-weight:700}
.hud span{color:#fbbf24}
main{max-width:600px;margin:0 auto;padding:16px}
.qcard{background:#7f1d1d;border-radius:16px;padding:22px;margin:12px 0;min-height:120px}
.qnum{font-size:14px;color:#fca5a5;margin-bottom:8px}
.qtext{font-size:20px;line-height:1.7}
.qtext .blank{display:inline-block;min-width:70px;border-bottom:3px dashed #fbbf24;text-align:center;color:#fbbf24;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opts button{min-height:64px;font-size:19px;font-weight:800;border-radius:14px;border:2px solid #dc2626;background:#450a0a;color:#fee2e2;cursor:pointer;touch-action:manipulation}
.opts button:active{transform:scale(.96)}
.opts button.correct{background:#166534;border-color:#4ade80;color:#fff}
.opts button.wrong{background:#7f1d1d;border-color:#f87171;color:#fff}
.opts button:disabled{opacity:.9}
.feedback{min-height:44px;font-size:16px;font-weight:700;text-align:center;margin-top:10px}
.feedback.good{color:#4ade80}.feedback.bad{color:#f87171}
.explain{background:#701a1a;border-left:4px solid #fbbf24;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:15px;display:none}
.overlay{position:fixed;inset:0;background:rgba(60,10,10,.96);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:#7f1d1d;border-radius:20px;padding:28px 24px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto}
.card h2{margin:0 0 12px;font-size:24px;color:#fbbf24}
.card p,.card li{font-size:16px;line-height:1.8}
.card ul{padding-left:20px}
.concept{background:#701a1a;border-radius:12px;padding:14px;margin:14px 0;font-size:15px}
.concept b{color:#4ade80}
.card button{width:100%;min-height:58px;font-size:18px;font-weight:700;background:#dc2626;color:#fff;border:none;border-radius:14px;margin-top:10px;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<header><h1>🎭 情態動詞</h1></header>
<div class="hud"><div>第 <span id="qn">1</span>/10 題</div><div>⭐ <span id="score">0</span> 分</div><div>🔥 <span id="streak">0</span> 連擊</div></div>
<main>
<div class="qcard">
<div class="qnum" id="qnum"></div>
<div class="qtext" id="qtext"></div>
</div>
<div class="opts" id="opts"></div>
<div class="feedback" id="fb"></div>
<div class="explain" id="explain"></div>
</main>
<div class="overlay" id="intro"><div class="card">
<h2>🎭 情態動詞</h2>
<p><b>玩法：</b>睇住英文句子同語境，揀最適合嘅情態動詞（modal verb）。共 10 題，答啱 +100 分，連擊有加成！</p>
<div class="concept">💡 <b>文法概念 — Modal Verbs 語氣：</b><br>
• <b>can</b> = 識／可以；<b>could</b> = 以前識／較客氣<br>
• <b>should</b> = 應該（建議）；<b>must</b> = 一定要（強烈）<br>
• <b>may / might</b> = 可能（might 把握較低）<br>
• <b>記住：</b>modal 後面永遠跟原形動詞（唔加 to、唔加 s）！</div>
<button onclick="startGame()">開始挑戰！</button>
</div></div>
<div class="overlay" id="gameover" style="display:none"><div class="card">
<h2>🏁 完成！</h2>
<p id="finalScore" style="font-size:19px"></p>
<button onclick="resetGame()">再玩一次 🔁</button>
</div></div>
<script>
var QS=[
{q:"She ___ swim very well.",a:"can",o:["can","cans","to can","canning"],e:"can 後面跟原形動詞，can 本身唔加 s：She can swim。"},
{q:"You ___ see a doctor. You look pale.",a:"should",o:["should","must","can","may"],e:"should = 建議「應該」。must 語氣太強，呢度係關心建議，用 should。"},
{q:"Students ___ wear uniform at school.",a:"must",o:["should","must","might","could"],e:"校規係強制性，用 must（一定要）。"},
{q:"It ___ rain tomorrow. Take an umbrella.",a:"might",o:["might","must","can","should"],e:"講可能性用 might / may。might 把握較低，啱呢度語境。"},
{q:"___ you help me, please?",a:"Could",o:["Could","Cans","Must","Should"],e:"Could you…? 係客氣嘅請求，比 Can you 更有禮貌。"},
{q:"He ___ speak three languages.",a:"can",o:["can","cans","is can","to can"],e:"can 表能力，後面跟原形：can speak。"},
{q:"You ___ smoke here. It's forbidden.",a:"mustn't",o:["mustn't","don't must","shouldn't to","can't to"],e:"mustn't = 不准（強烈禁止）。注意 mustn't 後面直接跟原形。"},
{q:"She ___ be at home. The lights are on.",a:"must",o:["must","should","might","could"],e:"must + 推測 = 好肯定（燈著咗，佢一定喺屋企）。"},
{q:"___ I go to the toilet?",a:"May",o:["May","Cans","Must","Should"],e:"May I…? 係正式嘅請求許可。"},
{q:"When I was young, I ___ run fast.",a:"could",o:["could","can","cans","to could"],e:"講過去嘅能力用 could（can 嘅過去式）。"},
{q:"You ___ finish your homework first.",a:"should",o:["should","might","could","may"],e:"should = 建議應該先做功課。"},
{q:"It ___ be true. I can't believe it!",a:"can't",o:["can't","mustn't","shouldn't","couldn't"],e:"can't + 推測 = 不可能（唔信係真）。"},
{q:"We ___ be late. Hurry up!",a:"mustn't",o:["mustn't","don't must","shouldn't to","can't to"],e:"mustn't = 一定唔可以遲到。"},
{q:"___ you speak English?",a:"Can",o:["Can","Does","Are","Do"],e:"問能力用 Can you…?（識唔識講英文）。"},
{q:"He ___ come tomorrow, but I'm not sure.",a:"might",o:["might","must","should","can"],e:"唔肯定 → 用 might（可能）。must 係好肯定，唔啱。"},
{q:"You ___ respect your teachers.",a:"should",o:["should","might","could","may"],e:"should = 道德上應該。"},
{q:"___ I use your pen?",a:"Can",o:["Can","Cans","To can","Canning"],e:"Can I…? 問許可，can 放句首，後面跟原形。"},
{q:"She ___ have left already. The door is locked.",a:"must",o:["must","should","might","could"],e:"must + have + pp = 對過去好肯定嘅推測（佢一定已經走咗）。"},
{q:"You ___ worry. Everything will be fine.",a:"needn't",o:["needn't","mustn't","can't","shouldn't"],e:"needn't = 唔需要擔心。mustn't 係不准，意思唔啱。"},
{q:"He ___ play the piano when he was five.",a:"could",o:["could","can","cans","to can"],e:"過去嘅能力用 could。"}
];
var qi=0,score=0,streak=0,order=[];
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startGame(){document.getElementById('intro').style.display='none';resetGame();}
function resetGame(){
  document.getElementById('gameover').style.display='none';
  qi=0;score=0;streak=0;
  order=shuffle(QS.slice());
  document.getElementById('score').textContent='0';
  document.getElementById('streak').textContent='0';
  showQ();
}
function showQ(){
  var q=order[qi];
  document.getElementById('qn').textContent=(qi+1);
  document.getElementById('qnum').textContent='第 '+(qi+1)+' 題';
  document.getElementById('qtext').innerHTML=q.q;
  document.getElementById('fb').textContent='';
  document.getElementById('fb').className='feedback';
  var ex=document.getElementById('explain');ex.style.display='none';ex.innerHTML='';
  var opts=shuffle(q.o.slice());
  var box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.textContent=o;
    b.addEventListener('click',function(){answer(b,o,q);});
    box.appendChild(b);
  });
}
function answer(btn,choice,q){
  var btns=document.getElementById('opts').children;
  for(var i=0;i<btns.length;i++)btns[i].disabled=true;
  var fb=document.getElementById('fb');
  var ex=document.getElementById('explain');
  if(choice===q.a){
    btn.className='correct';
    streak++;
    var pts=100+(streak-1)*20;
    score+=pts;
    fb.textContent='✅ 啱！+'+pts+' 分';
    fb.className='feedback good';
  }else{
    btn.className='wrong';
    streak=0;
    fb.textContent='❌ 答案係「'+q.a+'」';
    fb.className='feedback bad';
    for(var j=0;j<btns.length;j++){
      if(btns[j].textContent===q.a)btns[j].className='correct';
    }
  }
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  ex.innerHTML='💡 '+q.e;
  ex.style.display='block';
  setTimeout(function(){
    qi++;
    if(qi>=10)endGame();else showQ();
  },2200);
}
function endGame(){
  document.getElementById('gameover').style.display='flex';
  var msg='總分：<b style="color:#fbbf24">'+score+'</b> 分<br>';
  msg+=score>=1000?'🌟 情態動詞大師！語氣掌握得好好！':score>=700?'👍 好叻，繼續努力！':'💪 記住：modal 後面永遠跟原形動詞！';
  document.getElementById('finalScore').innerHTML=msg;
}
</script>
</body>
</html>
