<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>語氣情境</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#701a1a;color:#fee2e2;min-height:100vh}
header{background:linear-gradient(135deg,#991b1b,#dc2626);padding:16px;text-align:center}
header h1{margin:0;font-size:22px}
.hud{display:flex;justify-content:space-around;background:#450a0a;padding:12px;font-size:16px;font-weight:700}
.hud span{color:#fbbf24}
main{max-width:600px;margin:0 auto;padding:16px}
.sitcard{background:#7f1d1d;border-radius:16px;padding:18px 20px;margin:12px 0;border-left:5px solid #fbbf24}
.sitcard .lbl{font-size:14px;color:#fca5a5;margin-bottom:4px}
.sitcard .txt{font-size:18px;font-weight:700;line-height:1.6}
.qcard{background:#450a0a;border-radius:16px;padding:22px;margin:12px 0}
.qtext{font-size:22px;line-height:1.8;text-align:center}
.qtext .slot{display:inline-block;min-width:110px;min-height:40px;border-bottom:4px dashed #fbbf24;text-align:center;color:#fbbf24;font-weight:800;cursor:pointer;vertical-align:bottom;padding:0 8px}
.qtext .slot .clr{font-size:12px;color:#fca5a5;display:block}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.chips button{min-height:64px;font-size:20px;font-weight:800;border-radius:14px;border:2px solid #dc2626;background:#7f1d1d;color:#fee2e2;cursor:pointer;touch-action:manipulation}
.chips button:active{transform:scale(.96)}
.chips button.picked{background:#dc2626;color:#fff;border-color:#fbbf24}
.chips button:disabled{opacity:.85}
.submitrow{margin-top:14px}
.submitrow button{width:100%;min-height:58px;font-size:19px;font-weight:800;border:none;border-radius:14px;background:#dc2626;color:#fff;cursor:pointer;touch-action:manipulation}
.submitrow button:active{transform:scale(.98)}
.submitrow button:disabled{opacity:.6}
.feedback{min-height:44px;font-size:16px;font-weight:700;text-align:center;margin-top:10px}
.feedback.good{color:#4ade80}.feedback.bad{color:#f87171}
.explain{background:#450a0a;border-left:4px solid #fbbf24;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:15px;display:none}
.overlay{position:fixed;inset:0;background:rgba(60,10,10,.96);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:#7f1d1d;border-radius:20px;padding:28px 24px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto}
.card h2{margin:0 0 12px;font-size:24px;color:#fbbf24}
.card p,.card li{font-size:16px;line-height:1.8}
.card ul{padding-left:20px}
.concept{background:#701a1a;border-radius:12px;padding:14px;margin:14px 0;font-size:15px}
.concept b{color:#4ade80}
.card button{width:100%;min-height:58px;font-size:18px;font-weight:700;background:#dc2626;color:#fff;border:none;border-radius:14px;margin-top:10px;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<header><h1>🎭 語氣情境</h1></header>
<div class="hud"><div>第 <span id="qn">1</span>/10 題</div><div>⭐ <span id="score">0</span> 分</div><div>🔥 <span id="streak">0</span> 連擊</div></div>
<main>
<div class="sitcard"><div class="lbl">💬 情境 Situation</div><div class="txt" id="sit"></div></div>
<div class="qcard"><div class="qtext" id="qtext"></div></div>
<div class="chips" id="chips"></div>
<div class="submitrow"><button id="goBtn">確定答案 ✓</button></div>
<div class="feedback" id="fb"></div>
<div class="explain" id="explain"></div>
</main>
<div class="overlay" id="intro"><div class="card">
<h2>🎭 語氣情境</h2>
<p><b>玩法：</b>上面會出一個<b>生活情境</b>（中文），下面係一句英文，空位等你填。撳下面嘅情態動詞，佢會飛入空位（撳空位可以拎返出嚟），諗啱語氣再撳「確定答案」。共 10 題，答啱 +100 分，連擊有加成！</p>
<div class="concept">💡 <b>文法概念 — Modal Verbs 語氣：</b><br>
• <b>can</b> = 識／可以；<b>could</b> = 以前識／較客氣<br>
• <b>should</b> = 應該（建議）；<b>must</b> = 一定要（強烈）<br>
• <b>may / might</b> = 可能（might 把握較低）<br>
• <b>記住：</b>modal 後面永遠跟原形動詞！</div>
<button onclick="startGame()">開始挑戰！</button>
</div></div>
<div class="overlay" id="gameover" style="display:none"><div class="card">
<h2>🏁 完成！</h2>
<p id="finalScore" style="font-size:19px"></p>
<button onclick="resetGame()">再玩一次 🔁</button>
</div></div>
<script>
var QS=[
{sit:"你朋友面色好差，你想建議佢去睇醫生",q:"You ___ see a doctor.",a:"should",o:["should","must","might","can"],e:"should = 建議「應該」。must 語氣太強，呢度係關心建議。"},
{sit:"校規規定，學生一定要著校服",q:"Students ___ wear uniform.",a:"must",o:["must","should","might","could"],e:"校規強制性，用 must（一定要）。"},
{sit:"聽日可能會落雨，但你唔肯定",q:"It ___ rain tomorrow.",a:"might",o:["might","must","should","can"],e:"講可能性用 might，把握較低啱呢個語境。"},
{sit:"你想好有禮貌咁請同學幫手",q:"___ you help me, please?",a:"Could",o:["Could","Must","Should","Cans"],e:"Could you…? 係最有禮貌嘅請求。"},
{sit:"你想問人識唔識游水",q:"___ you swim?",a:"Can",o:["Can","Must","Should","Does"],e:"問能力用 Can。"},
{sit:"呢個地方嚴禁吸煙",q:"You ___ smoke here.",a:"mustn't",o:["mustn't","shouldn't","haven't","don't"],e:"mustn't = 不准（強烈禁止）。"},
{sit:"你覺得道德上應該尊重老師",q:"You ___ respect your teachers.",a:"should",o:["should","might","could","may"],e:"should = 道德上應該。"},
{sit:"講緊你細個嗰陣跑得好快",q:"When I was young, I ___ run fast.",a:"could",o:["could","can","cans","to can"],e:"過去嘅能力用 could（can 嘅過去式）。"},
{sit:"佢聽日會唔會嚟，你唔肯定",q:"He ___ come tomorrow.",a:"might",o:["might","must","should","can"],e:"唔肯定 → might。must 係好肯定，唔啱語氣。"},
{sit:"你想叫朋友唔使擔心",q:"You ___ worry.",a:"needn't",o:["needn't","mustn't","can't","shouldn't"],e:"needn't = 唔需要。mustn't 係不准，意思錯晒。"}
];
var qi=0,score=0,streak=0,order=[],timer=null;
var cur=null,picked=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startGame(){document.getElementById('intro').style.display='none';resetGame();}
function resetGame(){
  clearTimeout(timer);
  document.getElementById('gameover').style.display='none';
  qi=0;score=0;streak=0;
  order=shuffle(QS.slice());
  document.getElementById('score').textContent='0';
  document.getElementById('streak').textContent='0';
  showQ();
}
function renderQ(){
  var html=cur.q.replace('___','<span class="slot" id="slot">'+(picked?picked:'<span class="clr">撳下面揀</span>')+'</span>');
  document.getElementById('qtext').innerHTML=html;
  var sl=document.getElementById('slot');
  if(sl)sl.addEventListener('click',function(){picked=null;renderQ();renderChips();});
}
function renderChips(){
  var box=document.getElementById('chips');box.innerHTML='';
  cur._opts.forEach(function(o){
    var b=document.createElement('button');
    b.textContent=o;
    if(o===picked)b.className='picked';
    b.addEventListener('click',function(){picked=o;renderQ();renderChips();});
    box.appendChild(b);
  });
}
function showQ(){
  cur=order[qi];picked=null;
  cur._opts=shuffle(cur.o.slice());
  document.getElementById('qn').textContent=(qi+1);
  document.getElementById('sit').textContent=cur.sit;
  document.getElementById('fb').textContent='';
  document.getElementById('fb').className='feedback';
  var ex=document.getElementById('explain');ex.style.display='none';ex.innerHTML='';
  document.getElementById('goBtn').disabled=false;
  renderQ();renderChips();
}
document.getElementById('goBtn').addEventListener('click',function(){
  var fb=document.getElementById('fb');
  var ex=document.getElementById('explain');
  if(!picked){
    fb.textContent='⚠️ 未揀情態動詞！撳下面其中一個。';
    fb.className='feedback bad';
    return;
  }
  document.getElementById('goBtn').disabled=true;
  var bs=document.getElementById('chips').children;
  for(var i=0;i<bs.length;i++)bs[i].disabled=true;
  var sl=document.getElementById('slot');
  if(picked===cur.a){
    streak++;
    var pts=100+(streak-1)*20;
    score+=pts;
    fb.textContent='✅ 啱！語氣啱晒，+'+pts+' 分';
    fb.className='feedback good';
    if(sl)sl.style.borderColor='#4ade80';
  }else{
    streak=0;
    fb.textContent='❌ 呢個情境應該用「'+cur.a+'」';
    fb.className='feedback bad';
    if(sl)sl.style.borderColor='#f87171';
  }
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  ex.innerHTML='💡 '+cur.e;
  ex.style.display='block';
  timer=setTimeout(function(){
    qi++;
    if(qi>=10)endGame();else showQ();
  },2400);
});
function endGame(){
  document.getElementById('gameover').style.display='flex';
  var msg='總分：<b style="color:#fbbf24">'+score+'</b> 分<br>';
  msg+=score>=1000?'🌟 語氣大師！咩情境都難唔到你！':score>=700?'👍 好叻，繼續努力！':'💪 記住：睇情境揀語氣，modal 後面跟原形！';
  document.getElementById('finalScore').innerHTML=msg;
}
</script>
</body>
</html>
