<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>關係代詞填空</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#172554;color:#e0e7ff;min-height:100vh}
header{background:linear-gradient(135deg,#1e3a8a,#6366f1);padding:16px;text-align:center}
header h1{margin:0;font-size:22px}
.back{display:block;text-align:center;background:#1e1b4b;color:#a5b4fc;text-decoration:none;padding:12px;font-size:16px;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
.hud{display:flex;justify-content:space-between;background:#1e1b4b;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;margin-bottom:12px}
.hud span{color:#fbbf24}
.qcard{background:#1e1b4b;border-radius:14px;padding:22px 18px;margin-bottom:12px;text-align:center}
.qcard .hintline{font-size:14px;color:#a5b4fc;margin-bottom:10px}
.qcard .sent{font-size:21px;line-height:2;font-weight:600}
.qcard .blank{display:inline-block;min-width:110px;border-bottom:4px solid #fbbf24;color:#fbbf24;font-weight:800;padding:0 8px;margin:0 4px}
.qcard .blank.filled{border-bottom-color:#4ade80;color:#4ade80}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:12px}
.chip{min-width:76px;min-height:60px;font-size:20px;font-weight:800;border-radius:14px;border:2px solid #6366f1;background:#312e81;color:#e0e7ff;cursor:pointer;padding:10px 18px;touch-action:manipulation}
.chip:active{transform:scale(.94)}
.chip.shake{animation:shk .4s;border-color:#f87171}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:60px;font-size:15px;line-height:1.7;margin-top:6px;padding:10px 14px;border-radius:10px;display:none}
.fb.good{display:block;background:#14532d;color:#bbf7d0}
.fb.bad{display:block;background:#450a0a;color:#fecaca}
.fb b{color:#fde047}
.nextbtn{width:100%;min-height:52px;font-size:17px;font-weight:800;border:none;border-radius:12px;background:#6366f1;color:#fff;margin-top:8px;display:none;touch-action:manipulation}
.overlay{position:fixed;inset:0;background:rgba(23,37,84,.97);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto}
.overlay.hide{display:none}
.card{background:#1e1b4b;border-radius:18px;padding:26px 22px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto}
.card h2{margin:0 0 10px;font-size:24px;color:#a5b4fc}
.card p,.card li{font-size:15px;line-height:1.7}
.card ul{padding-left:20px}
.concept{background:#172554;border-radius:12px;padding:14px;margin:14px 0;font-size:14px;line-height:1.8}
.concept b{color:#4ade80}
.card .go{width:100%;min-height:56px;font-size:18px;font-weight:800;background:#6366f1;color:#fff;border:none;border-radius:14px;margin-top:10px;cursor:pointer;touch-action:manipulation}
#finalScore{font-size:18px;line-height:1.8}
table.rt{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.rt td,table.rt th{border:1px solid #4338ca;padding:6px 8px;text-align:left}
table.rt th{background:#312e81;color:#a5b4fc}
</style>
</head>
<body>
<header><h1>🔗 關係代詞填空</h1></header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<div class="wrap">
<div class="hud"><div>第 <span id="qnum">1</span>/10 題</div><div>⭐ <span id="score">0</span></div><div>✅ <span id="acc">-</span></div></div>
<div class="qcard"><div class="hintline" id="hintline"></div><div class="sent" id="sent"></div></div>
<div class="chips" id="chips"></div>
<div class="fb" id="fb"></div>
<button class="nextbtn" id="nextbtn">下一題 →</button>
</div>
<div class="overlay" id="intro"><div class="card">
<h2>🔗 關係代詞填空</h2>
<p><b>玩法：</b>句子中間有個<b>空位</b>，下面有 7 粒關係代詞。諗清楚先<b>撳一粒</b>放入空位！撳錯扣 20 分，撳啱 +100 分。共 10 題。</p>
<div class="concept">💡 <b>關係代詞速查：</b>
<table class="rt"><tr><th>代詞</th><th>用法</th></tr>
<tr><td><b>who</b></td><td>指人</td></tr>
<tr><td><b>which</b></td><td>指物</td></tr>
<tr><td><b>that</b></td><td>指人／物（有逗號唔用得！）</td></tr>
<tr><td><b>whose</b></td><td>…的（表示所屬）</td></tr>
<tr><td><b>where</b></td><td>指地方</td></tr>
<tr><td><b>when</b></td><td>指時間</td></tr>
<tr><td><b>why</b></td><td>指原因（reason）</td></tr></table></div>
<button class="go" id="startbtn">開始填空！</button>
</div></div>
<div class="overlay hide" id="end"><div class="card">
<h2>🏁 完成！</h2>
<p id="finalScore"></p>
<button class="go" id="againbtn">🔁 再玩一次</button>
</div></div>
<script>
(function(){
"use strict";
var WORDS=["who","which","that","whose","where","when","why"];
var Q=[
{q:["The book "," I bought yesterday is very interesting."],a:"which",n:"先行詞係物",e:"先行詞係物（the book），用 which（that 都啱）。"},
{q:["The girl "," hair is long is my sister."],a:"whose",n:"表示所屬",e:"「頭髮」屬於個女仔 → whose（…的）。"},
{q:["This is the house "," I grew up."],a:"where",n:"先行詞係地方",e:"地方（the house）+「喺嗰度」→ where。"},
{q:["My teacher, "," is very kind, helped me a lot."],a:"who",n:"有逗號＋指人",e:"有逗號係非限定性，唔可以用 that；指人用 who。"},
{q:["The car, "," was made in Japan, is quite expensive."],a:"which",n:"有逗號＋指物",e:"有逗號唔用 that；指物用 which。"},
{q:["Do you know the reason "," she was absent?"],a:"why",n:"先行詞係原因",e:"reason（原因）→ why 最自然。"},
{q:["Anyone "," wants to join the club must sign up."],a:"who",n:"指人（做主語）",e:"anyone 係人，喺子句做主語（wants）→ who。"},
{q:["The movie "," we watched was fantastic."],a:"which",n:"先行詞係物",e:"the movie 係物 → which（受詞關係代詞有時可省略）。"},
{q:["2003, "," SARS broke out, was a difficult year."],a:"when",n:"有逗號＋指時間",e:"時間（2003）→ when；有逗號唔用 that。"},
{q:["The man "," lives next door is a doctor."],a:"who",n:"指人（做主語）",e:"the man 係人，做主語（lives）→ who。"}
];
var idx=0,score=0,correct=0,best=0,locked=false,order=[];
try{best=parseInt(localStorage.getItem('relFillBest')||'0',10)||0;}catch(e){}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function $(id){return document.getElementById(id);}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showQ(){
  locked=false;
  $('fb').className='fb';$('fb').style.display='none';$('nextbtn').style.display='none';
  var item=Q[order[idx]];
  $('qnum').textContent=idx+1;
  $('hintline').textContent='💡 提示：'+item.n;
  $('sent').innerHTML=escapeHtml(item.q[0])+'<span class="blank" id="blank">&nbsp;?&nbsp;</span>'+escapeHtml(item.q[1]);
  var box=$('chips');box.innerHTML='';
  WORDS.forEach(function(w){
    var b=document.createElement('button');
    b.className='chip';b.textContent=w;
    b.addEventListener('click',function(){fill(w,b);});
    box.appendChild(b);
  });
}
function fill(w,btn){
  if(locked)return;locked=true;
  var item=Q[order[idx]];
  var ok=(w===item.a);
  var blank=$('blank');
  if(ok){
    blank.textContent=w;blank.classList.add('filled');
    score+=100;correct++;
    $('fb').className='fb good';
    $('fb').innerHTML='✅ 啱！+100 分<br><b>文法：</b>'+item.e;
  }else{
    btn.classList.add('shake');
    score=Math.max(0,score-20);
    $('fb').className='fb bad';
    $('fb').innerHTML='❌ 「'+w+'」唔啱，扣 20 分，再諗下！<br><b>文法：</b>'+item.e;
    setTimeout(function(){btn.classList.remove('shake');locked=false;},500);
    $('score').textContent=score;
    return;
  }
  $('score').textContent=score;
  $('acc').textContent=Math.round(correct/(idx+1)*100)+'%';
  $('fb').style.display='block';$('nextbtn').style.display='block';
  $('nextbtn').textContent=(idx>=Q.length-1)?'睇成績 →':'下一題 →';
}
function next(){idx++;if(idx>=Q.length){endGame();}else{showQ();}}
$('nextbtn').addEventListener('click',next);
function endGame(){
  $('end').classList.remove('hide');
  var nb='';
  if(score>best){try{localStorage.setItem('relFillBest',String(score));}catch(e){}best=score;nb=' 🏅 新紀錄！';}
  var acc=Math.round(correct/Q.length*100);
  $('finalScore').innerHTML='總分：<b>'+score+'</b> 分'+nb+'<br>準確率：'+acc+'%（'+correct+'/'+Q.length+'）<br>歷史最佳：'+best+' 分<br>'+(acc===100?'🌟 完美！你係關係代詞大師！':'💪 記住：人→who、物→which、所屬→whose、有逗號唔用 that！');
}
function reset(){
  idx=0;score=0;correct=0;
  order=shuffle(Q.map(function(_,i){return i;}));
  $('score').textContent='0';$('acc').textContent='-';
  $('end').classList.add('hide');showQ();
}
$('startbtn').addEventListener('click',function(){$('intro').classList.add('hide');reset();});
$('againbtn').addEventListener('click',reset);
reset();
$('intro').classList.remove('hide');
})();
</script>
</body>
</html>
