<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>數學掘金者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans HK",sans-serif;background:linear-gradient(180deg,#2a1a0c 0%,#1a1006 55%,#0d0803 100%);color:#fff;min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
/* 燈籠光 */
.lantern{position:fixed;top:8%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fef3c7,#fbbf24 55%,#b45309);box-shadow:0 0 50px 18px rgba(251,191,36,.35);z-index:0;animation:swayl 5s ease-in-out infinite}
.lantern::after{content:'';position:absolute;top:-34px;left:50%;width:2px;height:34px;background:rgba(251,191,36,.5);transform:translateX(-50%)}
@keyframes swayl{0%,100%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:12px 14px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:15px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(251,191,36,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:999px;min-height:44px}
.best{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(251,191,36,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:999px;min-height:44px}
.hud{display:flex;gap:10px;margin-bottom:10px}
.hud .pill{flex:1;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(251,191,36,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:9px 6px;font-size:14px;font-weight:800}
.hud .pill small{display:block;font-size:11px;font-weight:500;opacity:.7}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:8px;box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.4);touch-action:none}
.cell{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.cell.tunnel{background:rgba(255,255,255,.06)}
.cell.soil{background:linear-gradient(145deg,#8a5a2b,#5c3a17);box-shadow:inset 0 2px 4px rgba(255,255,255,.18);cursor:pointer}
.cell.soil:active{filter:brightness(1.25)}
.cell.dug{animation:dug .3s ease;background:rgba(255,255,255,.06)}
@keyframes dug{0%{transform:scale(1.2);filter:brightness(1.6)}100%{transform:scale(1)}}
.cell .p{animation:pop-in .25s ease}
@keyframes pop-in{from{transform:scale(.4)}to{transform:scale(1)}}
.cell.coin{background:radial-gradient(circle,rgba(251,191,36,.35),rgba(251,191,36,.06));box-shadow:0 0 12px rgba(251,191,36,.45)}
.coinglow{animation:coinglow 1.6s ease-in-out infinite}
@keyframes coinglow{0%,100%{transform:scale(1) rotate(-8deg)}50%{transform:scale(1.18) rotate(8deg)}}
.cell.exitopen{background:radial-gradient(circle,rgba(52,211,153,.55),rgba(52,211,153,.1));box-shadow:0 0 16px rgba(52,211,153,.7)}
.controls{display:flex;gap:12px;margin-top:14px;align-items:center;justify-content:space-between}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px}
.dpad button{border:none;border-radius:16px;background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.4);color:#fde68a;font-size:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.4);font-family:inherit}
.dpad button:active{transform:scale(.92);background:rgba(251,191,36,.35)}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
.digbtn{flex:1;min-height:96px;margin-left:8px;font-size:20px;font-weight:900;color:#3b2507;background:linear-gradient(135deg,#fde68a,#f59e0b);border:none;border-radius:20px;cursor:pointer;box-shadow:0 10px 28px rgba(245,158,11,.45);font-family:inherit}
.digbtn:active{transform:scale(.95)}
.hint{text-align:center;font-size:13px;opacity:.65;margin-top:10px;line-height:1.7}
.screen{display:none}
.screen.show{display:block;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:22px 10px 14px}
.hero .emoji{font-size:64px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.hero h1{font-size:32px;font-weight:900;margin:10px 0 6px;color:#fde68a}
.hero p{font-size:15px;opacity:.85;line-height:1.8}
.diffcards{display:grid;gap:12px;margin:16px 0}
.diff{background:rgba(255,255,255,.08);border:1px solid rgba(251,191,36,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;min-height:76px;transition:transform .12s;box-shadow:0 10px 26px rgba(0,0,0,.4);text-align:left;width:100%;color:#fff;font-family:inherit}
.diff:active{transform:scale(.97)}
.diff .dicon{font-size:38px}
.diff b{font-size:19px;display:block;color:#fde68a}
.diff span{font-size:13px;opacity:.75}
.concept{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.show{display:flex}
.mcard{width:100%;max-width:400px;background:linear-gradient(160deg,#2e2008,#14100a);border:1px solid rgba(251,191,36,.5);border-radius:24px;padding:26px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:mup .3s ease}
@keyframes mup{from{transform:translateY(26px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.mcard .mq{font-size:30px;font-weight:900;margin:10px 0 18px;color:#fde68a}
.mcard .mopts{display:grid;gap:10px}
.mcard .mopt{min-height:60px;font-size:20px;font-weight:800;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.25);font-family:inherit}
.mcard .mopt:active{transform:scale(.96)}
.mcard .mopt.right{background:linear-gradient(135deg,#34d399,#059669)}
.mcard .mopt.wrong{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.endcard{text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(251,191,36,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:34px 20px;box-shadow:0 18px 44px rgba(0,0,0,.5);margin-top:16px}
.endcard .emoji{font-size:72px}
.endcard h2{font-size:30px;margin:12px 0 8px;color:#fde68a}
.endcard .score{font-size:52px;font-weight:900;color:#fbbf24}
.endcard p{font-size:15px;opacity:.85;margin:8px 0 20px;line-height:1.7}
.bigbtn{display:block;width:100%;min-height:60px;margin-top:12px;font-size:20px;font-weight:800;color:#3b2507;background:linear-gradient(135deg,#fde68a,#f59e0b);border:none;border-radius:18px;cursor:pointer;box-shadow:0 10px 24px rgba(245,158,11,.4);font-family:inherit}
.bigbtn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(251,191,36,.35);box-shadow:none}
.feedback{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-size:56px;font-weight:900;opacity:0;pointer-events:none;z-index:70;text-shadow:0 6px 24px rgba(0,0,0,.5)}
.feedback.pop{animation:pop .7s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
</style>
</head>
<body>
<div class="lantern" style="left:6%"></div>
<div class="lantern" style="right:6%;animation-delay:-2.5s"></div>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="games.html">← 返回遊戲列表</a>
    <div class="best">🏆 <span id="bestNum">0</span></div>
  </div>

  <div id="menu" class="screen show">
    <div class="hero">
      <div class="emoji">⛏️</div>
      <h1>數學掘金者</h1>
      <p>掘開泥土、收集金幣——行到金幣上面要答啱題先拎到！<br>避開守衛，集齊金幣後走到綠色出口，共 3 關。</p>
    </div>
    <div class="diffcards">
      <button class="diff" data-d="easy"><div class="dicon">🌱</div><div><b>初階 · 中一至中二</b><span>整數運算</span></div></button>
      <button class="diff" data-d="mid"><div class="dicon">🌿</div><div><b>中階 · 中三至中四</b><span>坐標與斜率</span></div></button>
      <button class="diff" data-d="hard"><div class="dicon">🌳</div><div><b>高階 · 中五至中六</b><span>直線方程</span></div></button>
    </div>
    <div class="concept">💡 <b>數學概念</b><br>初階：整數加減乘除。<br>中階：坐標平面象限、兩點間斜率 m=(y₂−y₁)/(x₂−x₁)。<br>高階：直線方程 y=mx+c，m 為斜率、c 為 y 截距。</div>
  </div>

  <div id="game" class="screen">
    <div class="hud">
      <div class="pill">❤️ <span id="lives">3</span><small>生命</small></div>
      <div class="pill">🪙 <span id="coins">0</span>/5<small>金幣</small></div>
      <div class="pill">⭐ <span id="score">0</span><small>分數</small></div>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <div class="dpad">
        <button class="up" data-m="0,-1">▲</button>
        <button class="left" data-m="-1,0">◀</button>
        <button class="right" data-m="1,0">▶</button>
        <button class="down" data-m="0,1">▼</button>
      </div>
      <button class="digbtn" id="digBtn">⛏️<br>掘泥土</button>
    </div>
    <div class="hint">方向掣或滑動移動 · 企喺泥土隔籬撳「掘泥土」<br>（或直接撳隔籬嘅泥土格）開路</div>
  </div>

  <div id="end" class="screen">
    <div class="endcard">
      <div class="emoji" id="endEmoji">🏆</div>
      <h2 id="endTitle">全部過關！</h2>
      <div class="score" id="endScore">0</div>
      <p id="endMsg"></p>
      <button class="bigbtn" id="againBtn">🔁 再玩一次</button>
      <button class="bigbtn ghost" id="menuBtn">🏠 返回選單</button>
    </div>
  </div>
</div>

<div class="modal" id="qmodal"><div class="mcard">
  <div style="font-size:14px;opacity:.7">🪙 金幣考驗</div>
  <div class="mq" id="mq">…</div>
  <div class="mopts" id="mopts"></div>
</div></div>
<div class="feedback" id="feedback"></div>

<script>
"use strict";
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function makeOpts(ans,cands){var seen={},out=[String(ans)];seen[String(ans)]=1;var cs=shuffle(cands);for(var i=0;i<cs.length;i++){var s=String(cs[i]);if(!seen[s]){seen[s]=1;out.push(s);if(out.length>=4)break;}}var s2=shuffle(out);return {opts:s2,ans:s2.indexOf(String(ans))};}
function Q(q,ans,cands){var o=makeOpts(ans,cands);return {q:q,opts:o.opts,ans:o.ans};}
function genEasy(){
  var t=ri(0,3),a=ri(-15,15),b=ri(-15,15);
  if(t===0)return Q(a+' + ('+b+') = ?',a+b,[a+b+1,a+b-1,a+b+2,a-b]);
  if(t===1)return Q(a+' − ('+b+') = ?',a-b,[a-b+1,a-b-1,a-b+2,a+b]);
  if(t===2){if(b===0)b=3;return Q('('+a+') × ('+b+') = ?',a*b,[a*b+1,a*b-1,-(a*b),a*b+2]);}
  if(b===0)b=4;var k=ri(-8,8);a=b*k;return Q('('+a+') ÷ ('+b+') = ?',k,[k+1,k-1,-k,k+2]);
}
function genMid(){
  var t=ri(0,3);
  if(t===0){
    var x=ri(1,8),y=ri(1,8),sx=Math.random()<.5?-1:1,sy=Math.random()<.5?-1:1;
    x*=sx;y*=sy;
    var ans=x>0?(y>0?'一':'四'):(y>0?'二':'三');
    return Q('點 ('+x+', '+y+') 在第幾象限？','第'+ans+'象限',['第一象限','第二象限','第三象限','第四象限'].filter(function(s){return s!=='第'+ans+'象限';})||[]);
  }
  if(t===1){var x1=ri(-5,5),y1=ri(-5,5),dx=ri(1,5),dy=ri(-5,5);var x2=x1+dx,y2=y1+dy;
    return Q('直線通過 ('+x1+', '+y1+') 和 ('+x2+', '+y2+')，斜率是？',dy+'/'+dx,[(dy+1)+'/'+dx,dy+'/'+(dx+1),(dy-1)+'/'+dx,(-dy)+'/'+dx]);}
  if(t===2){var m=ri(-4,4);if(m===0)m=2;
    return Q('直線 y = '+m+'x + 3 的斜率是？',m,[m+1,m-1,-m,3]);}
  var q=ri(1,9);
  return Q('點 (0, '+q+') 在哪一條軸上？','y 軸',['x 軸','原點','第一象限']);
}
function genHard(){
  var t=ri(0,3);
  if(t===0){var m=ri(-4,4),c=ri(-6,6);if(m===0)m=3;
    var dc=(c===0)?2:-c;
    return Q('直線 y = '+m+'x + ('+c+') 的 y 截距是？',c,[c+1,c-1,m,dc]);}
  if(t===1){var m2=ri(2,5),c2=ri(1,6);
    return Q('斜率為 '+m2+'、通過 (0, '+c2+') 的直線方程是？','y = '+m2+'x + '+c2,['y = '+c2+'x + '+m2,'y = '+m2+'x − '+c2,'y = '+(-m2)+'x + '+c2,'x = '+m2+'y + '+c2]);}
  if(t===2){var x1=ri(-4,4),y1=ri(-4,4),x2=x1+ri(1,4),m3=ri(-3,3);if(m3===0)m3=2;var y2=y1+m3*(x2-x1);
    return Q('通過 ('+x1+', '+y1+')、斜率為 '+m3+' 的直線方程是？','y = '+m3+'x + '+(y1-m3*x1),['y = '+m3+'x + '+(y1-m3*x1+1),'y = '+(-m3)+'x + '+y1,'y = '+m3+'x + '+y1,'x = '+m3+'y + '+y1]);}
  var a=ri(1,4),b=ri(1,6);
  return Q('直線 '+a+'x + '+b+'y = '+(a*b)+' 的斜率是？','−'+a+'/'+b,['−'+b+'/'+a,a+'/'+b,'−'+(a+1)+'/'+b,'−'+a+'/'+(b+1)]);
}
var AC=null;
function tone(f,d,type,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),ga=AC.createGain();o.type=type||'sine';o.frequency.value=f;ga.gain.setValueAtTime(g||.1,AC.currentTime);ga.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(ga);ga.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function sndGood(){tone(740,.12,'triangle');setTimeout(function(){tone(988,.18,'triangle');},100);}
function sndBad(){tone(180,.3,'sawtooth',.07);}
function sndDig(){tone(220,.08,'square',.05);}
function sndWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.2,'triangle');},i*140);});}
var DIFFS={easy:{gen:genEasy,key:'lod_best_easy'},mid:{gen:genMid,key:'lod_best_mid'},hard:{gen:genHard,key:'lod_best_hard'}};
var W=10,H=8,diff='easy',level=1,lives=3,score=0;
var cells=[],player={x:0,y:0},guards=[],coins=[],exitOpen=false,exit={x:W-1,y:H-1},paused=false,loopId=null;
var MAXLV=3,NCOIN=5;
function show(id){var ss=['menu','game','end'];for(var i=0;i<ss.length;i++)document.getElementById(ss[i]).classList.toggle('show',ss[i]===id);}
function getBest(){return parseInt(localStorage.getItem(DIFFS[diff].key)||'0',10);}
function setBest(v){if(v>getBest())localStorage.setItem(DIFFS[diff].key,String(v));}
document.getElementById('bestNum').textContent=getBest();
var db=document.querySelectorAll('.diff');
for(var bi=0;bi<db.length;bi++)(function(b){b.addEventListener('click',function(){diff=b.dataset.d;startGame();});})(db[bi]);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('menuBtn').addEventListener('click',function(){stopLoop();show('menu');document.getElementById('bestNum').textContent=getBest();});
function feedback(t){var f=document.getElementById('feedback');f.textContent=t;f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');}
function startGame(){level=1;lives=3;score=0;document.getElementById('bestNum').textContent=getBest();show('game');buildLevel();}
function buildLevel(){
  cells=[];guards=[];coins=[];exitOpen=false;paused=false;
  player={x:0,y:0};
  for(var y=0;y<H;y++){cells.push([]);for(var x=0;x<W;x++)cells[y].push((x+y)%3===0?1:0);}
  cells[0][0]=0;cells[0][1]=0;cells[1][0]=0;
  cells[exit.y][exit.x]=0;
  var placed=0,guard=0;
  while(placed<NCOIN&&guard<400){guard++;var x=ri(1,W-1),y=ri(1,H-1);
    if(cells[y][x]===1&&!(x<=1&&y<=1)){coins.push({x:x,y:y,taken:false});placed++;}}
  guard=0;var ng=2+level;
  while(guards.length<ng&&guard<400){guard++;var gx=ri(2,W-1),gy=ri(2,H-1);
    if(cells[gy][gx]===0){var dup=false;for(var i=0;i<guards.length;i++)if(guards[i].x===gx&&guards[i].y===gy)dup=true;
      if(!dup)guards.push({x:gx,y:gy});}}
  render();updateHud();startLoop();
}
function startLoop(){stopLoop();loopId=setInterval(function(){if(paused)return;moveGuards();render();checkGuard();},900);}
function stopLoop(){clearInterval(loopId);loopId=null;}
function render(){
  var bd=document.getElementById('board');bd.innerHTML='';
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var c=document.createElement('div');c.dataset.x=x;c.dataset.y=y;
    var v=cells[y][x];
    if(v===1){c.className='cell soil';}
    else{c.className='cell tunnel';}
    var isCoin=false;
    for(var i=0;i<coins.length;i++)if(!coins[i].taken&&coins[i].x===x&&coins[i].y===y){isCoin=true;break;}
    if(isCoin){c.classList.add('coin');c.innerHTML='<span class="coinglow">🪙</span>';}
    else if(player.x===x&&player.y===y)c.innerHTML='<span class="p">🧑‍🌾</span>';
    else{for(var j=0;j<guards.length;j++)if(guards[j].x===x&&guards[j].y===y){c.innerHTML='<span class="p">💂</span>';break;}}
    if(exitOpen&&x===exit.x&&y===exit.y){c.className='cell exitopen';if(!(player.x===x&&player.y===y))c.innerHTML='<span class="p">🚪</span>';else c.innerHTML='<span class="p">🧑‍🌾</span>';}
    (function(cx,cy){c.addEventListener('click',function(){tryDig(cx,cy);});})(x,y);
    bd.appendChild(c);
  }
}
function updateHud(){document.getElementById('lives').textContent=lives;document.getElementById('score').textContent=score;document.getElementById('coins').textContent=coins.filter(function(c){return c.taken;}).length;}
function canStand(x,y){return x>=0&&y>=0&&x<W&&y<H&&cells[y][x]===0;}
function move(dx,dy){
  if(paused)return;
  var nx=player.x+dx,ny=player.y+dy;
  if(canStand(nx,ny)){player.x=nx;player.y=ny;tone(320,.05,'triangle',.04);render();afterMove();}
}
function afterMove(){
  checkGuard();if(paused)return;
  for(var i=0;i<coins.length;i++){
    if(!coins[i].taken&&coins[i].x===player.x&&coins[i].y===player.y){askCoin(coins[i]);break;}
  }
  if(paused)return;
  if(exitOpen&&player.x===exit.x&&player.y===exit.y){
    score+=300;sndWin();feedback('🚪');paused=true;
    setTimeout(function(){if(level>=MAXLV)finish(true);else{level++;buildLevel();}},900);
  }
}
function checkGuard(){
  for(var i=0;i<guards.length;i++)if(guards[i].x===player.x&&guards[i].y===player.y){hitPlayer();break;}
}
function hitPlayer(){
  lives--;sndBad();feedback('💂');updateHud();
  if(lives<=0){finish(false);return;}
  player={x:0,y:0};render();
}
function moveGuards(){
  for(var i=0;i<guards.length;i++){
    var g=guards[i],ds=shuffle([[1,0],[-1,0],[0,1],[0,-1]]);
    for(var j=0;j<ds.length;j++){var nx=g.x+ds[j][0],ny=g.y+ds[j][1];
      if(canStand(nx,ny)){g.x=nx;g.y=ny;break;}}
  }
}
function adjSoil(x,y){
  var ds=[[1,0],[-1,0],[0,1],[0,-1]],out=[];
  for(var i=0;i<ds.length;i++){var nx=x+ds[i][0],ny=y+ds[i][1];
    if(nx>=0&&ny>=0&&nx<W&&ny<H&&cells[ny][nx]===1)out.push({x:nx,y:ny});}
  return out;
}
function tryDig(x,y){
  if(paused)return;
  var ok=false;
  if(cells[y][x]===1){
    var ds=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<ds.length;i++)if(player.x===x+ds[i][0]&&player.y===y+ds[i][1])ok=true;
  }
  if(!ok)return;
  cells[y][x]=0;sndDig();render();
  for(var j=0;j<coins.length;j++)if(!coins[j].taken&&coins[j].x===x&&coins[j].y===y){/* coin revealed */}
}
document.getElementById('digBtn').addEventListener('click',function(){
  if(paused)return;
  var s=adjSoil(player.x,player.y);
  if(s.length>0){cells[s[0].y][s[0].x]=0;sndDig();render();}
  else{tone(150,.1,'square',.05);}
});
function askCoin(coin){
  paused=true;
  var q=DIFFS[diff].gen();
  document.getElementById('mq').textContent=q.q;
  var box=document.getElementById('mopts');box.innerHTML='';
  for(var i=0;i<q.opts.length;i++)(function(t,idx){
    var b=document.createElement('button');b.className='mopt';b.textContent=t;
    b.addEventListener('click',function(){
      if(idx===q.ans){
        b.classList.add('right');sndGood();coin.taken=true;score+=100;updateHud();
        setTimeout(function(){
          document.getElementById('qmodal').classList.remove('show');paused=false;
          if(coins.every(function(c){return c.taken;})){exitOpen=true;feedback('🚪 出口開了！');tone(880,.2,'triangle');}
          render();
        },650);
      }else{
        b.classList.add('wrong');sndBad();
        var kids=box.children;if(kids[q.ans])kids[q.ans].classList.add('right');
        setTimeout(function(){document.getElementById('qmodal').classList.remove('show');paused=false;render();},1300);
      }
    });
    box.appendChild(b);
  })(q.opts[i],i);
  document.getElementById('qmodal').classList.add('show');
}
function finish(won){
  stopLoop();paused=true;setBest(score);
  if(won){sndWin();document.getElementById('endEmoji').textContent='🏆';document.getElementById('endTitle').textContent='全部過關！';document.getElementById('endMsg').innerHTML='金幣大豐收，3 關全破！<br>🏆 歷史最佳：'+getBest()+' 分';}
  else{document.getElementById('endEmoji').textContent='💂';document.getElementById('endTitle').textContent='遊戲結束';document.getElementById('endMsg').innerHTML='到達第 '+level+' 關，再接再厲！<br>🏆 歷史最佳：'+getBest()+' 分';}
  document.getElementById('endScore').textContent=score;
  show('end');
}
var dp=document.querySelectorAll('.dpad button');
for(var di=0;di<dp.length;di++)(function(b){var m=b.dataset.m.split(',');b.addEventListener('click',function(){move(parseInt(m[0],10),parseInt(m[1],10));});})(dp[di]);
(function(){
  var bd=document.getElementById('board'),sx=0,sy=0;
  bd.addEventListener('touchstart',function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  bd.addEventListener('touchend',function(e){
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
  },{passive:true});
})();
document.addEventListener('keydown',function(e){
  if(document.getElementById('game').classList.contains('show')){
    if(e.key==='ArrowUp')move(0,-1);else if(e.key==='ArrowDown')move(0,1);
    else if(e.key==='ArrowLeft')move(-1,0);else if(e.key==='ArrowRight')move(1,0);
  }
});
</script>
</body>
