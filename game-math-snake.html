<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>數學貪食蛇</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Courier New",monospace;background:#0a0a0a;color:#fff;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.crt{position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);opacity:.5}
header{background:#1a1a2e;padding:12px;text-align:center;border-bottom:4px solid #4ade80}
header h1{margin:0;font-size:20px;letter-spacing:2px;color:#4ade80;text-shadow:2px 2px 0 #166534}
.back{display:block;text-align:center;background:#222;color:#4ade80;text-decoration:none;padding:12px;font-size:15px;font-weight:700}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.hud{display:flex;justify-content:space-between;background:#1a1a2e;border:3px solid #4ade80;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.hud span{color:#ffd23f}
#cvwrap{border:4px solid #4ade80;background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px;justify-content:center;margin-top:14px}
.dpad button{font-size:24px;font-weight:700;font-family:inherit;background:#1a1a2e;color:#4ade80;border:3px solid #4ade80;cursor:pointer}
.dpad button:active{background:#4ade80;color:#000}
.dpad .blank{visibility:hidden}
.msg{min-height:30px;text-align:center;font-size:16px;font-weight:700;margin-top:8px;color:#4ade80}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow-y:auto}
.card{background:#1a1a2e;border:4px solid #4ade80;padding:24px 20px;max-width:480px;width:100%;text-align:center}
.card h2{margin:0 0 12px;font-size:22px;color:#4ade80;text-shadow:2px 2px 0 #166534}
.card p{font-size:15px;line-height:1.8;text-align:left}
.bigbtn{width:100%;min-height:60px;font-size:20px;font-weight:700;font-family:inherit;background:#4ade80;color:#000;border:3px solid #fff;margin-top:14px;cursor:pointer}
.bigbtn:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="crt"></div>
<header><h1>🐍 數學貪食蛇</h1></header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<div class="wrap">
<div class="hud"><div>🎯 目標 <span id="target">20</span></div><div>🍎 肚 <span id="belly">0</span></div><div>⭐ <span id="score">0</span></div><div>❤️ <span id="lives">3</span></div></div>
<div id="cvwrap"><canvas id="cv" width="400" height="400"></canvas></div>
<div class="dpad">
<button class="blank"></button><button id="up">▲</button><button class="blank"></button>
<button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
<button class="blank"></button><button id="restart" style="font-size:14px">↻</button><button class="blank"></button>
</div>
<div class="msg" id="msg"></div>
</div>
<div class="overlay" id="intro"><div class="card">
<h2>🐍 數學貪食蛇</h2>
<p>🕹️ 玩法：用方向掣控制條蛇，食數字！你個「肚」係食咗嘅數字總和——要啱啱好等於🎯目標先過關！<br>
⚠️ 肚超過目標會爆肚（扣一命）；撞牆、撞自己都扣一命。3 條命，過 5 關！<br>
💡 數學概念：加法、心算湊數，諗下邊幾個數加埋啱啱好！</p>
<button class="bigbtn" onclick="startGame()">▶ 開始遊戲</button>
</div></div>
<div class="overlay" id="over" style="display:none"><div class="card">
<h2 id="overTitle">🏁 GAME OVER</h2>
<p id="overText" style="text-align:center;font-size:18px"></p>
<button class="bigbtn" onclick="startGame()">🔁 再玩一次</button>
</div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var N=16,CELL=25;
var snake,dir,ndir,food,target,belly,score,lives,round,running,timer,foods;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function newFood(){
  while(true){
    var x=rnd(0,N-1),y=rnd(0,N-1),bad=false;
    for(var s of snake)if(s.x===x&&s.y===y){bad=true;break;}
    for(var f of foods)if(f.x===x&&f.y===y){bad=true;break;}
    if(!bad)return {x:x,y:y,v:rnd(1,9)};
  }
}
function newRound(){
  snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];
  dir={x:1,y:0};ndir=dir;belly=0;
  target=rnd(2,5)*10+round*5; // 20,25,30...
  foods=[];for(var i=0;i<3;i++)foods.push(newFood());
  document.getElementById('target').textContent=target;
  document.getElementById('belly').textContent='0';
  document.getElementById('msg').textContent='第 '+round+' / 5 關：湊到 '+target+'！';
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,400,400);
  ctx.strokeStyle='#1a1a1a';
  for(var i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,400);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(400,i*CELL);ctx.stroke();}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var f of foods){
    ctx.fillStyle='#e94560';ctx.fillRect(f.x*CELL+2,f.y*CELL+2,CELL-4,CELL-4);
    ctx.fillStyle='#fff';ctx.font='bold 15px "Courier New",monospace';
    ctx.fillText(f.v,f.x*CELL+CELL/2,f.y*CELL+CELL/2+1);
  }
  snake.forEach(function(s,i){
    ctx.fillStyle=i===0?'#4ade80':'#22c55e';
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    if(i===0){ctx.fillStyle='#000';ctx.fillRect(s.x*CELL+6,s.y*CELL+6,4,4);ctx.fillRect(s.x*CELL+15,s.y*CELL+6,4,4);}
  });
}
function loseLife(msg){
  lives--;document.getElementById('lives').textContent=lives;
  document.getElementById('msg').textContent=msg+'（仲有 '+lives+' 命）';
  if(lives<=0){gameOver(false);return;}
  newRound();
}
function gameOver(win){
  running=false;clearInterval(timer);
  document.getElementById('overTitle').textContent=win?'🏆 全部過關！':'💀 GAME OVER';
  var best=0;try{best=parseInt(localStorage.getItem('snakeBest')||'0');}catch(e){}
  var nb='';
  if(score>best){try{localStorage.setItem('snakeBest',score);}catch(e){}nb=' 🏅新紀錄！';}
  document.getElementById('overText').innerHTML='總分：'+score+nb+'<br>最佳：'+Math.max(score,best);
  document.getElementById('over').style.display='flex';
}
function step(){
  if(!running)return;
  dir=ndir;
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=N||h.y<0||h.y>=N){loseLife('🧱 撞牆！');return;}
  for(var s of snake)if(s.x===h.x&&s.y===h.y){loseLife('🌀 撞到自己！');return;}
  snake.unshift(h);
  var ate=-1;
  for(var i=0;i<foods.length;i++)if(foods[i].x===h.x&&foods[i].y===h.y){ate=i;break;}
  if(ate>=0){
    var v=foods[ate].v;
    belly+=v;
    document.getElementById('belly').textContent=belly;
    foods.splice(ate,1);foods.push(newFood());
    if(belly===target){
      score+=200;document.getElementById('score').textContent=score;
      if(round>=5){gameOver(true);return;}
      round++;newRound();
    }else if(belly>target){
      loseLife('💥 爆肚！'+belly+' > '+target);
      return;
    }
  }else snake.pop();
  draw();
}
function setD(x,y){
  if(x===-dir.x&&y===-dir.y)return;
  ndir={x:x,y:y};
}
document.getElementById('up').onclick=()=>setD(0,-1);
document.getElementById('down').onclick=()=>setD(0,1);
document.getElementById('left').onclick=()=>setD(-1,0);
document.getElementById('right').onclick=()=>setD(1,0);
document.getElementById('restart').onclick=function(){if(running)newRound();};
// swipe
var sx=0,sy=0;
cv.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
cv.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))setD(dx>0?1:-1,0);else setD(0,dy>0?1:-1);
},{passive:true});
window.startGame=function(){
  document.getElementById('intro').style.display='none';
  document.getElementById('over').style.display='none';
  score=0;lives=3;round=1;running=true;
  document.getElementById('score').textContent='0';
  document.getElementById('lives').textContent='3';
  newRound();draw();
  clearInterval(timer);timer=setInterval(step,220);
};
draw();
})();
</script>
</body>
</html>
