<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>數學馬戲團 · 星光大舞台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:linear-gradient(160deg,#2a0a4a 0%,#7b2ff7 55%,#f107a3 115%);background-attachment:fixed}
header{padding:14px 16px 6px;text-align:center}
header h1{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 14px rgba(240,7,163,.5)}
.back{display:inline-block;color:#ffd6f0;text-decoration:none;font-size:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:7px 16px;border-radius:999px;backdrop-filter:blur(8px)}
.hud{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 14px}
.hud .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hud .pill b{color:#ffe66d}
.wrap{max-width:480px;margin:0 auto;padding:6px 14px 26px}
#cvwrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 40px rgba(0,0,0,.45)}
canvas{width:100%;display:block}
#qbox{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(12px);border-radius:18px;padding:14px;text-align:center;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#qbox .q{font-size:24px;font-weight:800;color:#ffe66d;letter-spacing:1px;line-height:1.5}
#qbox .hint{font-size:13px;color:#f3d9f5;margin-top:6px}
#ansbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.abtn{min-height:66px;font-size:22px;font-weight:800;color:#fff;border:none;border-radius:18px;cursor:pointer;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .08s;padding:6px}
.abtn:active{transform:scale(.94)}
.abtn:disabled{opacity:.35}
#msg{min-height:32px;text-align:center;font-size:16px;font-weight:700;padding:8px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.overlay{position:fixed;inset:0;background:rgba(45,10,70,.72);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto}
.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px);border-radius:24px;padding:26px;max-width:450px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 10px;font-size:26px;font-weight:800}
.card p{font-size:15px;line-height:1.9;color:#fbe9ff}
.concept{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.8;text-align:left}
.concept b{color:#ffe66d}
.bigbtn{width:100%;min-height:62px;font-size:18px;font-weight:800;color:#fff;border:none;border-radius:16px;cursor:pointer;margin-top:8px;background:linear-gradient(135deg,#7b2ff7,#f107a3);box-shadow:0 8px 24px rgba(240,7,163,.45);transition:transform .08s}
.bigbtn:active{transform:scale(.96)}
.bigbtn.mid{background:linear-gradient(135deg,#a855f7,#ec4899)}
.bigbtn.high{background:linear-gradient(135deg,#f43f5e,#f59e0b)}
.bigbtn .sub{display:block;font-size:12.5px;font-weight:600;opacity:.9;margin-top:3px}
</style>
</head>
<body>
<header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<h1>🎪 數學馬戲團 · 星光大舞台</h1>
</header>
<div class="hud">
<div class="pill">分數 <b id="score">0</b></div>
<div class="pill">火圈 <b id="ring">1/8</b></div>
<div class="pill">❤️ <b id="lives">3</b></div>
</div>
<div class="wrap">
<div id="cvwrap"><canvas id="cv" width="300" height="280"></canvas></div>
<div id="qbox"><div class="q" id="qtext">?</div><div class="hint">答啱先可以跳過火圈！</div></div>
<div id="msg"></div>
<div id="ansbar">
<button class="abtn">?</button><button class="abtn">?</button><button class="abtn">?</button>
</div>
</div>

<div class="overlay" id="diffSel"><div class="card">
<h2>🎪 數學馬戲團</h2>
<p>選擇難度：</p>
<button class="bigbtn" id="dEasy">🌱 初階 · 中一至中二<span class="sub">四則運算</span></button>
<button class="bigbtn mid" id="dMid">🌿 中階 · 中三至中四<span class="sub">周界 · 面積</span></button>
<button class="bigbtn high" id="dHard">🌳 高階 · 中五至中六<span class="sub">立體表面積 · 體積</span></button>
</div></div>

<div class="overlay" id="intro" style="display:none"><div class="card">
<h2>🎪 玩法說明</h2>
<p><b>玩法：</b>獅子要跳過 8 個火圈！每個火圈有條數學題，<b>喺下面三個答案撳啱嗰個</b>，獅子先會跳過去。答錯會燒傷扣一條命，跳晒 8 個圈就表演成功！</p>
<div class="concept" id="conceptBox"></div>
<button class="bigbtn" id="startBtn">▶ 開始表演</button>
</div></div>

<div class="overlay" id="over" style="display:none"><div class="card">
<h2 id="overTitle">🎉 表演成功！</h2>
<p id="finalScore" style="font-size:18px"></p>
<button class="bigbtn" id="againBtn">🔁 再玩一次</button>
<button class="bigbtn" id="diffBtn" style="background:rgba(255,255,255,.18)">🎚️ 轉難度</button>
</div></div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=300,H=280;
var score=0,lives=3,ringNo=1,running=true,DIFF='easy';
var cur=null;
var msgEl=document.getElementById('msg');
var abtns=Array.prototype.slice.call(document.querySelectorAll('.abtn'));
var AC=null;

var CONCEPTS={
easy:'💡 <b>數學概念 — 四則運算：</b>加減乘除要快而準！乘法係連加嘅快捷方式：7 × 6 = 42。混合運算記住先乘除、後加減！',
mid:'💡 <b>數學概念 — 周界與面積：</b>長方形周界 = 2(長+闊)；長方形面積 = 長 × 闊；三角形面積 = ½ × 底 × 高；圓周界 = 2πr；圓面積 = πr²。',
hard:'💡 <b>數學概念 — 立體：</b>圓柱體積 = πr²h；圓柱總表面積 = 2πr(r+h)；圓錐體積 = ⅓πr²h；長方體總表面積 = 2(lw + lh + wh)。答案保留 π 就得！'};

function beep(f,d,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function flash(t,c){msgEl.textContent=t;msgEl.style.color=c||'#ffe66d';}
function hud(){document.getElementById('score').textContent=score;document.getElementById('ring').textContent=Math.min(ringNo,8)+'/8';document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives))||'—';}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pi(n){return n+'π';}

function mkEasy(){
  var kind=rnd(0,3),a,b,ans,expr;
  if(kind===0){a=rnd(15,99);b=rnd(15,99);ans=a+b;expr=a+' + '+b;}
  else if(kind===1){a=rnd(20,120);b=rnd(5,a-1);ans=a-b;expr=a+' − '+b;}
  else if(kind===2){a=rnd(3,12);b=rnd(3,12);ans=a*b;expr=a+' × '+b;}
  else{b=rnd(3,12);ans=rnd(3,15);a=b*ans;expr=a+' ÷ '+b;}
  return q3(expr,ans,false);
}
function mkMid(){
  var kind=rnd(0,4),expr,ans;
  if(kind===0){var l=rnd(4,15),w=rnd(3,12);ans=2*(l+w);expr='長方形周界<br><span style="font-size:16px">長 '+l+'，闊 '+w+'</span>';}
  else if(kind===1){var l2=rnd(4,12),w2=rnd(3,10);ans=l2*w2;expr='長方形面積<br><span style="font-size:16px">長 '+l2+'，闊 '+w2+'</span>';}
  else if(kind===2){var b=rnd(4,14),h=rnd(2,10);ans=b*h/2;expr='三角形面積<br><span style="font-size:16px">底 '+b+'，高 '+h+'</span>';}
  else if(kind===3){var r=rnd(2,8);ans=pi(2*r);expr='圓周界<br><span style="font-size:16px">半徑 '+r+'（答案以 π 表示）</span>';}
  else{var r2=rnd(2,7);ans=pi(r2*r2);expr='圓面積<br><span style="font-size:16px">半徑 '+r2+'（答案以 π 表示）</span>';}
  return q3(expr,ans,typeof ans==='string');
}
function mkHard(){
  var kind=rnd(0,4),expr,ans;
  if(kind===0){var r=rnd(2,5),h=rnd(3,8);ans=pi(r*r*h);expr='圓柱體體積<br><span style="font-size:16px">r = '+r+'，h = '+h+'</span>';}
  else if(kind===1){var r2=rnd(2,4),h2=rnd(2,6);ans=pi(2*r2*(r2+h2));expr='圓柱總表面積<br><span style="font-size:16px">r = '+r2+'，h = '+h2+'</span>';}
  else if(kind===2){var r3=rnd(2,4),h3=3*rnd(1,3);ans=pi(r3*r3*h3/3);expr='圓錐體體積<br><span style="font-size:16px">r = '+r3+'，h = '+h3+'</span>';}
  else if(kind===3){var l3=rnd(3,7),w3=rnd(2,5),h4=rnd(2,4);ans=2*(l3*w3+l3*h4+w3*h4);expr='長方體總表面積<br><span style="font-size:16px">'+l3+' × '+w3+' × '+h4+'</span>';}
  else{var l=rnd(3,8),w=rnd(2,6),hh=rnd(2,5);ans=l*w*hh;expr='長方體體積<br><span style="font-size:16px">'+l+' × '+w+' × '+hh+'</span>';}
  return q3(expr,ans,typeof ans==='string');
}
function q3(expr,ans,isPi){
  var opts,seen={};
  if(isPi){
    var base=parseInt(ans,10);
    opts=[ans];seen[ans]=1;
    while(opts.length<3){var d=base+rnd(-6,6);if(d>0&&d!==base&&!seen[pi(d)]){seen[pi(d)]=1;opts.push(pi(d));}}
  }else{
    opts=[ans];seen[ans]=1;
    var span=Math.max(4,Math.round(Math.abs(ans)*0.4));
    while(opts.length<3){var d2=ans+rnd(-span,span);if(d2!==ans&&d2>=0&&!seen[d2]){seen[d2]=1;opts.push(d2);}}
  }
  return {expr:expr,ans:ans,opts:shuffle(opts)};
}
function mkQ(){return DIFF==='easy'?mkEasy():DIFF==='mid'?mkMid():mkHard();}
function newRing(){
  cur=mkQ();
  document.getElementById('qtext').innerHTML=cur.expr+' = ?';
  for(var i=0;i<3;i++){abtns[i].disabled=false;abtns[i].textContent=cur.opts[i];}
  hud();
}
abtns.forEach(function(btn){
  btn.addEventListener('click',function(){
    if(!running||btn.disabled)return;
    var v=btn.textContent;
    for(var i=0;i<3;i++)abtns[i].disabled=true;
    if(v===String(cur.ans)){
      score+=100;beep(1320,0.13,'triangle');flash('✅ 答啱！跳！+100','#5ffbc8');
      jumpAnim(true);
    }else{
      lives--;beep(150,0.45,'sawtooth');flash('❌ 燒傷！正確答案係 '+cur.ans+'。-1❤️','#ff9db1');
      jumpAnim(false);
    }
    hud();
  });
});
function jumpAnim(ok){
  running=false;
  var t0=performance.now(),dur=950;
  function step(t){
    var p=Math.min(1,(t-t0)/dur);
    draw(p,ok);
    if(p<1){requestAnimationFrame(step);}
    else{
      if(!ok&&lives<=0){gameOver(false);return;}
      ringNo++;
      if(ringNo>8){gameOver(true);return;}
      running=true;newRing();draw(0,true);
    }
  }
  requestAnimationFrame(step);
}
function drawFlames(cx,cy,r,t){
  for(var i=0;i<18;i++){
    var a=i/18*Math.PI*2+t*2.4;
    var rad=r+Math.sin(t*9+i*1.7)*5;
    var fx=cx+Math.cos(a)*rad,fy=cy+Math.sin(a)*rad;
    var fg=ctx.createRadialGradient(fx,fy,0,fx,fy,9);
    var cols=[['#ffd166','#ff9a3c'],['#ff9a3c','#f43f5e'],['#fff3b0','#ffd166']][i%3];
    fg.addColorStop(0,cols[0]);fg.addColorStop(1,cols[1]);
    ctx.fillStyle=fg;
    ctx.beginPath();ctx.arc(fx,fy,7+Math.sin(t*11+i)*2.5,0,7);ctx.fill();
  }
}
function drawLion(x,y,celebrate,t){
  // mane (flower of circles)
  ctx.fillStyle='#e8930c';
  for(var i=0;i<8;i++){
    var a=i/8*Math.PI*2+t*1.2;
    ctx.beginPath();ctx.arc(x+16+Math.cos(a)*13,y-24+Math.sin(a)*13,8,0,7);ctx.fill();
  }
  // head
  var hg=ctx.createRadialGradient(x+12,y-28,3,x+16,y-24,18);
  hg.addColorStop(0,'#ffd98e');hg.addColorStop(1,'#e8930c');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(x+16,y-24,13,0,7);ctx.fill();
  // face
  ctx.fillStyle='#5b3a00';
  ctx.beginPath();ctx.arc(x+12,y-27,2.2,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+20,y-27,2.2,0,7);ctx.fill();
  ctx.fillStyle='#7a4a00';ctx.beginPath();ctx.arc(x+16,y-20,3,0,7);ctx.fill();
  // body
  var bg2=ctx.createLinearGradient(x-14,y-20,x+14,y);
  bg2.addColorStop(0,'#f5b942');bg2.addColorStop(1,'#d98a1f');
  ctx.fillStyle=bg2;
  ctx.beginPath();ctx.ellipse(x,y-10,15,11,0,0,7);ctx.fill();
  // legs
  ctx.fillStyle='#c77f1a';
  ctx.fillRect(x-13,y-4,7,9);ctx.fillRect(x+6,y-4,7,9);
  // tail
  ctx.strokeStyle='#c77f1a';ctx.lineWidth=4;ctx.beginPath();
  ctx.moveTo(x-14,y-14);ctx.quadraticCurveTo(x-26,y-18+Math.sin(t*6)*4,x-24,y-8);ctx.stroke();
  if(celebrate){
    ctx.fillStyle='#ffe66d';ctx.font='800 15px sans-serif';ctx.textAlign='center';
    ctx.fillText('★ ✦ ★',x+4,y-46+Math.sin(t*5)*3);
  }
}
function draw(p,ok){
  var t=performance.now()/1000;
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a0a4a');g.addColorStop(0.7,'#5b1e8f');g.addColorStop(1,'#8f2d7e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // spotlight beams
  ctx.save();ctx.globalAlpha=0.14;
  ctx.fillStyle='#ffe66d';
  ctx.beginPath();ctx.moveTo(60,0);ctx.lineTo(110,0);ctx.lineTo(190,H);ctx.lineTo(90,H);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(200,0);ctx.lineTo(250,0);ctx.lineTo(220,H);ctx.lineTo(150,H);ctx.closePath();ctx.fill();
  ctx.restore();
  // stars
  ctx.fillStyle='#fff';
  for(var s=0;s<26;s++){ctx.globalAlpha=0.2+0.5*Math.abs(Math.sin(t*1.5+s*2.1));ctx.fillRect((s*67)%W,(s*41)%(H-60),2,2);}
  ctx.globalAlpha=1;
  // stage floor
  var fg=ctx.createLinearGradient(0,H-46,0,H);
  fg.addColorStop(0,'#3d1663');fg.addColorStop(1,'#241040');
  ctx.fillStyle=fg;ctx.fillRect(0,H-46,W,46);
  ctx.fillStyle='rgba(255,230,109,.25)';ctx.fillRect(0,H-46,W,2);
  // fire ring
  var ringX=195,ringY=H-130,ringR=38;
  drawFlames(ringX,ringY,ringR,t);
  ctx.save();ctx.strokeStyle='#3a2a1a';ctx.lineWidth=10;ctx.shadowColor='#ff9a3c';ctx.shadowBlur=18;
  ctx.beginPath();ctx.arc(ringX,ringY,ringR-6,0,7);ctx.stroke();ctx.restore();
  ctx.fillStyle='rgba(20,8,30,.55)';ctx.beginPath();ctx.arc(ringX,ringY,ringR-12,0,7);ctx.fill();
  // lion
  var lx,ly=H-58;
  if(p===0){lx=52;}
  else{
    lx=52+(240-52)*p;
    ly=(H-58)-Math.sin(p*Math.PI)*(ok?105:36);
  }
  if(!ok&&p>0.45){
    ctx.save();ctx.globalAlpha=0.65;ctx.fillStyle='#f43f5e';
    ctx.beginPath();ctx.arc(lx+4,ly-16,26,0,7);ctx.fill();ctx.restore();
  }
  drawLion(lx,ly,ok&&p>0.75,t);
  // ring label
  ctx.fillStyle='#fff';ctx.font='800 12px -apple-system,"PingFang HK",sans-serif';ctx.textAlign='center';
  ctx.fillText('火圈 '+Math.min(ringNo,8)+' / 8',W/2,20);
}
function gameOver(win){
  var key='circusBest2',best=0;
  try{best=parseInt(localStorage.getItem(key)||'0',10)||0;}catch(e){}
  var nb='';
  if(score>best){try{localStorage.setItem(key,String(score));}catch(e){}nb=' 🏅新紀錄！';}
  document.getElementById('overTitle').textContent=win?'🎉 表演成功！':'🔥 表演失敗…';
  document.getElementById('finalScore').innerHTML='總分：<b style="color:#ffe66d">'+score+'</b> / 800'+nb+'<br>歷史最佳：'+Math.max(best,score);
  document.getElementById('over').style.display='flex';
  beep(win?1600:150,0.5,win?'triangle':'sawtooth');
}
function resetGame(){
  score=0;lives=3;ringNo=1;running=true;
  document.getElementById('over').style.display='none';
  document.getElementById('intro').style.display='none';
  newRing();draw(0,true);flash('');
}
function pickDiff(d){
  DIFF=d;
  document.getElementById('diffSel').style.display='none';
  document.getElementById('conceptBox').innerHTML=CONCEPTS[d];
  document.getElementById('intro').style.display='flex';
}
document.getElementById('dEasy').addEventListener('click',function(){pickDiff('easy');});
document.getElementById('dMid').addEventListener('click',function(){pickDiff('mid');});
document.getElementById('dHard').addEventListener('click',function(){pickDiff('hard');});
document.getElementById('startBtn').addEventListener('click',resetGame);
document.getElementById('againBtn').addEventListener('click',resetGame);
document.getElementById('diffBtn').addEventListener('click',function(){
  document.getElementById('over').style.display='none';
  document.getElementById('diffSel').style.display='flex';
});
draw(0,true);
})();
</script>
</body>
</html>
