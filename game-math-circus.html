<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>數學馬戲團</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1a0a00;color:#fff;font-family:"Courier New","Microsoft JhengHei",monospace;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
header{background:#3a1500;border-bottom:4px solid #ff8800;padding:10px;text-align:center}
header h1{margin:0;font-size:22px;color:#ff8800;text-shadow:2px 2px 0 #442200;letter-spacing:2px}
.hud{display:flex;justify-content:space-around;background:#111;border-bottom:4px solid #333;padding:8px;font-size:14px;font-weight:bold}
.hud span{color:#ffff00}
.wrap{max-width:480px;margin:0 auto;padding:10px}
#cvwrap{position:relative;border:4px solid #ff8800;background:#000}
canvas{width:100%;display:block;image-rendering:pixelated}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#qbox{background:#220a00;border:4px solid #ff8800;padding:10px;text-align:center;margin-top:10px}
#qbox .q{font-size:26px;font-weight:bold;color:#ffff00;letter-spacing:2px}
#qbox .hint{font-size:13px;color:#aaa;font-family:"Microsoft JhengHei",sans-serif;margin-top:4px}
#ansbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.abtn{min-height:64px;font-size:24px;font-weight:bold;background:#3a1500;color:#fff;border:4px solid #ff8800;cursor:pointer;font-family:inherit}
.abtn:active{background:#ff8800;color:#000}
.abtn:disabled{opacity:.4}
#msg{min-height:30px;text-align:center;font-size:16px;font-weight:bold;color:#ffff00;padding:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.card{background:#111;border:4px solid #ff8800;padding:24px;max-width:440px;width:100%;text-align:center}
.card h2{color:#ff8800;margin:0 0 12px;font-size:24px;text-shadow:2px 2px 0 #442200}
.card p{font-size:15px;line-height:1.8;font-family:"Microsoft JhengHei",sans-serif}
.concept{background:#2a1200;border:2px solid #ff8800;padding:10px;margin:12px 0;font-size:14px;text-align:left;font-family:"Microsoft JhengHei",sans-serif}
.concept b{color:#ffff00}
.bigbtn{width:100%;min-height:60px;font-size:20px;font-weight:bold;background:#ff8800;color:#000;border:4px solid #fff;cursor:pointer;font-family:inherit;margin-top:10px}
.bigbtn:active{transform:scale(.97)}
</style>
</head>
<body>
<header><h1>🎪 數學馬戲團</h1></header>
<div class="hud">
<div>分數 <span id="score">0</span></div>
<div>火圈 <span id="ring">1/8</span></div>
<div>❤️ <span id="lives">3</span></div>
</div>
<div class="wrap">
<div id="cvwrap"><canvas id="cv" width="240" height="220"></canvas><div id="scan"></div></div>
<div id="qbox"><div class="q" id="qtext">?</div><div class="hint">答啱先可以跳過火圈！</div></div>
<div id="msg"></div>
<div id="ansbar">
<button class="abtn">?</button><button class="abtn">?</button><button class="abtn">?</button>
</div>
</div>
<div class="overlay" id="intro"><div class="card">
<h2>🎪 數學馬戲團</h2>
<p><b>玩法：</b>獅子要跳過 8 個火圈！每個火圈有條算式，<b>喺下面三個答案撳啱嗰個</b>，獅子先會跳過去。答錯會燒傷，扣一條命。你有 3 條命！</p>
<div class="concept">💡 <b>數學概念 — 四則運算：</b>加減乘除要快而準！乘法係連加嘅快捷方式：例如 7 × 6 = 7+7+7+7+7+7 = 42。</div>
<button class="bigbtn" id="startBtn">▶ 開始表演</button>
</div></div>
<div class="overlay" id="over" style="display:none"><div class="card">
<h2 id="overTitle">🎉 表演成功！</h2>
<p id="finalScore" style="font-size:18px"></p>
<button class="bigbtn" id="againBtn">🔁 再玩一次</button>
</div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=240,H=220;
var score=0,lives=3,ringNo=1,running=true,anim=null;
var cur=null;
var msgEl=document.getElementById('msg');
var abtns=Array.prototype.slice.call(document.querySelectorAll('.abtn'));
var AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function flash(t,c){msgEl.textContent=t;msgEl.style.color=c||'#ffff00';}
function hud(){document.getElementById('score').textContent=score;document.getElementById('ring').textContent=Math.min(ringNo,8)+'/8';document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives))||'—';}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function mkQ(){
  var lv=ringNo,op,a,b,ans,expr;
  if(lv<=3){op=Math.random()<0.5?'+':'-';}
  else if(lv<=6){op=['+','-','×'][rnd(0,2)];}
  else{op=['+','-','×','÷'][rnd(0,3)];}
  if(op==='+'){a=rnd(6,49);b=rnd(6,49);ans=a+b;expr=a+' + '+b;}
  else if(op==='-'){a=rnd(12,70);b=rnd(2,a-1);ans=a-b;expr=a+' − '+b;}
  else if(op==='×'){a=rnd(2,9);b=rnd(2,9);ans=a*b;expr=a+' × '+b;}
  else{b=rnd(2,9);ans=rnd(2,12);a=b*ans;expr=a+' ÷ '+b;}
  var set={},opts=[ans];
  while(opts.length<3){var d=ans+rnd(-8,8);if(d!==ans&&d>=0&&!set[d]){set[d]=1;opts.push(d);}}
  for(var i=opts.length-1;i>0;i--){var j=rnd(0,i),t=opts[i];opts[i]=opts[j];opts[j]=t;}
  return {expr:expr,ans:ans,opts:opts};
}
function newRing(){
  cur=mkQ();
  document.getElementById('qtext').textContent=cur.expr+' = ?';
  for(var i=0;i<3;i++){abtns[i].disabled=false;abtns[i].textContent=cur.opts[i];}
  hud();
}
abtns.forEach(function(btn){
  btn.addEventListener('click',function(){
    if(!running||btn.disabled)return;
    var v=parseInt(btn.textContent,10);
    for(var i=0;i<3;i++)abtns[i].disabled=true;
    if(v===cur.ans){
      score+=100;beep(1200,0.12);flash('✅ 答啱！跳！+100','#00ff00');
      jumpAnim(true);
    }else{
      lives--;beep(150,0.4);flash('❌ 燒傷！正確答案係 '+cur.ans+'。-1❤️','#ff5555');
      jumpAnim(false);
    }
    hud();
  });
});
function jumpAnim(ok){
  running=false;
  var t0=performance.now(),dur=900;
  function step(t){
    var p=Math.min(1,(t-t0)/dur);
    draw(p,ok);
    if(p<1){requestAnimationFrame(step);}
    else{
      if(!ok&&lives<=0){gameOver(false);return;}
      ringNo++;
      if(ringNo>8){gameOver(true);return;}
      running=true;newRing();draw(0,true);
    }
  }
  requestAnimationFrame(step);
}
function drawFlames(cx,cy,r,t){
  var cols=['#ff4400','#ff8800','#ffcc00'];
  for(var i=0;i<16;i++){
    var a=i/16*Math.PI*2+t*3;
    var rr=r+Math.sin(t*10+i)*4;
    var fx=cx+Math.cos(a)*rr,fy=cy+Math.sin(a)*rr;
    ctx.fillStyle=cols[i%3];
    ctx.fillRect(fx-3,fy-3,6,6);
  }
}
function drawLion(x,y,celebrate){
  // pixel lion body
  ctx.fillStyle='#cc8800';
  ctx.fillRect(x-12,y-16,24,16);       // body
  ctx.fillRect(x+8,y-22,10,10);       // head
  ctx.fillStyle='#ffcc66';
  ctx.fillRect(x+6,y-24,14,14);       // mane
  ctx.fillStyle='#000';
  ctx.fillRect(x+10,y-20,3,3);        // eye
  ctx.fillStyle='#cc8800';
  ctx.fillRect(x-16,y-8,8,8);ctx.fillRect(x+8,y-8,8,8); // legs
  ctx.fillRect(x-14,y-20,6,6);        // tail
  if(celebrate){ctx.fillStyle='#ffff00';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('★',x,y-30);}
}
function draw(p,ok){
  var t=performance.now()/1000;
  ctx.fillStyle='#0a0500';ctx.fillRect(0,0,W,H);
  // tent stripes
  ctx.fillStyle='#2a1000';for(var i=0;i<8;i++){ctx.fillRect(i*30,0,14,H);}
  // ground
  ctx.fillStyle='#4a2400';ctx.fillRect(0,H-30,W,30);
  var ringX=150,ringY=H-80,ringR=34;
  drawFlames(ringX,ringY,ringR,t);
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ringX,ringY,ringR-8,0,7);ctx.fill();
  // lion position
  var lx,ly=H-46;
  if(p===0){lx=40;}
  else{
    lx=40+(200-40)*p;
    ly=(H-46)-Math.sin(p*Math.PI)*(ok?90:30);
  }
  if(!ok&&p>0.5){ctx.fillStyle='#ff4400';ctx.fillRect(lx-14,ly-24,28,24);} // burn flash
  drawLion(lx,ly,ok&&p>0.8);
  // ring number
  ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';
  ctx.fillText('火圈 '+Math.min(ringNo,8),W/2,16);
}
function gameOver(win){
  var best=0;try{best=parseInt(localStorage.getItem('circusBest')||'0');}catch(e){}
  var nb='';if(score>best){try{localStorage.setItem('circusBest',score);}catch(e){}nb=' 🏅新紀錄！';}
  document.getElementById('overTitle').textContent=win?'🎉 表演成功！':'🔥 表演失敗…';
  document.getElementById('finalScore').innerHTML='總分：<b style="color:#ffff00">'+score+'</b> / 800'+nb+'<br>歷史最佳：'+Math.max(best,score);
  document.getElementById('over').style.display='flex';
  beep(win?1500:150,0.5);
}
function resetGame(){
  score=0;lives=3;ringNo=1;running=true;
  document.getElementById('over').style.display='none';
  newRing();draw(0,true);flash('');
}
document.getElementById('startBtn').addEventListener('click',function(){document.getElementById('intro').style.display='none';resetGame();});
document.getElementById('againBtn').addEventListener('click',resetGame);
draw(0,true);
})();
</script>
</body>
</html>
