<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>食物鏈大挑戰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft JhengHei","PingFang HK",sans-serif;background:#fefce8;color:#1f2937;line-height:1.6;touch-action:manipulation}
header{background:linear-gradient(135deg,#65a30d,#a3e635);color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto;padding:10px 14px}
.topbar a{color:#65a30d;font-weight:700;text-decoration:none;font-size:15px}
.badge{background:#fff;border:2px solid #65a30d;color:#4d7c0f;border-radius:20px;padding:4px 14px;font-weight:800;font-size:15px}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:14px}
.stage{font-size:16px;font-weight:800;text-align:center;margin-bottom:4px}
.stage small{display:block;font-weight:400;color:#64748b;font-size:13px}
.chain{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.slot{min-height:56px;border:2px dashed #a3a380;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#a3a380;background:#fefce8}
.slot.filled{border-style:solid;border-color:#65a30d;background:#f7fee7;color:#1f2937;font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.org{min-height:56px;padding:10px 16px;border-radius:14px;background:#fff;border:2px solid #65a30d;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
.org .em{font-size:24px;margin-right:6px}
.org.used{opacity:.3;pointer-events:none}
.org.wrong{animation:shake .35s;border-color:#dc2626}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{text-align:center;font-weight:800;font-size:17px;min-height:28px;margin-top:8px}
.msg.ok{color:#65a30d}.msg.bad{color:#dc2626}
.qbox{background:#f7fee7;border:2px solid #65a30d;border-radius:12px;padding:14px;margin-top:10px}
.qbox h3{margin:0 0 10px;font-size:16px}
.qbtn{display:block;width:100%;min-height:52px;margin:8px 0;border-radius:12px;border:2px solid #d6d3a8;background:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;color:#1f2937}
.qbtn.ok{background:#dcfce7;border-color:#65a30d}
.qbtn.no{background:#fee2e2;border-color:#dc2626}
.concept{background:#f7fee7;border:1px solid #d9f99d;border-radius:10px;padding:12px;font-size:14px}
.concept b{color:#4d7c0f}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay .box{background:#fff;border-radius:16px;padding:24px;max-width:440px;width:100%;max-height:85vh;overflow:auto}
.overlay h2{margin:0 0 10px;font-size:20px;color:#4d7c0f}
.overlay p,.overlay li{font-size:15px}
.overlay .box button{background:#65a30d;color:#fff;min-height:52px;font-size:18px;font-weight:800;width:100%;margin-top:14px;border:none;border-radius:12px;font-family:inherit;cursor:pointer}
.hidden{display:none}
.progress{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.progress span{width:12px;height:12px;border-radius:50%;background:#e5e7eb}
.progress span.on{background:#65a30d}
</style>
</head>
<body>
<header><h1>🔗 食物鏈大挑戰</h1><p>排好食物鏈，再答能量問題！</p></header>
<div class="topbar"><a href="games.html">← 返回遊戲</a><div class="badge">分數 <span id="score">0</span></div></div>
<main>
<div class="card">
<div class="progress" id="prog"><span class="on"></span><span></span><span></span></div>
<div class="stage" id="stageTitle"></div>
<div class="chain" id="chain"></div>
<div class="stage"><small>👇 撳下面嘅生物，按「邊個食邊個」嘅次序排（由生產者開始）</small></div>
<div class="pool" id="pool"></div>
<div class="msg" id="msg"></div>
<div class="qbox hidden" id="qbox">
<h3 id="qtext"></h3>
<div id="qopts"></div>
</div>
</div>
<div class="card concept">
<b>💡 科學原理：能量傳遞</b><br>
食物鏈入面，能量由生產者（植物）逐級傳上去。但每一級大約只有 <b>10%</b> 能量傳到下一級，其餘 90% 用咗喺呼吸、活動同排泄。所以食物鏈通常唔會超過 4–5 級——頂層掠食者分到嘅能量最少！
</div>
</main>
<div class="overlay" id="intro">
<div class="box">
<h2>🔗 點玩？</h2>
<ul>
<li>每關有幾種生物（打亂晒次序）。</li>
<li>撳生物卡，按<b>生產者 → 草食動物 → 肉食動物 → 頂層</b>嘅次序排好食物鏈。</li>
<li>排啱之後要答一條<b>能量傳遞</b>問題（記住 10% 定律！）。</li>
<li>共 3 關，全部完成計總分。</li>
</ul>
<button onclick="document.getElementById('intro').classList.add('hidden')">開始！</button>
</div>
</div>
<script>
const rounds=[
 {name:'🌾 草原食物鏈',orgs:[['🌱','草','p'],['🐰','兔','h'],['🦊','狐','c'],['🦅','鷹','t']],
  q:'如果草有 10000 kJ 能量，鷹大約得到幾多？',opts:['10000 kJ','1000 kJ','100 kJ','10 kJ'],ans:3,
  why:'草→兔剩 10%（1000）→狐剩 10%（100）→鷹剩 10%（10 kJ）。每級只傳約一成！'},
 {name:'🌊 海洋食物鏈',orgs:[['🌿','浮游植物','p'],['🦐','磷蝦','h'],['🐟','小魚','c'],['🦈','鯊魚','t']],
  q:'浮游植物有 5000 kJ，鯊魚大約得到幾多？',opts:['500 kJ','50 kJ','5 kJ','0.5 kJ'],ans:2,
  why:'5000→500→50→5 kJ。每上一級 ×0.1，三級之後剩 5 kJ。'},
 {name:'🌲 森林食物鏈',orgs:[['🍃','樹葉','p'],['🐛','毛蟲','h'],['🐦','麻雀','c'],['🐍','蛇','c2'],['🦅','鷹','t']],
  q:'點解食物鏈好少超過 5 級？',opts:['動物唔鍾意食嘢','能量逐級遞減，頂層唔夠食','生產者唔夠多','純粹巧合'],ans:1,
  why:'每級只傳約 10% 能量，去到第 5 級已經所剩無幾，養唔起再高一級嘅掠食者。'}
];
let r=0,score=0,placed=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function loadRound(){
  locked=false;placed=0;
  const R=rounds[r];
  document.getElementById('stageTitle').innerHTML=R.name+'<small>第 '+(r+1)+' / 3 關</small>';
  document.querySelectorAll('#prog span').forEach((s,i)=>s.classList.toggle('on',i<=r));
  const chain=document.getElementById('chain');chain.innerHTML='';
  R.orgs.forEach(()=>{const d=document.createElement('div');d.className='slot';d.textContent='？';chain.appendChild(d);});
  const pool=document.getElementById('pool');pool.innerHTML='';
  shuffle([...R.orgs]).forEach(o=>{
    const b=document.createElement('button');b.className='org';
    b.innerHTML='<span class="em">'+o[0]+'</span>'+o[1];b.dataset.n=o[1];
    b.onclick=()=>{
      if(locked)return;
      const expect=R.orgs[placed][1];
      if(b.dataset.n===expect){
        b.classList.add('used');
        const s=chain.children[placed];s.classList.add('filled');s.textContent=o[0]+' '+o[1];
        placed++;
        if(placed===R.orgs.length){locked=true;flash('✅ 食物鏈正確！+40 分','ok');score+=40;upd();setTimeout(showQ,900);}
        else flash('','');
      }else{
        b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);
        flash('❌ 唔係呢個，再諗下邊個食邊個','bad');
      }
    };
    pool.appendChild(b);
  });
  document.getElementById('qbox').classList.add('hidden');
  flash('','');
}
function showQ(){
  const R=rounds[r];
  document.getElementById('qtext').textContent='❓ '+R.q;
  const qo=document.getElementById('qopts');qo.innerHTML='';
  R.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='qbtn';b.textContent=o;
    b.onclick=()=>{
      if(b.classList.contains('ok')||b.classList.contains('no'))return;
      if(i===R.ans){b.classList.add('ok');score+=60;flash('🎉 答啱！+60 分<br><small style="font-weight:400">'+R.why+'</small>','ok');}
      else{b.classList.add('no');qo.children[R.ans].classList.add('ok');flash('❌ 答案係「'+R.opts[R.ans]+'」<br><small style="font-weight:400">'+R.why+'</small>','bad');}
      upd();setTimeout(nextRound,2600);
    };
    qo.appendChild(b);
  });
  document.getElementById('qbox').classList.remove('hidden');
}
function nextRound(){
  r++;
  if(r>=rounds.length){
    document.getElementById('stageTitle').innerHTML='🏆 全部完成！總分 '+score+' 分';
    document.getElementById('chain').innerHTML='';document.getElementById('pool').innerHTML='';
    document.getElementById('qbox').classList.add('hidden');flash('','');
    showRestart();return;
  }
  loadRound();
}
function showRestart(){
  if(document.getElementById('btnRestart'))return;
  const b=document.createElement('button');
  b.id='btnRestart';b.textContent='🔁 再玩一次';
  b.style.cssText='width:100%;min-height:56px;font-size:18px;font-weight:800;border:none;border-radius:12px;background:#65a30d;color:#fff;margin-top:10px;cursor:pointer;font-family:inherit';
  b.onclick=()=>{r=0;score=0;upd();b.remove();loadRound();};
  document.getElementById('qbox').after(b);
}
function flash(t,cls){const m=document.getElementById('msg');m.innerHTML=t;m.className='msg '+cls;}
function upd(){document.getElementById('score').textContent=score;}
loadRound();
</script>
</body>
</html>
