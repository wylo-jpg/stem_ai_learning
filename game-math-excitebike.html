<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>數學電單車</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Courier New",monospace;background:#0a0a0a;color:#fff;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.crt{position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);opacity:.5}
header{background:#1a1a2e;padding:12px;text-align:center;border-bottom:4px solid #e94560}
header h1{margin:0;font-size:20px;letter-spacing:2px;color:#e94560;text-shadow:2px 2px 0 #fff}
.back{display:block;text-align:center;background:#222;color:#e94560;text-decoration:none;padding:12px;font-size:15px;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.hud{display:flex;justify-content:space-between;background:#1a1a2e;border:3px solid #e94560;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.hud span{color:#ffd23f}
#cvwrap{border:4px solid #e94560;background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#gateQ{display:none;background:#1a1a2e;border:3px solid #ffd23f;padding:14px;margin-top:10px;text-align:center}
#gateQ .qq{font-size:26px;font-weight:700;margin-bottom:10px;letter-spacing:2px}
#gateQ .abtns{display:flex;gap:8px;justify-content:center}
#gateQ .abtns button{flex:1;min-height:60px;max-width:120px;font-size:22px;font-weight:700;font-family:inherit;background:#0f3460;color:#fff;border:3px solid #ffd23f;cursor:pointer}
#gateQ .abtns button:active{transform:scale(.94);background:#e94560}
.msg{min-height:30px;text-align:center;font-size:16px;font-weight:700;margin-top:8px;color:#4ade80}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow-y:auto}
.card{background:#1a1a2e;border:4px solid #e94560;padding:24px 20px;max-width:480px;width:100%;text-align:center}
.card h2{margin:0 0 12px;font-size:22px;color:#e94560;text-shadow:2px 2px 0 #fff}
.card p{font-size:15px;line-height:1.8;text-align:left}
.bigbtn{width:100%;min-height:60px;font-size:20px;font-weight:700;font-family:inherit;background:#e94560;color:#fff;border:3px solid #fff;margin-top:14px;cursor:pointer}
.bigbtn:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="crt"></div>
<header><h1>🏍️ 數學電單車</h1></header>
<a class="back" href="games.html">← 返回遊戲列表</a>
<div class="wrap">
<div class="hud"><div>🏁 <span id="dist">0</span>/1500m</div><div>💨 <span id="spd">0</span>km/h</div><div>🤖 對手 <span id="foe">0</span>m</div></div>
<div id="cvwrap"><canvas id="cv" width="520" height="360"></canvas></div>
<div id="gateQ"><div class="qq" id="qText">7 + 8 = ?</div><div class="abtns" id="ansBtns"></div></div>
<div class="msg" id="msg">同 AI 車手鬥快！答啱算式閘加速！</div>
</div>
<div class="overlay" id="intro"><div class="card">
<h2>🏍️ 數學電單車</h2>
<p>🕹️ 玩法：架車會自己向前衝，跑道上有算式閘——埋閘前要答啱條數！<br>
✅ 答啱：turbo 加速 🚀<br>
❌ 答錯：減速 🐢<br>
🏆 同 AI 車手鬥，1500m 先到終點贏！<br>
💡 數學概念：四則混合運算，反應要快！</p>
<button class="bigbtn" onclick="startGame()">▶ 開始比賽</button>
</div></div>
<div class="overlay" id="over" style="display:none"><div class="card">
<h2 id="overTitle">🏁 比賽完！</h2>
<p id="overText" style="text-align:center;font-size:18px"></p>
<button class="bigbtn" onclick="startGame()">🔁 再賽一次</button>
</div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=520,H=360,FINISH=1500;
var px,foeX,speed,boostT,running,gates,nextGate,curQ,trackOff;
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function mkQ(){
  var op=rnd(0,3),a,b,ans,txt;
  if(op===0){a=rnd(3,29);b=rnd(3,29);ans=a+b;txt=a+' + '+b;}
  else if(op===1){a=rnd(6,39);b=rnd(3,a-2);ans=a-b;txt=a+' − '+b;}
  else if(op===2){a=rnd(3,9);b=rnd(3,9);ans=a*b;txt=a+' × '+b;}
  else{b=rnd(3,9);ans=rnd(3,9);a=b*ans;txt=a+' ÷ '+b;}
  return {txt:txt+' = ?',ans:ans};
}
function reset(){
  px=0;foeX=0;speed=60;boostT=0;trackOff=0;gates=[];nextGate=250;curQ=null;
  document.getElementById('dist').textContent='0';
  document.getElementById('spd').textContent='60';
  document.getElementById('foe').textContent='0';
  document.getElementById('gateQ').style.display='none';
  document.getElementById('msg').textContent='同 AI 車手鬥快！答啱算式閘加速！';
}
function draw(){
  ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(var i=0;i<5;i++){var cx2=((i*200-trackOff*0.2)%(W+120))-60;ctx.fillRect(cx2,30+i*8,80,14);}
  // ground
  ctx.fillStyle='#3a7d2c';ctx.fillRect(0,H-110,W,110);
  // road
  ctx.fillStyle='#555';ctx.fillRect(0,H-90,W,70);
  ctx.fillStyle='#ffd23f';
  for(var d=0;d<W;d+=40){var dx=d-((trackOff)%40);ctx.fillRect(dx,H-58,22,5);}
  // gates ahead
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var g of gates){
    var gx=g.x-px*0.35+150;
    if(gx<-40||gx>W+40)continue;
    ctx.fillStyle='#e94560';ctx.fillRect(gx-4,H-160,8,90);
    ctx.fillStyle='#ffd23f';ctx.fillRect(gx-34,H-170,68,26);
    ctx.fillStyle='#000';ctx.font='bold 16px "Courier New",monospace';
    ctx.fillText('🧮',gx,H-156);
  }
  // foe bike
  drawBike(foeX-px*0.35+60,H-70,'#3b82f6');
  // player bike
  drawBike(150,H-70,'#e94560');
  // finish
  var fx=FINISH-px*0.35+150;
  if(fx<W+40){ctx.fillStyle='#fff';for(var f=0;f<6;f++)for(var ff=0;ff<4;ff++){if((f+ff)%2===0)ctx.fillRect(fx+f*8,H-160+ff*14,8,14);}
    ctx.fillStyle='#000';ctx.font='bold 14px "Courier New",monospace';ctx.fillText('FINISH',fx+24,H-175);}
  // boost flame
  if(boostT>0){ctx.fillStyle='#f59e0b';ctx.fillRect(120,H-78,24,10);
    ctx.fillStyle='#e94560';ctx.fillRect(112,H-76,10,6);}
}
function drawBike(x,y,color){
  ctx.fillStyle='#222';ctx.fillRect(x-20,y,12,12);ctx.fillRect(x+10,y,12,12);
  ctx.fillStyle=color;ctx.fillRect(x-14,y-18,30,10);
  ctx.fillStyle='#222';ctx.fillRect(x-2,y-30,10,12);
  ctx.fillStyle='#ffd23f';ctx.fillRect(x-1,y-28,5,5);
}
function askGate(){
  curQ=mkQ();
  document.getElementById('qText').textContent=curQ.txt;
  var box=document.getElementById('ansBtns');box.innerHTML='';
  var opts=new Set([curQ.ans]);
  while(opts.size<3){var d=curQ.ans+rnd(-9,9);if(d!==curQ.ans&&d>0)opts.add(d);}
  Array.from(opts).sort(()=>Math.random()-0.5).forEach(function(v){
    var b=document.createElement('button');b.textContent=v;
    b.onclick=function(){answerGate(v);};box.appendChild(b);
  });
  document.getElementById('gateQ').style.display='block';
}
function answerGate(v){
  document.getElementById('gateQ').style.display='none';
  if(v===curQ.ans){
    boostT=3;speed=Math.min(150,speed+40);
    document.getElementById('msg').textContent='🚀 答啱！Turbo 加速！';
  }else{
    speed=Math.max(35,speed-25);
    document.getElementById('msg').textContent='🐢 答錯（答案 '+curQ.ans+'），減速…';
  }
  curQ=null;
}
function endRace(win){
  running=false;
  document.getElementById('overTitle').textContent=win?'🏆 你贏咗！':'🤖 AI 贏咗…';
  var best=0;try{best=parseInt(localStorage.getItem('bikeBest')||'0');}catch(e){}
  var sc=Math.round(px);
  var nb='';
  if(win&&sc>best){try{localStorage.setItem('bikeBest',sc);}catch(e){}nb=' 🏅新紀錄！';}
  document.getElementById('overText').innerHTML=(win?'你跑贏 AI 車手！':'下次答快啲答啱啲！')+nb+'<br>距離：'+sc+'m';
  document.getElementById('over').style.display='flex';
}
function loop(){
  if(running){
    if(boostT>0){boostT-=0.03;}else{speed+=(60-speed)*0.02;}
    px+=speed*0.03;foeX+=72*0.03;trackOff+=speed*0.03;
    document.getElementById('dist').textContent=Math.min(FINISH,Math.round(px));
    document.getElementById('spd').textContent=Math.round(speed);
    document.getElementById('foe').textContent=Math.round(foeX);
    if(px>=nextGate-120&&!curQ){askGate();}
    if(px>=nextGate){nextGate+=rnd(220,340);}
    gates=gates.filter(g=>g.x>px-200);
    if(gates.length===0||gates[gates.length-1].x!==nextGate)gates.push({x:nextGate});
    if(px>=FINISH){endRace(true);return;}
    if(foeX>=FINISH){endRace(false);return;}
    draw();
  }
  requestAnimationFrame(loop);
}
window.startGame=function(){
  document.getElementById('intro').style.display='none';
  document.getElementById('over').style.display='none';
  reset();running=true;
};
reset();draw();loop();
})();
</script>
</body>
</html>
