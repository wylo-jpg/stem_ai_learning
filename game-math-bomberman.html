<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>數學炸彈人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans HK",sans-serif;background:radial-gradient(1200px 800px at 50% -10%,#3b1d0e 0%,#1c0f08 45%,#0b0603 100%);color:#fff;min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
/* 火星 */
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
.ember{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,#fcd34d,#f97316 60%,transparent 70%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(4vw);opacity:0}}
.wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:12px 14px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:15px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:999px;min-height:44px}
.best{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:999px;min-height:44px}
.hud{display:flex;gap:10px;margin-bottom:10px}
.hud .pill{flex:1;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:9px 6px;font-size:14px;font-weight:800}
.hud .pill small{display:block;font-size:11px;font-weight:500;opacity:.7}
/* 棋盤 */
.board{position:relative;display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:8px;box-shadow:0 18px 44px rgba(0,0,0,.5);touch-action:none}
.cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;background:rgba(255,255,255,.05)}
.cell.wall{background:linear-gradient(145deg,#4b5563,#1f2937);box-shadow:inset 0 2px 4px rgba(255,255,255,.15)}
.cell.block{background:linear-gradient(145deg,#b45309,#78350f);box-shadow:inset 0 2px 5px rgba(255,255,255,.25),0 3px 8px rgba(0,0,0,.4);cursor:default}
.cell.block .q{font-size:15px;font-weight:900;color:#fef3c7;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cell.blast{background:radial-gradient(circle,#fde68a,#f97316);animation:blast .45s ease;z-index:2}
@keyframes blast{0%{transform:scale(.4);opacity:.4}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.9}}
.bombicon{animation:bombpulse .5s ease-in-out infinite}
@keyframes bombpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.exitcell{background:radial-gradient(circle,rgba(52,211,153,.5),rgba(52,211,153,.12));box-shadow:0 0 14px rgba(52,211,153,.6)}
/* 控制 */
.controls{display:flex;gap:12px;margin-top:14px;align-items:center;justify-content:space-between}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px}
.dpad button{border:none;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35);font-family:inherit}
.dpad button:active{transform:scale(.92);background:rgba(255,255,255,.28)}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
.bombbtn{flex:1;min-height:96px;margin-left:8px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(135deg,#f97316,#ef4444);border:none;border-radius:20px;cursor:pointer;box-shadow:0 10px 28px rgba(239,68,68,.45);font-family:inherit}
.bombbtn:active{transform:scale(.95)}
.bombbtn:disabled{opacity:.4}
.hint{text-align:center;font-size:13px;opacity:.65;margin-top:10px;line-height:1.7}
/* 選單 / 結束 */
.screen{display:none}
.screen.show{display:block;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:22px 10px 14px}
.hero .emoji{font-size:64px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.hero h1{font-size:32px;font-weight:900;margin:10px 0 6px}
.hero p{font-size:15px;opacity:.85;line-height:1.8}
.diffcards{display:grid;gap:12px;margin:16px 0}
.diff{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;min-height:76px;transition:transform .12s;box-shadow:0 10px 26px rgba(0,0,0,.35);text-align:left;width:100%;color:#fff;font-family:inherit}
.diff:active{transform:scale(.97)}
.diff .dicon{font-size:38px}
.diff b{font-size:19px;display:block}
.diff span{font-size:13px;opacity:.75}
.concept{background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.4);border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.9}
/* 問答彈窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.show{display:flex}
.mcard{width:100%;max-width:400px;background:linear-gradient(160deg,#2b1a10,#17100b);border:1px solid rgba(249,115,22,.5);border-radius:24px;padding:26px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:mup .3s ease}
@keyframes mup{from{transform:translateY(26px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.mcard .mq{font-size:30px;font-weight:900;margin:10px 0 18px;color:#fde68a}
.mcard .mopts{display:grid;gap:10px}
.mcard .mopt{min-height:60px;font-size:20px;font-weight:800;border-radius:16px;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.25);font-family:inherit}
.mcard .mopt:active{transform:scale(.96)}
.mcard .mopt.right{background:linear-gradient(135deg,#34d399,#059669)}
.mcard .mopt.wrong{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.endcard{text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:34px 20px;box-shadow:0 18px 44px rgba(0,0,0,.5);margin-top:16px}
.endcard .emoji{font-size:72px}
.endcard h2{font-size:30px;margin:12px 0 8px}
.endcard .score{font-size:52px;font-weight:900;color:#fbbf24}
.endcard p{font-size:15px;opacity:.85;margin:8px 0 20px;line-height:1.7}
.bigbtn{display:block;width:100%;min-height:60px;margin-top:12px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,#f97316,#ef4444);border:none;border-radius:18px;cursor:pointer;box-shadow:0 10px 24px rgba(239,68,68,.4);font-family:inherit}
.bigbtn.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);box-shadow:none}
.feedback{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-size:56px;font-weight:900;opacity:0;pointer-events:none;z-index:70;text-shadow:0 6px 24px rgba(0,0,0,.5)}
.feedback.pop{animation:pop .7s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
</style>
</head>
<body>
<div id="embers"></div>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="games.html">← 返回遊戲列表</a>
    <div class="best">🏆 <span id="bestNum">0</span></div>
  </div>

  <div id="menu" class="screen show">
    <div class="hero">
      <div class="emoji">💣</div>
      <h1>數學炸彈人</h1>
      <p>在迷宮放炸彈，炸開寫住「？」的算式牆——答啱先炸得開！<br>避開怪獸，走到綠色出口過關，共 3 關。</p>
    </div>
    <div class="diffcards">
      <button class="diff" data-d="easy"><div class="dicon">🌱</div><div><b>初階 · 中一至中二</b><span>四則運算</span></div></button>
      <button class="diff" data-d="mid"><div class="dicon">🌿</div><div><b>中階 · 中三至中四</b><span>代數式化簡</span></div></button>
      <button class="diff" data-d="hard"><div class="dicon">🌳</div><div><b>高階 · 中五至中六</b><span>因式分解</span></div></button>
    </div>
    <div class="concept">💡 <b>數學概念</b><br>初階：整數四則運算。<br>中階：合併同類項、去括號，如 2(x+3)=2x+6。<br>高階：因式分解，如 x²+5x+6=(x+2)(x+3)、x²−9=(x+3)(x−3)。</div>
  </div>

  <div id="game" class="screen">
    <div class="hud">
      <div class="pill">❤️ <span id="lives">3</span><small>生命</small></div>
      <div class="pill">⭐ <span id="score">0</span><small>分數</small></div>
      <div class="pill">🚪 <span id="lvl">1</span>/3<small>關卡</small></div>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <div class="dpad">
        <button class="up" data-m="0,-1">▲</button>
        <button class="left" data-m="-1,0">◀</button>
        <button class="right" data-m="1,0">▶</button>
        <button class="down" data-m="0,1">▼</button>
      </div>
      <button class="bombbtn" id="bombBtn">💣<br>放炸彈</button>
    </div>
    <div class="hint">方向掣或滑動棋盤移動 · 炸彈 1.5 秒後十字爆炸<br>爆炸範圍內有你自己都會扣命，小心！</div>
  </div>

  <div id="end" class="screen">
    <div class="endcard">
      <div class="emoji" id="endEmoji">🏆</div>
      <h2 id="endTitle">全部過關！</h2>
      <div class="score" id="endScore">0</div>
      <p id="endMsg"></p>
      <button class="bigbtn" id="againBtn">🔁 再玩一次</button>
      <button class="bigbtn ghost" id="menuBtn">🏠 返回選單</button>
    </div>
  </div>
</div>

<div class="modal" id="qmodal"><div class="mcard">
  <div style="font-size:14px;opacity:.7">💥 炸開算式牆</div>
  <div class="mq" id="mq">…</div>
  <div class="mopts" id="mopts"></div>
</div></div>
<div class="feedback" id="feedback"></div>

<script>
"use strict";
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function makeOpts(ans,cands){var seen={},out=[String(ans)];seen[String(ans)]=1;var cs=shuffle(cands);for(var i=0;i<cs.length;i++){var s=String(cs[i]);if(!seen[s]){seen[s]=1;out.push(s);if(out.length>=4)break;}}var s2=shuffle(out);return {opts:s2,ans:s2.indexOf(String(ans))};}
function Q(q,ans,cands){var o=makeOpts(ans,cands);return {q:q,opts:o.opts,ans:o.ans};}
function genEasy(){
  var t=ri(0,3),a=ri(-15,15),b=ri(-15,15);
  if(t===0)return Q(a+' + ('+b+') = ?',a+b,[a+b+1,a+b-1,a+b+2,a-b]);
  if(t===1)return Q(a+' − ('+b+') = ?',a-b,[a-b+1,a-b-1,a-b+2,a+b]);
  if(t===2){if(b===0)b=3;return Q('('+a+') × ('+b+') = ?',a*b,[a*b+1,a*b-1,-(a*b),a*b+2]);}
  if(b===0)b=4;var k=ri(-8,8);a=b*k;return Q('('+a+') ÷ ('+b+') = ?',k,[k+1,k-1,-k,k+2]);
}
function genMid(){
  var t=ri(0,5);
  if(t===0){var a=ri(2,9),b=ri(2,9);return Q(a+'x + '+b+'x = ?',(a+b)+'x',[(a+b+1)+'x',(a+b-1)+'x',(a*b)+'x',(a+b)+'y']);}
  if(t===1){var c=ri(3,9),d=ri(1,c-1);return Q(c+'a − '+d+'a = ?',(c-d)+'a',[(c-d+1)+'a',(c+d)+'a',(c-d)+'b',(c-d-1)+'a']);}
  if(t===2){var k=ri(2,5),m=ri(1,6);return Q(k+'(x + '+m+') = ?',k+'x + '+(k*m),[(k+1)+'x + '+m,k+'x + '+m,(k*m)+'x + '+k,k+'y + '+(k*m)]);}
  if(t===3){var p=ri(2,8);return Q('5y − '+p+'y + 3y = ?',(8-p)+'y',[(8-p+1)+'y',(8+p)+'y',(5-p)+'y',(8-p)+'x']);}
  if(t===4){var u=ri(1,9);return Q('−'+u+' + '+(u+ri(1,8))+' = ?',0,[1,-1,2,-2]);}
  var f=ri(2,6);return Q('3x − '+f+'(x − 2) = ?',''+(3-f)+'x + '+(f*2),[(3+f)+'x + '+(f*2),'3x − '+(f*2),(3-f)+'x − '+(f*2),'3x + '+(f*2)]);
}
var FACTS=[
  {q:'x² + 5x + 6',a:'(x + 2)(x + 3)',w:['(x + 1)(x + 6)','(x + 5)(x + 1)','(x − 2)(x − 3)']},
  {q:'x² − 9',a:'(x + 3)(x − 3)',w:['(x + 9)(x − 1)','(x − 3)²','(x + 3)²']},
  {q:'x² + 7x + 12',a:'(x + 3)(x + 4)',w:['(x + 2)(x + 6)','(x + 12)(x + 1)','(x − 3)(x − 4)']},
  {q:'x² − 4x + 4',a:'(x − 2)²',w:['(x + 2)²','(x − 4)(x + 1)','(x − 2)(x + 2)']},
  {q:'x² + 2x + 1',a:'(x + 1)²',w:['(x − 1)²','(x + 2)(x − 1)','x(x + 2)']},
  {q:'x² − x − 6',a:'(x − 3)(x + 2)',w:['(x + 3)(x − 2)','(x − 6)(x + 1)','(x − 1)(x + 6)']},
  {q:'2x² + 6x',a:'2x(x + 3)',w:['2x(x − 3)','x(2x + 6)','2(x² + 3)']},
  {q:'x² + 8x + 15',a:'(x + 3)(x + 5)',w:['(x + 1)(x + 15)','(x − 3)(x − 5)','(x + 8)(x + 7)']},
  {q:'x² − 16',a:'(x + 4)(x − 4)',w:['(x − 4)²','(x + 8)(x − 2)','(x + 16)(x − 1)']},
  {q:'3x² − 12',a:'3(x + 2)(x − 2)',w:['3(x − 2)²','(3x + 6)(x − 2)','3x(x − 4)']}
];
function genHard(){var f=FACTS[ri(0,FACTS.length-1)];return Q(f.q+' = ?（因式分解）',f.a,f.w);}
var AC=null;
function tone(f,d,type,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),ga=AC.createGain();o.type=type||'sine';o.frequency.value=f;ga.gain.setValueAtTime(g||.1,AC.currentTime);ga.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(ga);ga.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function sndGood(){tone(660,.12,'triangle');setTimeout(function(){tone(880,.18,'triangle');},100);}
function sndBad(){tone(180,.3,'sawtooth',.07);}
function sndBoom(){tone(90,.5,'sawtooth',.14);}
function sndWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.2,'triangle');},i*140);});}
var DIFFS={easy:{gen:genEasy,key:'bom_best_easy',label:'初階'},mid:{gen:genMid,key:'bom_best_mid',label:'中階'},hard:{gen:genHard,key:'bom_best_hard',label:'高階'}};
var N=9,diff='easy',level=1,lives=3,score=0;
var grid=[],player={x:1,y:1},enemies=[],bombs=[],paused=false,loopId=null,enemyId=null,qQueue=[],qBusy=false,blastFx=null;
var cellEls=[];
var MAXLV=3;
(function(){var e=document.getElementById('embers');for(var i=0;i<24;i++){var d=document.createElement('div');d.className='ember';var sz=(3+Math.random()*6).toFixed(1);d.style.width=d.style.height=sz+'px';d.style.left=(Math.random()*100)+'vw';d.style.animationDuration=(5+Math.random()*7)+'s';d.style.animationDelay=(-Math.random()*9)+'s';e.appendChild(d);}})();
function show(id){var ss=['menu','game','end'];for(var i=0;i<ss.length;i++)document.getElementById(ss[i]).classList.toggle('show',ss[i]===id);}
function getBest(){return parseInt(localStorage.getItem(DIFFS[diff].key)||'0',10);}
function setBest(v){if(v>getBest())localStorage.setItem(DIFFS[diff].key,String(v));}
document.getElementById('bestNum').textContent=getBest();
var db=document.querySelectorAll('.diff');
for(var bi=0;bi<db.length;bi++)(function(b){b.addEventListener('click',function(){diff=b.dataset.d;startGame();});})(db[bi]);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('menuBtn').addEventListener('click',function(){stopLoops();show('menu');document.getElementById('bestNum').textContent=getBest();});
function feedback(t){var f=document.getElementById('feedback');f.textContent=t;f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');}
function startGame(){level=1;lives=3;score=0;document.getElementById('bestNum').textContent=getBest();show('game');buildLevel();}
function buildLevel(){
  grid=[];enemies=[];bombs=[];qQueue=[];qBusy=false;paused=false;
  player={x:1,y:1};
  var blockProb=0.32+level*0.03;
  for(var y=0;y<N;y++){grid.push([]);for(var x=0;x<N;x++){
    var v=0;
    if(x===0||y===0||x===N-1||y===N-1)v=1;
    else if(x%2===0&&y%2===0)v=1;
    else if(!((x<=2&&y<=2)||(x===N-2&&y===N-2))&&Math.random()<blockProb)v=2;
    grid[y].push(v);
  }}
  var ne=1+level;
  for(var i=0;i<ne;i++){var p=freeCellFar();if(p)enemies.push({x:p.x,y:p.y});}
  buildBoard();render();updateHud();startLoops();
}
function buildBoard(){
  var bd=document.getElementById('board');bd.innerHTML='';cellEls=[];
  for(var y=0;y<N;y++){cellEls.push([]);for(var x=0;x<N;x++){
    var c=document.createElement('div');c.className='cell';
    bd.appendChild(c);cellEls[y].push({el:c,html:null,cls:null});
  }}
}
function freeCellFar(){
  for(var k=0;k<60;k++){var x=ri(3,N-2),y=ri(3,N-2);
    if(grid[y][x]===0&&Math.abs(x-player.x)+Math.abs(y-player.y)>5)return {x:x,y:y};}
  return null;
}
function startLoops(){
  stopLoops();
  loopId=setInterval(tick,120);
  enemyId=setInterval(moveEnemies,850-level*120);
}
function stopLoops(){clearInterval(loopId);clearInterval(enemyId);loopId=enemyId=null;}
function tick(){
  if(paused)return;
  for(var i=bombs.length-1;i>=0;i--){bombs[i].fuse--;if(bombs[i].fuse<=0){explode(bombs[i]);bombs.splice(i,1);} }
}
function render(){
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var s=cellEls[y][x];if(!s)continue;
    var el=s.el,v=grid[y][x];
    var cls='cell';
    if(v===1)cls+=' wall';
    else if(v===2)cls+=' block';
    if(x===N-2&&y===N-2&&v===0)cls+=' exitcell';
    var isB=false;
    for(var i=0;i<bombs.length;i++)if(bombs[i].x===x&&bombs[i].y===y){isB=true;break;}
    var html='';
    if(v===2)html='<span class="q">?</span>';
    if(isB)html='<span class="bombicon">💣</span>';
    else if(player.x===x&&player.y===y)html='<span class="p">🦸</span>';
    else{for(var j=0;j<enemies.length;j++)if(enemies[j].x===x&&enemies[j].y===y){html='<span class="p">👾</span>';break;}}
    if(x===N-2&&y===N-2&&v===0&&!(player.x===x&&player.y===y))html='<span class="p">🚪</span>';
    if(blastFx&&Date.now()<blastFx.until){
      for(var bi2=0;bi2<blastFx.cells.length;bi2++)
        if(blastFx.cells[bi2].x===x&&blastFx.cells[bi2].y===y){cls+=' blast';break;}
    }
    if(s.cls!==cls){s.cls=cls;el.className=cls;}
    if(s.html!==html){s.html=html;el.innerHTML=html;}
  }
}
function updateHud(){document.getElementById('lives').textContent=lives;document.getElementById('score').textContent=score;document.getElementById('lvl').textContent=level;}
function walkable(x,y){return x>=0&&y>=0&&x<N&&y<N&&grid[y][x]===0;}
function move(dx,dy){
  if(paused||qBusy)return;
  var nx=player.x+dx,ny=player.y+dy;
  var blocked=false;
  for(var i=0;i<bombs.length;i++)if(bombs[i].x===nx&&bombs[i].y===ny)blocked=true;
  if(!blocked&&walkable(nx,ny)){player.x=nx;player.y=ny;tone(300,.06,'triangle',.05);render();checkEnemy();checkExit();}
}
function checkEnemy(){
  for(var i=0;i<enemies.length;i++)if(enemies[i].x===player.x&&enemies[i].y===player.y){hitPlayer();break;}
}
function checkExit(){
  if(player.x===N-2&&player.y===N-2){
    score+=300;sndWin();feedback('🚪');
    setTimeout(function(){
      if(level>=MAXLV){finish(true);}else{level++;buildLevel();}
    },800);
  }
}
function hitPlayer(){
  if(paused&&lives<=0)return;
  lives--;sndBad();feedback('💥');updateHud();
  if(lives<=0){finish(false);return;}
  player={x:1,y:1};bombs=[];render();
}
function moveEnemies(){
  if(paused||qBusy)return;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i],dirs=shuffle([[1,0],[-1,0],[0,1],[0,-1]]),moved=false;
    var best=null,bd=Math.abs(e.x-player.x)+Math.abs(e.y-player.y);
    for(var j=0;j<dirs.length;j++){
      var nx=e.x+dirs[j][0],ny=e.y+dirs[j][1];
      if(!walkable(nx,ny))continue;
      var occ=false;
      for(var k=0;k<enemies.length;k++)if(k!==i&&enemies[k].x===nx&&enemies[k].y===ny)occ=true;
      if(occ)continue;
      var d=Math.abs(nx-player.x)+Math.abs(ny-player.y);
      if(Math.random()<0.55&&d<bd){best={x:nx,y:ny};break;}
      if(!moved){moved=true;best={x:nx,y:ny};}
    }
    if(best){e.x=best.x;e.y=best.y;}
  }
  render();checkEnemy();
}
function placeBomb(){
  if(paused||qBusy)return;
  for(var i=0;i<bombs.length;i++)if(bombs[i].x===player.x&&bombs[i].y===player.y)return;
  if(bombs.length>=2)return;
  bombs.push({x:player.x,y:player.y,fuse:12});
  tone(150,.15,'square',.08);render();
}
function explode(b){
  sndBoom();
  var cells=[{x:b.x,y:b.y}];
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var d=0;d<dirs.length;d++)for(var r=1;r<=2;r++){
    var x=b.x+dirs[d][0]*r,y=b.y+dirs[d][1]*r;
    if(x<0||y<0||x>=N||y>=N||grid[y][x]===1)break;
    cells.push({x:x,y:y});
    if(grid[y][x]===2)break;
  }
  blastFx={cells:cells,until:Date.now()+450};
  render();
  var qCells=[];
  for(var j=0;j<cells.length;j++){
    var cx=cells[j].x,cy=cells[j].y;
    if(grid[cy][cx]===2)qCells.push({x:cx,y:cy});
    for(var k=enemies.length-1;k>=0;k--)if(enemies[k].x===cx&&enemies[k].y===cy){enemies.splice(k,1);score+=100;feedback('+100');}
  }
  if(player.x>=0){
    for(var m=0;m<cells.length;m++)if(cells[m].x===player.x&&cells[m].y===player.y){setTimeout(function(){hitPlayer();},450);break;}
  }
  updateHud();
  setTimeout(function(){
    blastFx=null;
    for(var n=0;n<qCells.length;n++)qQueue.push(qCells[n]);
    processQueue();
    render();
  },450);
}
function processQueue(){
  if(qBusy||qQueue.length===0)return;
  qBusy=true;paused=true;
  var cell=qQueue.shift();
  var q=DIFFS[diff].gen();
  document.getElementById('mq').textContent=q.q;
  var box=document.getElementById('mopts');box.innerHTML='';
  for(var i=0;i<q.opts.length;i++)(function(t,idx){
    var b=document.createElement('button');b.className='mopt';b.textContent=t;
    b.addEventListener('click',function(){
      var kids=box.children;
      if(idx===q.ans){
        b.classList.add('right');sndGood();score+=50;updateHud();
        setTimeout(function(){document.getElementById('qmodal').classList.remove('show');grid[cell.y][cell.x]=0;qBusy=false;paused=false;render();processQueue();},650);
      }else{
        b.classList.add('wrong');sndBad();
        if(kids[q.ans])kids[q.ans].classList.add('right');
        setTimeout(function(){document.getElementById('qmodal').classList.remove('show');qBusy=false;paused=false;render();processQueue();},1200);
      }
    });
    box.appendChild(b);
  })(q.opts[i],i);
  document.getElementById('qmodal').classList.add('show');
}
function finish(won){
  stopLoops();paused=true;setBest(score);
  if(won){sndWin();document.getElementById('endEmoji').textContent='🏆';document.getElementById('endTitle').textContent='全部過關！';document.getElementById('endMsg').innerHTML='3 關全破，炸彈大師！<br>🏆 歷史最佳：'+getBest()+' 分';}
  else{document.getElementById('endEmoji').textContent='💥';document.getElementById('endTitle').textContent='遊戲結束';document.getElementById('endMsg').innerHTML='到達第 '+level+' 關，再接再厲！<br>🏆 歷史最佳：'+getBest()+' 分';}
  document.getElementById('endScore').textContent=score;
  show('end');
}
var dp=document.querySelectorAll('.dpad button');
for(var di=0;di<dp.length;di++)(function(b){var m=b.dataset.m.split(',');b.addEventListener('click',function(){move(parseInt(m[0],10),parseInt(m[1],10));});})(dp[di]);
document.getElementById('bombBtn').addEventListener('click',placeBomb);
(function(){
  var bd=document.getElementById('board'),sx=0,sy=0;
  bd.addEventListener('touchstart',function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  bd.addEventListener('touchend',function(e){
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
  },{passive:true});
})();
document.addEventListener('keydown',function(e){
  if(document.getElementById('game').classList.contains('show')){
    if(e.key==='ArrowUp')move(0,-1);else if(e.key==='ArrowDown')move(0,1);
    else if(e.key==='ArrowLeft')move(-1,0);else if(e.key==='ArrowRight')move(1,0);
    else if(e.key===' '){e.preventDefault();placeBomb();}
  }
});
</script>
</body>
