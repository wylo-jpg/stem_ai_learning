<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>霓虹數學小精靈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 800px at 50% -10%,#101a4a 0%,#070b26 45%,#03040f 100%);
  color:#eef2ff;
  font-family:"PingFang HK","Microsoft JhengHei","Noto Sans HK",system-ui,sans-serif;
  min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  font-size:15px;line-height:1.6;
}
header{
  background:linear-gradient(180deg,rgba(20,30,80,.85),rgba(8,12,36,.85));
  border-bottom:1px solid rgba(80,200,255,.35);
  box-shadow:0 2px 18px rgba(40,160,255,.25);
  padding:10px 12px 12px;text-align:center;position:sticky;top:0;z-index:20;
}
header h1{margin:6px 0 2px;font-size:22px;letter-spacing:2px;
  background:linear-gradient(90deg,#7df9ff,#c084fc,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(125,249,255,.35);}
header p{margin:0;font-size:13px;color:#9db4ff;letter-spacing:3px}
.back{display:inline-block;color:#7df9ff;text-decoration:none;font-size:14px;font-weight:bold;
  border:1px solid rgba(125,249,255,.5);border-radius:999px;padding:8px 18px;min-height:44px;line-height:26px;
  background:rgba(20,40,90,.4)}
.back:active{background:rgba(60,120,220,.5)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 24px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.hud .cell{background:rgba(14,22,60,.75);border:1px solid rgba(120,180,255,.3);border-radius:12px;
  padding:6px 4px;text-align:center;font-size:13px;color:#aebfff;box-shadow:0 0 12px rgba(60,120,255,.15)}
.hud .cell b{display:block;font-size:17px;color:#fff;margin-top:2px}
.hud .cell.score b{color:#ffd166;text-shadow:0 0 10px rgba(255,209,102,.7)}
.hud .cell.lives b{color:#ff8fa3}
.hud .cell.target b{color:#7df9ff;font-size:13px}
.stage{position:relative}
canvas{width:100%;height:auto;display:block;border-radius:16px;
  border:1px solid rgba(90,200,255,.5);box-shadow:0 0 28px rgba(50,180,255,.35),inset 0 0 40px rgba(20,60,160,.25);
  touch-action:none;background:#05070f}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);opacity:0;
  background:rgba(8,14,44,.92);border:2px solid #7df9ff;border-radius:16px;padding:14px 26px;
  font-size:20px;font-weight:bold;color:#fff;text-align:center;pointer-events:none;white-space:nowrap;
  box-shadow:0 0 30px rgba(125,249,255,.6);transition:opacity .25s,transform .25s;z-index:5}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font-size:14px;color:#7df9ff;font-weight:normal;margin-top:4px}
.concept{background:rgba(20,16,60,.7);border:1px dashed rgba(192,132,252,.6);border-radius:12px;
  padding:10px 14px;margin:10px 0;font-size:14px;color:#e6d6ff;box-shadow:0 0 14px rgba(150,90,255,.15)}
.concept b{color:#d8b4fe}
.ctrls{display:grid;grid-template-columns:repeat(3,80px);grid-template-rows:repeat(2,72px);
  gap:10px;justify-content:center;margin-top:12px}
.btn{min-width:80px;min-height:72px;font-size:28px;font-weight:bold;border-radius:18px;cursor:pointer;
  color:#dff6ff;background:linear-gradient(180deg,#1c2a63,#101a45);
  border:1px solid rgba(125,249,255,.55);box-shadow:0 0 14px rgba(80,180,255,.35),inset 0 1px 0 rgba(255,255,255,.15);
  touch-action:none;font-family:inherit}
.btn:active{background:linear-gradient(180deg,#2b4a9e,#1a2a6e);transform:scale(.94);
  box-shadow:0 0 22px rgba(125,249,255,.7)}
.tip{text-align:center;color:#8fa3d9;font-size:13px;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(3,5,18,.82);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow-y:auto}
.card{background:linear-gradient(180deg,#131b4a,#0a0f30);border:1px solid rgba(125,249,255,.5);
  border-radius:20px;padding:22px 20px;max-width:460px;width:100%;text-align:center;
  box-shadow:0 0 40px rgba(80,160,255,.35);margin:auto}
.card h2{margin:0 0 8px;font-size:22px;
  background:linear-gradient(90deg,#7df9ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{font-size:14px;line-height:1.8;color:#cdd8ff;margin:8px 0}
.card p b.g{color:#7df9ff}.card p b.r{color:#ff8fa3}
.diffbtn{display:block;width:100%;min-height:76px;margin:10px 0;padding:12px 14px;border-radius:16px;
  cursor:pointer;text-align:left;font-family:inherit;color:#fff;
  background:linear-gradient(180deg,rgba(40,60,140,.55),rgba(18,26,70,.55));
  border:1px solid rgba(140,170,255,.45);box-shadow:0 0 12px rgba(90,140,255,.2)}
.diffbtn:active{transform:scale(.98);box-shadow:0 0 24px rgba(125,249,255,.5)}
.diffbtn .t{font-size:17px;font-weight:bold}
.diffbtn .d{font-size:13px;color:#aebfff;margin-top:4px;line-height:1.6}
.bigbtn{width:100%;min-height:60px;font-size:18px;font-weight:bold;font-family:inherit;cursor:pointer;
  border-radius:16px;margin-top:10px;color:#08122e;letter-spacing:2px;
  background:linear-gradient(180deg,#8ff5ff,#38c8f5);border:none;
  box-shadow:0 0 20px rgba(125,249,255,.55)}
.bigbtn:active{transform:scale(.97)}
.ghostbtn{width:100%;min-height:56px;font-size:16px;font-weight:bold;font-family:inherit;cursor:pointer;
  border-radius:16px;margin-top:10px;color:#dfe8ff;
  background:rgba(40,60,140,.4);border:1px solid rgba(140,170,255,.5)}
.ghostbtn:active{transform:scale(.97)}
.bestline{margin-top:8px;font-size:14px;color:#ffd166}
.hide{display:none!important}
.endstats{font-size:16px;color:#fff;margin:10px 0}
.endstats b{color:#ffd166;font-size:24px}
@media (max-width:400px){
  .hud .cell{font-size:12px}.hud .cell b{font-size:15px}
  .ctrls{grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,66px)}
  .btn{min-width:72px;min-height:66px}
}
</style>
</head>
<body>
<header>
  <a class="back" href="games.html">← 返回遊戲列表</a>
  <h1>✨ 霓虹數學小精靈</h1>
  <p>NEON MATH MAZE</p>
</header>

<div class="wrap">
  <div class="hud">
    <div class="cell lives">❤️ 生命<b id="lives">3</b></div>
    <div class="cell score">⭐ 分數<b id="score">0</b></div>
    <div class="cell">🏆 最高<b id="best">0</b></div>
    <div class="cell target">🎯 目標<b id="target">–</b></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="352"></canvas>
    <div id="banner"></div>
  </div>
  <div class="concept" id="concept">💡 <b>數學概念：</b>選擇難度開始遊戲，每一關都會有新的數學規則！</div>
  <div class="ctrls">
    <span></span><button class="btn" id="btnU" aria-label="上">▲</button><span></span>
    <button class="btn" id="btnL" aria-label="左">◀</button><button class="btn" id="btnD" aria-label="下">▼</button><button class="btn" id="btnR" aria-label="右">▶</button>
  </div>
  <div class="tip">亦可用手指喺迷宮上掃動，或用鍵盤方向鍵／WASD 控制</div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">
    <h2>✨ 霓虹數學小精靈</h2>
    <p><b>玩法：</b>控制發光小精靈穿梭霓虹迷宮，食晒所有<b class="g">符合目標規則</b>的數字豆就過關！<br>
    食啱 <b class="g">+10 分</b>，食錯 <b class="r">−10 分</b>，掂到 👻 鬼扣一條 ❤️（共 3 條命）。過關 <b class="g">+100 分</b>！</p>
    <p style="color:#9db4ff">👇 選擇難度開始</p>
    <button class="diffbtn" data-diff="easy">
      <div class="t">🌱 初階（中一至中二）</div>
      <div class="d">倍數與因數 —— 例如「7 的倍數」「36 的因數」</div>
    </button>
    <button class="diffbtn" data-diff="mid">
      <div class="t">🌿 中階（中三至中四）</div>
      <div class="d">質因數分解、公倍數、最大公因數 —— 例如「質因數有 2 和 3 的數」</div>
    </button>
    <button class="diffbtn" data-diff="hard">
      <div class="t">🌳 高階（中五至中六）</div>
      <div class="d">數論規律 —— 完全平方數、等差數列、2ⁿ 形式的數</div>
    </button>
    <div class="bestline">🏆 最高分：<span id="bestStart">0</span></div>
  </div>
</div>

<div class="overlay hide" id="endOverlay">
  <div class="card">
    <h2>💫 遊戲結束</h2>
    <div class="endstats">今次得分<br><b id="endScore">0</b></div>
    <p id="endBest" class="bestline"></p>
    <button class="bigbtn" id="againBtn">🔁 再玩一次</button>
    <button class="ghostbtn" id="changeDiffBtn">🎚️ 轉換難度</button>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var TW=32,COLS=15,ROWS=11,W=COLS*TW,H=ROWS*TW;
var MAZE=[
"###############",
"#.............#",
"#.###.#####.#.#",
"#.#...#...#...#",
"#.#.###.#.###.#",
"#.....#.#.....#",
"#####.#.#.#####",
"#.....#.#.....#",
"#.#####.#####.#",
"#.............#",
"###############"];

/* ---------- 小工具 ---------- */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[rnd(0,a.length-1)];}
function gcd(a,b){return b?gcd(b,a%b):a;}
function lcm(a,b){return a/gcd(a,b)*b;}
function isWall(c,r){return c<0||r<0||c>=COLS||r>=ROWS||MAZE[r][c]==='#';}
function primeSet(n){
  var s={},d=2;
  while(d*d<=n){if(n%d===0){s[d]=1;while(n%d===0)n/=d;}d++;}
  if(n>1)s[n]=1;
  return s;
}
function isSquare(n){var s=Math.round(Math.sqrt(n));return s*s===n;}
function isPow2(n){return n>1&&(n&(n-1))===0;}
function hexA(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

/* ---------- 音效 ---------- */
var AC=null;
function audio(){try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
}catch(e){}}
function beep(f,d,type){
  try{
    audio();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=0.06;
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

/* ---------- 難度與關卡產生器 ---------- */
function uniqNums(pool,filter,n,exclude){
  pool=shuffle(pool.slice());
  var out=[];
  for(var i=0;i<pool.length&&out.length<n;i++){
    var v=pool[i];
    if(exclude&&exclude[v])continue;
    if(filter(v))out.push(v);
  }
  return out;
}
function range(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;}

var DIFFS={
easy:{name:'🌱 初階',makers:[
  function(){ /* k 的倍數 */
    var k=rnd(2,9),top=k*14;
    var pool=range(2,top),used={};
    var ok=uniqNums(pool,function(v){return v%k===0;},8);
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(pool,function(v){return v%k!==0;},6,used);
    return {label:k+' 的倍數',
      concept:'倍數：把 '+k+' 乘以 1、2、3、… 得出的數，例如 '+k+'、'+(2*k)+'、'+(3*k)+' 都是 '+k+' 的倍數。',
      correct:ok,wrong:bad};
  },
  function(){ /* n 的因數 */
    var n=pick([36,48,60,72]);
    var divs=range(2,n).filter(function(v){return n%v===0;});
    var ok=shuffle(divs).slice(0,8),used={};
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(2,80),function(v){return n%v!==0;},6,used);
    return {label:n+' 的因數',
      concept:'因數：可以整除 '+n+' 的數。試下將 '+n+' 除以每個數字，整除到的就是因數！',
      correct:ok,wrong:bad};
  }
]},
mid:{name:'🌿 中階',makers:[
  function(){ /* 質因數包含 2 和 3 */
    var used={};
    var ok=uniqNums(range(6,150),function(v){var s=primeSet(v);return s[2]&&s[3];},8);
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(6,150),function(v){var s=primeSet(v);return !(s[2]&&s[3]);},6,used);
    return {label:'質因數有 2 和 3 的數',
      concept:'先把數字做質因數分解，例如 24 = 2³ × 3。只有質因數分解式入面同時有 2 同 3 的數先啱！',
      correct:ok,wrong:bad};
  },
  function(){ /* 質因數只有 2 和 5 */
    var cands=range(2,300).filter(function(v){var s=primeSet(v);var ks=Object.keys(s);return ks.length>0&&ks.every(function(k){return k==='2'||k==='5';});});
    var ok=shuffle(cands).slice(0,8),used={};
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(2,300),function(v){var s=primeSet(v);var ks=Object.keys(s);return !(ks.length>0&&ks.every(function(k){return k==='2'||k==='5';}));},6,used);
    return {label:'質因數只有 2 和 5 的數',
      concept:'呢類數只可以寫成 2ᵃ × 5ᵇ 的形式，例如 20 = 2² × 5、25 = 5²。分解後見到有其他質因數就唔啱！',
      correct:ok,wrong:bad};
  },
  function(){ /* 公倍數 */
    var p=pick([[4,6],[6,10],[6,8],[5,8]]);
    var L=lcm(p[0],p[1]);
    var used={};
    var ok=uniqNums(range(L,L*14).filter(function(v){return v%L===0;}),function(){return true;},8);
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(2,L*14),function(v){return v%p[0]!==0||v%p[1]!==0;},6,used);
    return {label:p[0]+' 和 '+p[1]+' 的公倍數',
      concept:'公倍數：同時係 '+p[0]+' 同 '+p[1]+' 倍數的數。最小嗰個叫最小公倍數 LCM = '+L+'，所以全部答案都係 '+L+' 的倍數！',
      correct:ok,wrong:bad};
  },
  function(){ /* 最大公因數的倍數 */
    var p=pick([[18,24],[12,20],[15,25]]);
    var G=gcd(p[0],p[1]);
    var used={};
    var ok=uniqNums(range(G,G*16).filter(function(v){return v%G===0;}),function(){return true;},8);
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(2,G*16),function(v){return v%G!==0;},6,used);
    return {label:p[0]+' 和 '+p[1]+' 的最大公因數的倍數',
      concept:'先求最大公因數 GCD('+p[0]+', '+p[1]+') = '+G+'，再食 '+G+' 的倍數（'+G+'、'+(2*G)+'、'+(3*G)+' …）。',
      correct:ok,wrong:bad};
  }
]},
hard:{name:'🌳 高階',makers:[
  function(){ /* 完全平方數 */
    var ok=[4,9,16,25,36,49,64,81],used={};
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(2,99),function(v){return !isSquare(v);},6,used);
    return {label:'完全平方數',
      concept:'完全平方數可以寫成 n²，例如 49 = 7²。記住頭幾個：4、9、16、25、36、49、64、81…',
      correct:ok.slice(),wrong:bad};
  },
  function(){ /* 等差數列 */
    var a=rnd(2,9),d=rnd(3,6);
    var terms=[];for(var i=0;i<12;i++)terms.push(a+i*d);
    var inSeq={};for(var i=0;i<20;i++)inSeq[a+i*d]=1;
    var ok=shuffle(terms).slice(0,8),used={};
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(2,a+12*d),function(v){return !inSeq[v];},6,used);
    return {label:'等差數列 '+a+', '+(a+d)+', '+(a+2*d)+', … 的項',
      concept:'等差數列：每一項都比上一項多一個固定差 d = '+d+'。通項公式：第 n 項 = '+a+' + (n−1) × '+d+'。',
      correct:ok,wrong:bad};
  },
  function(){ /* 2^n */
    var ok=[2,4,8,16,32,64,128,256],used={};
    ok.forEach(function(v){used[v]=1;});
    var bad=uniqNums(range(2,300),function(v){return !isPow2(v);},6,used);
    return {label:'2ⁿ 形式的數（n ≥ 1）',
      concept:'2ⁿ 即係 2 自乘 n 次：2、4、8、16、32、64、128、256 … 每個都係上一個 × 2！',
      correct:ok.slice(),wrong:bad};
  }
]}};

/* ---------- 遊戲狀態 ---------- */
var player,ghosts,pellets,trail=[],bursts=[],ambient=[];
var level=0,score=0,lives=3,best=0,over=false,state='menu';
var diffKey='easy',gen=null,flash=0,invuln=0,bannerT=null;
var nextDir={x:0,y:0};
try{best=parseInt(localStorage.getItem('neonMathPacHigh')||'0',10)||0;}catch(e){best=0;}

function $(id){return document.getElementById(id);}
function updateHUD(){
  $('lives').textContent=lives;
  $('score').textContent=score;
  $('best').textContent=best;
  $('bestStart').textContent=best;
}
function showBanner(main,sub,ms){
  var b=$('banner');
  b.innerHTML=main+(sub?'<small>'+sub+'</small>':'');
  b.classList.add('show');
  if(bannerT)clearTimeout(bannerT);
  bannerT=setTimeout(function(){b.classList.remove('show');},ms||1500);
}

/* ---------- 背景＋迷宮預渲染 ---------- */
var bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
(function(){
  var b=bgc.getContext('2d');
  var g=b.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1236');g.addColorStop(0.5,'#070c28');g.addColorStop(1,'#04061a');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  function rr(x,y,w,h,r){
    b.beginPath();
    b.moveTo(x+r,y);b.arcTo(x+w,y,x+w,y+h,r);b.arcTo(x+w,y+h,x,y+h,r);
    b.arcTo(x,y+h,x,y,r);b.arcTo(x,y,x+w,y,r);b.closePath();
  }
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(MAZE[r][c]!=='#')continue;
    var x=c*TW+2,y=r*TW+2,w=TW-4,h=TW-4;
    b.save();
    b.shadowColor='#22d3ee';b.shadowBlur=12;
    b.fillStyle='#0e1738';
    rr(x,y,w,h,7);b.fill();
    b.restore();
    b.strokeStyle='rgba(80,220,255,0.85)';b.lineWidth=2;
    rr(x,y,w,h,7);b.stroke();
    b.strokeStyle='rgba(200,250,255,0.25)';b.lineWidth=1;
    rr(x+4,y+4,w-8,h-8,4);b.stroke();
  }
  for(var i=0;i<40;i++){
    var px=Math.random()*W,py=Math.random()*H,pr=1+Math.random()*2.5;
    b.fillStyle='rgba(120,180,255,'+(0.05+Math.random()*0.08)+')';
    b.beginPath();b.arc(px,py,pr,0,Math.PI*2);b.fill();
  }
})();
for(var ai=0;ai<36;ai++){
  ambient.push({x:Math.random()*W,y:Math.random()*H,s:0.3+Math.random()*0.9,
    vy:-(4+Math.random()*10),ph:Math.random()*Math.PI*2});
}

/* ---------- 關卡 ---------- */
function buildLevel(){
  var makers=DIFFS[diffKey].makers;
  gen=makers[level%makers.length]();
  $('target').textContent=gen.label;
  $('concept').innerHTML='💡 <b>數學概念：</b>'+gen.concept;
  var cells=[];
  for(var r=1;r<ROWS-1;r++)for(var c=1;c<COLS-1;c++)
    if(MAZE[r][c]==='.'&&!(c===7&&r===9))cells.push({c:c,r:r});
  shuffle(cells);
  pellets=[];
  var all=gen.correct.map(function(n){return {n:n,ok:true};})
    .concat(gen.wrong.map(function(n){return {n:n,ok:false};}));
  shuffle(all);
  for(var i=0;i<all.length&&i<cells.length;i++)
    pellets.push({c:cells[i].c,r:cells[i].r,n:all[i].n,ok:all[i].ok});
  resetActors();
  trail=[];bursts=[];
  showBanner('第 '+(level+1)+' 關',DIFFS[diffKey].name+' · 食：'+gen.label,1700);
}
function resetActors(){
  player={c:7,r:9,px:7,py:9,dir:{x:0,y:0},ph:0};
  nextDir={x:0,y:0};
  ghosts=[];
  var ng=Math.min(2+Math.floor(level/2),4);
  var gcols=['#ff5d7e','#c084fc','#4dd8ff','#ffb347'];
  var spd=3.2+Math.min(level*0.12,1.0);
  for(var g=0;g<ng;g++)
    ghosts.push({c:6+g,r:5,px:6+g,py:5,dir:{x:1,y:0},col:gcols[g%4],t:g*0.7,spd:spd});
}
function newGame(){
  level=0;score=0;lives=3;over=false;state='play';
  flash=0;invuln=0;
  $('endOverlay').classList.add('hide');
  $('startOverlay').classList.add('hide');
  updateHUD();
  buildLevel();
}

/* ---------- 移動 ---------- */
function atCenter(e){return Math.abs(e.px-e.c)<0.05&&Math.abs(e.py-e.r)<0.05;}
function canGo(c,r,x,y){return !isWall(c+x,r+y);}
var DIRS=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
function stepEnt(e,spd,dt,chase){
  e.px+=e.dir.x*spd*dt;e.py+=e.dir.y*spd*dt;
  var arrived=(e.dir.x!==0&&((e.dir.x>0&&e.px>=e.c+1)||(e.dir.x<0&&e.px<=e.c-1)))||
              (e.dir.y!==0&&((e.dir.y>0&&e.py>=e.r+1)||(e.dir.y<0&&e.py<=e.r-1)))||
              (e.dir.x===0&&e.dir.y===0);
  if(!arrived)return;
  if(e.dir.x!==0)e.c+=e.dir.x;
  if(e.dir.y!==0)e.r+=e.dir.y;
  e.px=e.c;e.py=e.r;
  var opts=[];
  for(var i=0;i<4;i++){
    var d=DIRS[i];
    if(d.x===-e.dir.x&&d.y===-e.dir.y)continue;
    if(canGo(e.c,e.r,d.x,d.y))opts.push(d);
  }
  if(opts.length===0){
    e.dir={x:-e.dir.x,y:-e.dir.y};
    if(e.dir.x===0&&e.dir.y===0)e.dir={x:1,y:0};
    return;
  }
  if(chase){
    var bestD=opts[0],bd=1e9;
    for(var j=0;j<opts.length;j++){
      var dd=Math.abs(e.c+opts[j].x-player.c)+Math.abs(e.r+opts[j].y-player.r);
      if(dd<bd){bd=dd;bestD=opts[j];}
    }
    e.dir=Math.random()<0.78?bestD:opts[rnd(0,opts.length-1)];
  }else{
    e.dir=opts[rnd(0,opts.length-1)];
  }
}
function update(dt){
  if((nextDir.x!==0||nextDir.y!==0)&&atCenter(player)){
    if(canGo(player.c,player.r,nextDir.x,nextDir.y))player.dir={x:nextDir.x,y:nextDir.y};
  }
  if(player.dir.x!==0||player.dir.y!==0){
    if(atCenter(player)&&!canGo(player.c,player.r,player.dir.x,player.dir.y)){
      player.dir={x:0,y:0};
    }else stepEnt(player,4.3,dt,false);
  }
  player.ph+=dt*8;
  if(invuln>0)invuln-=dt;
  if(flash>0)flash-=dt*2.5;
  trail.push({x:(player.px+0.5)*TW,y:(player.py+0.5)*TW,life:1});
  for(var i=trail.length-1;i>=0;i--){trail[i].life-=dt*2.2;if(trail[i].life<=0)trail.splice(i,1);}
  for(var b=bursts.length-1;b>=0;b--){
    var p=bursts[b];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.8;
    if(p.life<=0)bursts.splice(b,1);
  }
  for(var gi=0;gi<ghosts.length;gi++){
    var g=ghosts[gi];g.t+=dt;
    stepEnt(g,g.spd,dt,true);
  }
  /* 食豆 */
  for(var pi=pellets.length-1;pi>=0;pi--){
    var pl=pellets[pi];
    if(pl.c===player.c&&pl.r===player.r){
      pellets.splice(pi,1);
      var px=(pl.c+0.5)*TW,py=(pl.r+0.5)*TW;
      if(pl.ok){
        score+=10;beep(880,0.08,'sine');
        for(var k=0;k<10;k++)bursts.push({x:px,y:py,
          vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160,
          life:1,col:'#7df9ff'});
      }else{
        score=Math.max(0,score-10);flash=1;beep(150,0.18,'sawtooth');
        for(var k2=0;k2<8;k2++)bursts.push({x:px,y:py,
          vx:(Math.random()-0.5)*140,vy:(Math.random()-0.5)*140,
          life:1,col:'#ff5d7e'});
      }
      updateHUD();
    }
  }
  /* 過關？ */
  var left=0;
  for(var q=0;q<pellets.length;q++)if(pellets[q].ok)left++;
  if(left===0){
    state='clear';
    level++;score+=100;
    if(score>best){best=score;try{localStorage.setItem('neonMathPacHigh',String(best));}catch(e){}}
    updateHUD();
    beep(660,0.1,'sine');
    setTimeout(function(){beep(880,0.12,'sine');},120);
    showBanner('✨ 過關！ +100',DIFFS[diffKey].name+' · 第 '+(level+1)+' 關',1600);
    setTimeout(function(){if(state==='clear'){state='play';buildLevel();}},1700);
    return;
  }
  /* 掂鬼？ */
  if(invuln<=0){
    for(var hi=0;hi<ghosts.length;hi++){
      var gh=ghosts[hi];
      var dx=gh.px-player.px,dy=gh.py-player.py;
      if(dx*dx+dy*dy<0.32){
        lives--;flash=1;beep(120,0.3,'square');updateHUD();
        if(lives<=0){gameOver();return;}
        resetActors();invuln=1.8;
        showBanner('💔 掂到鬼！','剩低 '+lives+' 條命',1200);
        break;
      }
    }
  }
}
function gameOver(){
  over=true;state='over';
  $('endScore').textContent=score;
  $('endBest').textContent=(score>=best&&score>0)?'🎉 新紀錄！最高分：'+best:'🏆 最高分：'+best;
  $('endOverlay').classList.remove('hide');
}

/* ---------- 繪製 ---------- */
var time=0;
function drawPellet(p){
  var x=(p.c+0.5)*TW,y=(p.r+0.5)*TW;
  var pulse=0.5+0.5*Math.sin(time*4+p.c*1.3+p.r*0.7);
  ctx.save();
  ctx.shadowColor='#ffd166';ctx.shadowBlur=8+7*pulse;
  var g=ctx.createRadialGradient(x-3,y-4,2,x,y,14);
  g.addColorStop(0,'#3a2f6e');g.addColorStop(1,'#141033');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,209,102,0.9)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 14px "PingFang HK","Microsoft JhengHei",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(String(p.n),x,y+1);
  ctx.restore();
}
function drawPlayer(){
  var x=(player.px+0.5)*TW,y=(player.py+0.5)*TW;
  for(var i=0;i<trail.length;i++){
    var t=trail[i];
    ctx.fillStyle='rgba(255,190,80,'+(0.22*t.life).toFixed(3)+')';
    ctx.beginPath();ctx.arc(t.x,t.y,7*t.life+2,0,Math.PI*2);ctx.fill();
  }
  if(invuln>0&&Math.floor(time*12)%2===0)return;
  ctx.save();
  ctx.shadowColor='#ffc93f';ctx.shadowBlur=22;
  var g=ctx.createRadialGradient(x-5,y-6,2,x,y,14);
  g.addColorStop(0,'#fffbe6');g.addColorStop(0.45,'#ffe14d');g.addColorStop(1,'#ff8a00');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath();ctx.ellipse(x-5,y-6,4.5,3.2,-0.5,0,Math.PI*2);ctx.fill();
  var dx=player.dir.x,dy=player.dir.y;
  var ex1=x-4+dx*2,ey1=y-1+dy*2,ex2=x+4+dx*2,ey2=y-1+dy*2;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ex1,ey1,3.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(ex2,ey2,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a2340';
  ctx.beginPath();ctx.arc(ex1+dx*1.4,ey1+dy*1.4,1.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(ex2+dx*1.4,ey2+dy*1.4,1.7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawGhost(g){
  var x=(g.px+0.5)*TW,y=(g.py+0.5)*TW+Math.sin(time*6+g.t)*1.5;
  ctx.save();
  ctx.globalAlpha=0.92;
  ctx.shadowColor=g.col;ctx.shadowBlur=16;
  var gr=ctx.createRadialGradient(x-4,y-6,2,x,y,15);
  gr.addColorStop(0,'rgba(255,255,255,0.95)');
  gr.addColorStop(0.4,hexA(g.col,0.7));
  gr.addColorStop(1,hexA(g.col,0.95));
  ctx.fillStyle=gr;
  ctx.beginPath();
  ctx.arc(x,y,12,Math.PI,0,false);
  ctx.lineTo(x+12,y+10);
  ctx.quadraticCurveTo(x+9,y+13,x+6,y+10);
  ctx.quadraticCurveTo(x+3,y+13,x,y+10);
  ctx.quadraticCurveTo(x-3,y+13,x-6,y+10);
  ctx.quadraticCurveTo(x-9,y+13,x-12,y+10);
  ctx.lineTo(x-12,y);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath();ctx.ellipse(x-4,y-6,3.6,5.5,-0.4,0,Math.PI*2);ctx.fill();
  var dx=g.dir.x,dy=g.dir.y;
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath();ctx.arc(x-4.5+dx,y-2+dy,3.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+4.5+dx,y-2+dy,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#243b6e';
  ctx.beginPath();ctx.arc(x-4.5+dx*2.4,y-2+dy*2.4,1.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+4.5+dx*2.4,y-2+dy*2.4,1.7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function render(){
  ctx.drawImage(bgc,0,0);
  for(var i=0;i<ambient.length;i++){
    var a=ambient[i];
    var tw=0.25+0.35*Math.abs(Math.sin(time*1.5+a.ph));
    ctx.fillStyle='rgba(140,200,255,'+tw.toFixed(2)+')';
    ctx.beginPath();ctx.arc(a.x,a.y,a.s+1,0,Math.PI*2);ctx.fill();
  }
  for(var pi=0;pi<pellets.length;pi++)drawPellet(pellets[pi]);
  for(var bi=0;bi<bursts.length;bi++){
    var p=bursts[bi];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,2.5*p.life+1,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawPlayer();
  for(var gi=0;gi<ghosts.length;gi++)drawGhost(ghosts[gi]);
  if(flash>0){
    var fg=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
    fg.addColorStop(0,'rgba(255,60,90,0)');
    fg.addColorStop(1,'rgba(255,60,90,'+(0.55*Math.min(1,flash)).toFixed(2)+')');
    ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);
  }
}

/* ---------- 主循環 ---------- */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=(ts-last)/1000;last=ts;
  if(dt>0.05)dt=0.05;
  if(dt<0)dt=0;
  time+=dt;
  for(var i=0;i<ambient.length;i++){
    var a=ambient[i];a.y+=a.vy*dt;
    if(a.y<-4){a.y=H+4;a.x=Math.random()*W;}
  }
  if(state==='play')update(dt);
  render();
}

/* ---------- 輸入 ---------- */
function setDir(x,y){nextDir={x:x,y:y};audio();}
$('btnU').addEventListener('pointerdown',function(e){e.preventDefault();setDir(0,-1);});
$('btnD').addEventListener('pointerdown',function(e){e.preventDefault();setDir(0,1);});
$('btnL').addEventListener('pointerdown',function(e){e.preventDefault();setDir(-1,0);});
$('btnR').addEventListener('pointerdown',function(e){e.preventDefault();setDir(1,0);});
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W'){setDir(0,-1);e.preventDefault();}
  else if(k==='ArrowDown'||k==='s'||k==='S'){setDir(0,1);e.preventDefault();}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){setDir(-1,0);e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){setDir(1,0);e.preventDefault();}
});
var swp=null;
cv.addEventListener('pointerdown',function(e){
  audio();
  swp={x:e.clientX,y:e.clientY};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',function(e){
  if(!swp)return;
  var dx=e.clientX-swp.x,dy=e.clientY-swp.y;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);
  else setDir(0,dy>0?1:-1);
  swp={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointerup',function(){swp=null;});
cv.addEventListener('pointercancel',function(){swp=null;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------- 按鈕 ---------- */
var diffBtns=document.querySelectorAll('.diffbtn');
for(var di=0;di<diffBtns.length;di++){
  diffBtns[di].addEventListener('click',function(){
    diffKey=this.getAttribute('data-diff');
    audio();beep(660,0.08,'sine');
    newGame();
  });
}
$('againBtn').addEventListener('click',function(){audio();newGame();});
$('changeDiffBtn').addEventListener('click',function(){
  $('endOverlay').classList.add('hide');
  $('startOverlay').classList.remove('hide');
  state='menu';updateHUD();
});

/* ---------- 啟動 ---------- */
updateHUD();
buildLevel();
state='menu';
requestAnimationFrame(loop);
})();
</script>
