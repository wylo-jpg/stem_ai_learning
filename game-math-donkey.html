<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>數學金剛 · 熱帶叢林</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans HK",sans-serif;
  font-size:16px;color:#fff;min-height:100vh;
  background:linear-gradient(180deg,#2b1055 0%,#6a3d9a 30%,#d76d77 62%,#ffaf7b 85%,#ffd6a5 100%);
  background-attachment:fixed;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
  overflow-x:hidden;
}
header{
  text-align:center;padding:14px 10px 8px;position:relative;overflow:hidden;
}
header h1{
  margin:0;font-size:26px;letter-spacing:2px;font-weight:900;
  background:linear-gradient(90deg,#ffe259,#ffa751,#ff6b9d,#ffe259);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 5s linear infinite;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));
}
@keyframes shimmer{to{background-position:300% 0}}
header p{margin:4px 0 0;font-size:13px;color:#ffe9c9;opacity:.9;letter-spacing:3px}
.back{
  display:block;text-align:center;color:#fff;text-decoration:none;
  padding:12px;font-size:16px;font-weight:700;
  background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25);
}
.back:active{background:rgba(255,255,255,.25)}
.wrap{max-width:600px;margin:0 auto;padding:10px 10px 24px}
.hud{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3);border-radius:16px;
  padding:8px 12px;margin-bottom:8px;font-size:15px;font-weight:700;
  box-shadow:0 4px 18px rgba(0,0,0,.25);
}
.hud .q{flex-basis:100%;font-size:16px;color:#fff8e7;background:rgba(0,0,0,.25);
  border-radius:10px;padding:6px 10px;text-align:center;line-height:1.5}
.hud .score{color:#ffe259}.hud .best{color:#ffd6a5;font-size:13px}
canvas{
  width:100%;display:block;border-radius:18px;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.ctrls{display:flex;justify-content:space-between;margin-top:10px;gap:10px;align-items:stretch}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}
.btn{
  min-width:64px;min-height:64px;font-size:24px;font-weight:800;color:#fff;
  border:1px solid rgba(255,255,255,.4);border-radius:18px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);
  touch-action:none;transition:transform .08s;
  font-family:inherit;
}
.btn:active{transform:scale(.92);background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,.15))}
.dpad .up{grid-column:2;grid-row:1}
.dpad .left{grid-column:1;grid-row:2}
.dpad .down{grid-column:2;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}
#jumpBtn{
  flex:1;min-height:136px;font-size:22px;border-radius:20px;
  background:linear-gradient(160deg,#ffb703,#fb8500);
  border:1px solid rgba(255,255,255,.5);color:#5a2d00;
  box-shadow:0 6px 20px rgba(251,133,0,.5),inset 0 1px 0 rgba(255,255,255,.5);
}
#jumpBtn:active{transform:scale(.96)}
.overlay{
  position:fixed;inset:0;background:rgba(20,8,40,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{
  background:linear-gradient(165deg,rgba(58,28,113,.96),rgba(120,60,120,.96));
  border:1px solid rgba(255,255,255,.35);border-radius:22px;
  padding:20px;max-width:480px;width:100%;text-align:center;
  max-height:92vh;overflow-y:auto;
  box-shadow:0 12px 44px rgba(0,0,0,.5);
  animation:pop .3s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 8px;font-size:24px}
.card p{font-size:15px;line-height:1.75;color:#f5e9ff;margin:8px 0}
.diffrow{display:flex;gap:8px;margin:12px 0}
.diff{
  flex:1;border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 4px;
  background:rgba(255,255,255,.08);cursor:pointer;color:#fff;font-family:inherit;
  font-size:14px;line-height:1.5;transition:all .15s;min-height:88px;
}
.diff .ic{font-size:26px;display:block}
.diff b{font-size:16px}
.diff.sel{
  border-color:#ffe259;background:rgba(255,225,89,.18);
  box-shadow:0 0 16px rgba(255,225,89,.45);transform:translateY(-2px);
}
.concept{
  background:rgba(255,225,89,.12);border:2px dashed #ffe259;border-radius:12px;
  padding:10px 12px;margin:12px 0;font-size:14px;color:#ffeeb0;text-align:left;line-height:1.7;
}
.bigbtn{
  width:100%;min-height:60px;font-size:20px;font-weight:900;font-family:inherit;color:#4a2500;
  background:linear-gradient(160deg,#ffe259,#ffa751);border:none;border-radius:16px;
  margin-top:10px;cursor:pointer;letter-spacing:2px;
  box-shadow:0 6px 20px rgba(255,180,60,.5),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .1s;
}
.bigbtn:active{transform:scale(.96)}
.ghostbtn{
  width:100%;min-height:48px;font-size:16px;font-weight:700;font-family:inherit;color:#fff;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);border-radius:14px;
  margin-top:8px;cursor:pointer;
}
.ghostbtn:active{background:rgba(255,255,255,.25)}
.hide{display:none!important}
.stat{font-size:18px;margin:6px 0}
.stat b{color:#ffe259}
@media (min-width:700px){
  header h1{font-size:32px}
  .dpad{grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px)}
}
</style>
</head>
<body>
<header>
  <h1>🦍 數學金剛 · 熱帶叢林</h1>
  <p>JUNGLE SUNSET RESCUE</p>
</header>
<a class="back" href="games.html">← 返回遊戲列表</a>

<div class="wrap">
  <div class="hud">
    <div class="q" id="qq">揀難度開始遊戲</div>
    <div>❤️ <span id="lives">3</span></div>
    <div>⭐ <span class="score" id="score">0</span></div>
    <div>🚩 第 <span id="level">1</span> 關</div>
    <div class="best">🏆 <span id="best">0</span></div>
  </div>
  <canvas id="cv" width="480" height="320"></canvas>
  <div class="ctrls">
    <div class="dpad">
      <button class="btn up" id="btnU">▲</button>
      <button class="btn left" id="btnL">◀</button>
      <button class="btn down" id="btnD">▼</button>
      <button class="btn right" id="btnR">▶</button>
    </div>
    <button class="btn" id="jumpBtn">⤒<br><span style="font-size:14px">跳 JUMP</span></button>
  </div>
</div>

<div class="overlay" id="intro"><div class="card">
  <h2>🦍 數學金剛 · 熱帶叢林</h2>
  <p><b>玩法：</b>解開方程題，執起<b style="color:#ffe259">正確答案</b>嘅金幣（掂到錯答案扣 20 分）🐒 避開由巨猿掟落嚟嘅<b style="color:#ffb703">錯答案木桶</b>（撞到扣 1 條命，可以跳起避開）🪜 爬上頂層救公主！<br>◀ ▶ 移動　▲ ▼ 爬梯　JUMP 跳躍<br>❤️ 3 條命 · 每過一關木桶愈來愈快！</p>
  <p style="font-size:16px;font-weight:800;color:#ffe259">揀一個難度開始：</p>
  <div class="diffrow">
    <button class="diff sel" data-d="easy"><span class="ic">🌱</span><b>初階</b><br>中一至中二<br>一元一次方程</button>
    <button class="diff" data-d="mid"><span class="ic">🌿</span><b>中階</b><br>中三至中四<br>二次方程</button>
    <button class="diff" data-d="hard"><span class="ic">🌳</span><b>高階</b><br>中五至中六<br>聯立方程</button>
  </div>
  <div class="concept" id="conceptBox">💡 <b>數學概念：</b><span id="conceptTxt"></span></div>
  <button class="bigbtn" id="startBtn">▶ 開始遊戲</button>
</div></div>

<div class="overlay hide" id="endOverlay"><div class="card">
  <h2 id="endTitle"></h2>
  <p class="stat" id="endText"></p>
  <p class="stat">🏆 最高分：<b id="endBest"></b></p>
  <button class="bigbtn" id="againBtn">🔁 再玩一次</button>
  <button class="ghostbtn" id="changeDiffBtn">🎚️ 換難度</button>
</div></div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=480,H=320;
/* Bug 5 fix: 4 distinct platform/ladder/barrel layouts. Same 4 heights
   (85/150/215/280) and same win rule (top platform, x>400), so questions,
   scoring, princess and monkey positions are unchanged. Every ladder x lies
   inside both platforms it joins, and consecutive barrel segments overlap,
   so every platform and ladder is reachable in every layout. */
var LAYOUTS=[
 {plats:[{x0:0,x1:480,y:280},{x0:60,x1:480,y:215},{x0:0,x1:420,y:150},{x0:60,x1:480,y:85}],
  ladders:[{x:400,top:215,bot:280},{x:100,top:150,bot:215},{x:380,top:85,bot:150}],
  segs:[{x0:60,x1:480,y:85},{x0:0,x1:420,y:150},{x0:60,x1:480,y:215},{x0:0,x1:480,y:280}]},
 {plats:[{x0:0,x1:480,y:280},{x0:0,x1:420,y:215},{x0:60,x1:480,y:150},{x0:0,x1:480,y:85}],
  ladders:[{x:120,top:215,bot:280},{x:300,top:150,bot:215},{x:200,top:85,bot:150}],
  segs:[{x0:0,x1:480,y:85},{x0:60,x1:480,y:150},{x0:0,x1:420,y:215},{x0:0,x1:480,y:280}]},
 {plats:[{x0:0,x1:480,y:280},{x0:120,x1:480,y:215},{x0:0,x1:360,y:150},{x0:60,x1:480,y:85}],
  ladders:[{x:380,top:215,bot:280},{x:180,top:150,bot:215},{x:100,top:85,bot:150}],
  segs:[{x0:60,x1:480,y:85},{x0:0,x1:360,y:150},{x0:120,x1:480,y:215},{x0:0,x1:480,y:280}]},
 {plats:[{x0:0,x1:480,y:280},{x0:40,x1:480,y:215},{x0:0,x1:440,y:150},{x0:120,x1:480,y:85}],
  ladders:[{x:200,top:215,bot:280},{x:360,top:150,bot:215},{x:300,top:85,bot:150}],
  segs:[{x0:120,x1:480,y:85},{x0:0,x1:440,y:150},{x0:40,x1:480,y:215},{x0:0,x1:480,y:280}]}
];
var PLATS=LAYOUTS[0].plats;
var LADDERS=LAYOUTS[0].ladders;
var SEGS=LAYOUTS[0].segs;
var layoutOrder=[],layoutCycle=-1;
function pickLayoutForLevel(){
  var cycle=Math.floor((level-1)/4);
  if(cycle!==layoutCycle){layoutCycle=cycle;layoutOrder=shuffle([0,1,2,3]);}
  var lay=LAYOUTS[layoutOrder[(level-1)%4]];
  PLATS=lay.plats;LADDERS=lay.ladders;SEGS=lay.segs;
}
var player={x:30,y:280,vx:0,vy:0,ground:true,climb:false,face:1},barrels=[],coins=[];
var q={txt:'揀難度開始遊戲',coins:[],barrelVals:['?']},gotKey=false,score=0,lives=3,level=1;
var over=false,started=false,spawnT=1.4,msgT=0,msg='',throwAnim=0;
var diff='easy',best=0;
var input={l:false,r:false,u:false,d:false};
try{best=parseInt(localStorage.getItem('dmj_high')||'0',10)||0;}catch(e){}

function beep(f,d,type){try{
  var ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
  if(ac.state==='suspended')ac.resume();
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.12,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}catch(e){}}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var DIFFS={
  easy:{concept:'解一元一次方程 —— 把未知數 x 孤立出嚟：先移項，再除以係數。例如 2x + 6 = 18，先兩邊減 6 得 2x = 12，再除以 2 得 x = 6。'},
  mid:{concept:'解二次方程 x² − Sx + P = 0 —— 用因式分解：搵兩個數，相加等於 S、相乘等於 P，即 (x − r₁)(x − r₂) = 0，所以 x = r₁ 或 x = r₂。呢版題目叫你執其中一個根。'},
  hard:{concept:'解聯立方程 —— 用加減消元法：兩式相加消去 y 求 x，兩式相減消去 x 求 y。答案要寫成有序對 (x, y)，x 同 y 嘅次序唔可以調轉！'}
};
function genEasy(){
  var a=rnd(2,9),x=rnd(2,9),b=rnd(1,15),txt;
  if(Math.random()<0.5)txt=a+'x + '+b+' = '+(a*x+b)+'，求 x';
  else{b=rnd(1,a*x-1);txt=a+'x − '+b+' = '+(a*x-b)+'，求 x';}
  var set={},wr=[],cand=shuffle([x+1,x-1,x+2,x-2,x+3,x-3]);
  for(var i=0;i<cand.length&&wr.length<2;i++){var w=cand[i];if(w>0&&!set[w]&&w!==x){set[w]=1;wr.push(w);}}
  var coins=shuffle([{label:String(x),ok:true},{label:String(wr[0]),ok:false},{label:String(wr[1]),ok:false}]);
  return {txt:txt,coins:coins,barrelVals:[String(wr[0]),String(wr[1])]};
}
function genMid(){
  var r1=rnd(-4,4),r2=rnd(-4,4);
  while(r2===r1)r2=rnd(-4,4);
  var S=r1+r2,P=r1*r2,eq='x²';
  if(S>0)eq+=' − '+S+'x';else if(S<0)eq+=' + '+(-S)+'x';
  if(P>0)eq+=' + '+P;else if(P<0)eq+=' − '+(-P);
  eq+=' = 0';
  var wrong=rnd(-5,5);
  while(wrong===r1||wrong===r2)wrong=rnd(-5,5);
  var coins=shuffle([{label:String(r1),ok:true},{label:String(r2),ok:true},{label:String(wrong),ok:false}]);
  return {txt:eq+'，求 x（其中一個根）',coins:coins,barrelVals:[String(wrong)]};
}
function genHard(){
  var x=rnd(2,9),y=rnd(-3,7),a=x+y,b=x-y;
  function pr(p,q2){return '('+p+','+q2+')';}
  var pool=shuffle([pr(y,x),pr(x+1,y-1),pr(x-1,y+1)]);
  var coins=shuffle([{label:pr(x,y),ok:true},{label:pool[0],ok:false},{label:pool[1],ok:false}]);
  return {txt:'x + y = '+a+'；x − y = '+b+'，求 (x, y)',coins:coins,barrelVals:[pool[0],pool[1]]};
}

function updHud(){
  document.getElementById('lives').textContent=lives;
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('best').textContent=best;
}
function saveBest(){
  if(score>best){best=score;try{localStorage.setItem('dmj_high',String(best));}catch(e){}}
  updHud();
}
function buildLevel(){
  pickLayoutForLevel();
  q=(diff==='mid')?genMid():((diff==='hard')?genHard():genEasy());
  gotKey=false;throwAnim=0;
  document.getElementById('qq').textContent=q.txt;
  player={x:30,y:280,vx:0,vy:0,ground:true,climb:false,face:1};
  barrels=[];spawnT=1.4;msg='';msgT=0;
  var spots=PLATS.filter(function(pl){return pl.y<280;}).map(function(pl){return {x:Math.round((pl.x0+pl.x1)/2),y:pl.y};});
  coins=q.coins.map(function(c,i){return {x:spots[i].x,y:spots[i].y-18,label:c.label,ok:c.ok,got:false,ph:Math.random()*6.28};});
}
function newGame(){
  score=0;lives=3;level=1;over=false;
  document.getElementById('endOverlay').classList.add('hide');
  buildLevel();updHud();
}
function onLadder(){
  for(var i=0;i<LADDERS.length;i++){var l=LADDERS[i];
    if(Math.abs(player.x-l.x)<14&&player.y>=l.top-4&&player.y<=l.bot+8)return l;}
  return null;
}
function spawnBarrel(){
  var w=q.barrelVals[rnd(0,q.barrelVals.length-1)];
  barrels.push({seg:0,x:SEGS[0].x0+10,dir:1,v:1.6+level*0.25,val:w});
  throwAnim=1;
}
function loseLife(why){
  lives--;updHud();beep(160,0.35,'sawtooth');
  if(lives<=0){gameOver();return;}
  msg=why;msgT=100;
  player.x=30;player.y=280;player.vx=0;player.vy=0;player.climb=false;
  barrels=[];
}
function update(dt){
  var p=player,L=input.l,R=input.r,U=input.u,D=input.d,i;
  throwAnim=Math.max(0,throwAnim-dt*3);
  var lad=onLadder();
  if(p.climb){
    p.vy=0;p.vx=0;
    if(U)p.y-=2.2;if(D)p.y+=2.2;
    for(i=0;i<LADDERS.length;i++){var l=LADDERS[i];
      if(Math.abs(p.x-l.x)<14){
        if(p.y<=l.top){p.y=l.top;p.climb=false;}
        if(p.y>=l.bot){p.y=l.bot;p.climb=false;}
      }}
    if(!U&&!D&&!lad)p.climb=false;
  }else{
    p.vx=(R?2.3:0)-(L?2.3:0);
    if(p.vx!==0)p.face=p.vx>0?1:-1;
    if(lad&&(U||D)){p.climb=true;p.vx=0;p.vy=0;}
    else{p.vy+=0.5;if(p.vy>10)p.vy=10;}
  }
  p.x+=p.vx;
  if(p.x<12)p.x=12;if(p.x>W-12)p.x=W-12;
  if(!p.climb){
    p.y+=p.vy;p.ground=false;
    for(var j=0;j<PLATS.length;j++){var pl=PLATS[j];
      if(p.vy>=0&&p.x>=pl.x0-6&&p.x<=pl.x1+6){
        if(p.y>=pl.y&&p.y-p.vy<=pl.y+8){p.y=pl.y;p.vy=0;p.ground=true;}
      }}
    if(p.y>H+20){loseLife('😵 跌咗落嚟！');return;}
  }
  spawnT-=dt;
  if(spawnT<=0){spawnBarrel();spawnT=Math.max(0.9,2.4-level*0.25);}
  for(var b=barrels.length-1;b>=0;b--){var br=barrels[b];
    br.x+=br.dir*br.v;
    var s=SEGS[br.seg];
    if((br.dir>0&&br.x>s.x1)||(br.dir<0&&br.x<s.x0)){
      if(br.seg<SEGS.length-1){br.seg++;var ns=SEGS[br.seg];
        br.x=Math.max(ns.x0,Math.min(ns.x1,br.x));br.dir*=-1;}
      else{barrels.splice(b,1);continue;}
    }
    var by=s.y-13;
    if(Math.abs(br.x-p.x)<16&&Math.abs(by-(p.y-14))<20){loseLife('💥 撞到錯答案木桶！');return;}
  }
  for(var k=0;k<coins.length;k++){var cn=coins[k];
    if(!cn.got&&Math.abs(cn.x-p.x)<18&&Math.abs(cn.y-(p.y-16))<24){
      cn.got=true;
      if(cn.ok){gotKey=true;score+=100;beep(880,0.15);beep(1320,0.2);msg='✅ 拎到正確答案！快上頂救公主！';}
      else{score=Math.max(0,score-20);beep(220,0.18,'triangle');msg='❌ '+cn.label+' 唔係答案，扣 20 分！';}
      msgT=100;updHud();
    }}
  if(msgT>0)msgT--;
  if(gotKey&&p.y<110&&p.x>400){
    level++;score+=lives*150;saveBest();
    beep(523,0.12);setTimeout(function(){beep(659,0.12);},130);setTimeout(function(){beep(784,0.25);},260);
    buildLevel();updHud();
  }
}
function gameOver(){
  over=true;saveBest();beep(140,0.5,'sawtooth');
  document.getElementById('endTitle').textContent='🌺 遊戲結束';
  document.getElementById('endText').innerHTML='去到第 <b>'+level+'</b> 關<br>總分 <b>'+score+'</b>';
  document.getElementById('endBest').textContent=best;
  document.getElementById('endOverlay').classList.remove('hide');
}

/* ---------- 現代風格繪圖 ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function fitText(txt,maxW,base,x,y){
  var s=base;ctx.font='bold '+s+'px sans-serif';
  while(ctx.measureText(txt).width>maxW&&s>8){s--;ctx.font='bold '+s+'px sans-serif';}
  ctx.fillText(txt,x,y+1);
}
var petals=[];
for(var pi=0;pi<26;pi++)petals.push({x:Math.random()*W,y:Math.random()*H,s:3+Math.random()*4,ph:Math.random()*6.28,vy:18+Math.random()*26,rot:Math.random()*6.28,vr:(Math.random()-0.5)*4,c:['#ffc2d1','#ff8fa3','#ffd6a5','#ffaf7b','#f9f871'][pi%5]});
function leaf(x,y,dir,s){
  ctx.save();ctx.translate(x,y);ctx.scale(dir*s,s);
  ctx.fillStyle='rgba(46,125,50,.9)';
  ctx.beginPath();ctx.ellipse(0,0,7,3.4,0.5,0,6.2832);ctx.fill();
  ctx.strokeStyle='rgba(27,94,32,.9)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,-2);ctx.stroke();
  ctx.restore();
}
function drawBG(t){
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#2b1055');sky.addColorStop(0.42,'#7b3fa0');sky.addColorStop(0.68,'#e0607e');sky.addColorStop(1,'#ffaf7b');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // 太陽
  ctx.save();ctx.shadowColor='#ffdd88';ctx.shadowBlur=50;
  ctx.fillStyle='#ffe9a3';circ(352,92,34);ctx.restore();
  ctx.fillStyle='rgba(255,233,163,.35)';circ(352,92,44);
  // 雲
  ctx.fillStyle='rgba(255,255,255,.22)';
  for(var i=0;i<3;i++){
    var cx=((t*10+i*230)%(W+160))-80,cy=42+i*30;
    ctx.beginPath();ctx.ellipse(cx,cy,34,10,0,0,6.2832);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+22,cy+3,24,8,0,0,6.2832);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx-24,cy+4,22,7,0,0,6.2832);ctx.fill();
  }
  // 遠山剪影
  ctx.fillStyle='rgba(52,24,80,.6)';
  ctx.beginPath();ctx.moveTo(0,262);
  for(var x=0;x<=W;x+=16)ctx.lineTo(x,262-26*Math.abs(Math.sin(x*0.021))-10*Math.sin(x*0.008));
  ctx.lineTo(W,320);ctx.lineTo(0,320);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(30,70,45,.55)';
  ctx.beginPath();ctx.moveTo(0,292);
  for(var x2=0;x2<=W;x2+=16)ctx.lineTo(x2,292-18*Math.abs(Math.sin(x2*0.03+2)));
  ctx.lineTo(W,320);ctx.lineTo(0,320);ctx.closePath();ctx.fill();
  // 垂藤
  [[70,90],[300,70],[470,110]].forEach(function(v){
    ctx.strokeStyle='rgba(46,125,50,.85)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(v[0],0);ctx.quadraticCurveTo(v[0]+8,v[1]/2,v[0]-4,v[1]);ctx.stroke();
    leaf(v[0]+4,v[1]*0.5,1,1);leaf(v[0]-2,v[1]*0.8,-1,0.9);
  });
  // 花瓣粒子
  petals.forEach(function(pt){
    pt.y+=pt.vy*0.016;pt.x+=Math.sin(t*2+pt.ph)*22*0.016;pt.rot+=pt.vr*0.016;
    if(pt.y>H+10){pt.y=-10;pt.x=Math.random()*W;}
    ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(pt.rot);
    ctx.fillStyle=pt.c;ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.ellipse(0,0,pt.s,pt.s*0.55,0,0,6.2832);ctx.fill();
    ctx.restore();
  });
  ctx.globalAlpha=1;
}
function drawPlats(){
  PLATS.forEach(function(pl,i){
    var w=pl.x1-pl.x0;
    ctx.save();ctx.shadowColor='rgba(255,200,120,.4)';ctx.shadowBlur=12;
    var g=ctx.createLinearGradient(0,pl.y,0,pl.y+14);
    g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,.12)');
    ctx.fillStyle=g;rr(pl.x0,pl.y,w,14,7);ctx.fill();ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;rr(pl.x0,pl.y,w,14,7);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.65)';rr(pl.x0+4,pl.y+2,w-8,2.6,1.3);ctx.fill();
    leaf(pl.x0+26,pl.y-1,1,1);leaf(pl.x1-44,pl.y-2,-1,1.1);leaf((pl.x0+pl.x1)/2+70,pl.y-1,1,0.9);
  });
}
function drawLadders(){
  LADDERS.forEach(function(l){
    var g=ctx.createLinearGradient(l.x-11,0,l.x+11,0);
    g.addColorStop(0,'#b97f3e');g.addColorStop(0.5,'#eec27f');g.addColorStop(1,'#b97f3e');
    ctx.fillStyle=g;
    rr(l.x-12,l.top,7,l.bot-l.top,3.5);ctx.fill();
    rr(l.x+5,l.top,7,l.bot-l.top,3.5);ctx.fill();
    for(var y=l.top+6;y<l.bot-3;y+=12){rr(l.x-12,y,24,5,2.5);ctx.fill();}
  });
}
function drawMonkey(){
  var mx=38,my=46,lift=throwAnim>0?-16:0;
  ctx.fillStyle='#5b3a9e';circ(mx-15,my-13,6);circ(mx+15,my-13,6);
  var g=ctx.createLinearGradient(mx-17,my-18,mx+17,my+18);
  g.addColorStop(0,'#9a7ede');g.addColorStop(1,'#5b3a9e');
  ctx.fillStyle=g;rr(mx-17,my-17,34,36,15);ctx.fill();
  ctx.fillStyle='#ffd9b3';rr(mx-11,my-10,22,16,8);ctx.fill();
  ctx.fillStyle='#2b1055';circ(mx-5,my-4,2.4);circ(mx+5,my-4,2.4);
  ctx.strokeStyle='#2b1055';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(mx,my+2,6,0.3,2.84);ctx.stroke();
  ctx.strokeStyle='#5b3a9e';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(mx+15,my+8);ctx.lineTo(mx+26,my-6+lift);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText('錯答案!',mx+8,my-24);
}
function drawPrincess(t){
  var px=446,py=85;
  for(var i=0;i<8;i++){var a=i/8*6.2832+t*0.6;
    ctx.fillStyle='rgba(255,150,190,.9)';
    ctx.beginPath();ctx.ellipse(px+Math.cos(a)*17,py-36+Math.sin(a)*17,7,7,0,0,6.2832);ctx.fill();}
  ctx.fillStyle='#ffe259';circ(px,py-36,7);
  var g=ctx.createLinearGradient(0,py-32,0,py);
  g.addColorStop(0,'#ff9de2');g.addColorStop(1,'#d6339c');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(px,py-32);
  ctx.quadraticCurveTo(px-13,py-8,px-11,py);ctx.lineTo(px+11,py);
  ctx.quadraticCurveTo(px+13,py-8,px,py-32);ctx.fill();
  ctx.fillStyle='#ffd9b3';circ(px,py-40,9);
  ctx.fillStyle='#7c4a1e';ctx.beginPath();ctx.arc(px,py-42,9,3.3,6.1);ctx.fill();
  ctx.fillStyle='#2b1055';circ(px-3.4,py-40,1.6);circ(px+3.4,py-40,1.6);
  ctx.strokeStyle='#c2185b';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(px,py-37,3.5,0.4,2.7);ctx.stroke();
  var wv=Math.sin(t*8)*4;
  ctx.strokeStyle='#ffd9b3';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px+9,py-28);ctx.lineTo(px+17,py-38+wv);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.94)';rr(px-48,py-74,56,22,11);ctx.fill();
  ctx.fillStyle='#c2185b';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(gotKey?'快啲嚟呀!':'救我呀!',px-20,py-62);
  if(gotKey&&!over){
    var ay=44+Math.sin(t*6)*5;
    ctx.fillStyle='#ffe259';ctx.font='bold 24px sans-serif';
    ctx.shadowColor='#ff9d00';ctx.shadowBlur=10;
    ctx.fillText('⬇',px,ay);ctx.shadowBlur=0;
  }
}
function drawCoins(t){
  coins.forEach(function(cn){
    if(cn.got)return;
    var sq=Math.abs(Math.cos(t*3+cn.ph));
    var rx=17*Math.max(0.22,sq);
    ctx.save();ctx.shadowColor='rgba(255,215,0,.95)';ctx.shadowBlur=16;
    var g=ctx.createLinearGradient(cn.x-rx,0,cn.x+rx,0);
    g.addColorStop(0,'#b97a00');g.addColorStop(0.5,'#ffe259');g.addColorStop(1,'#b97a00');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.ellipse(cn.x,cn.y,rx,17,0,0,6.2832);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='rgba(150,90,0,.85)';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(cn.x,cn.y,rx*0.66,11.5,0,0,6.2832);ctx.stroke();
    if(sq>0.5){
      ctx.fillStyle='#7a4a00';ctx.textAlign='center';ctx.textBaseline='middle';
      fitText(cn.label,30,20,cn.x,cn.y);
    }
  });
}
function drawBarrels(){
  barrels.forEach(function(br){
    var s=SEGS[br.seg],by=s.y-13+Math.sin(br.x*0.25)*1.5;
    ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=8;
    var g=ctx.createLinearGradient(0,by-12,0,by+12);
    g.addColorStop(0,'#cf9440');g.addColorStop(0.5,'#a5671f');g.addColorStop(1,'#7c4a12');
    ctx.fillStyle=g;rr(br.x-18,by-12,36,24,11);ctx.fill();ctx.restore();
    ctx.fillStyle='rgba(60,32,8,.85)';
    rr(br.x-18,by-5,36,3,1.5);ctx.fill();rr(br.x-18,by+2,36,3,1.5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)';rr(br.x-14,by-10,28,3,1.5);ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    fitText(br.val,33,15,br.x,by);
  });
}
function drawPlayer(t){
  var p=player,px=p.x,py=p.y;
  var moving=Math.abs(p.vx)>0.1&&p.ground;
  var bob=moving?Math.sin(t*14)*1.6:Math.sin(t*3)*0.8;
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(px,py+2,11,3.5,0,0,6.2832);ctx.fill();
  ctx.fillStyle='#243b6b';
  var lp=moving?Math.sin(t*14)*3:0;
  rr(px-8,py-10+Math.max(0,lp),6,10,3);ctx.fill();
  rr(px+2,py-10+Math.max(0,-lp),6,10,3);ctx.fill();
  var g=ctx.createLinearGradient(0,py-30,0,py-8);
  g.addColorStop(0,'#5eead4');g.addColorStop(1,'#0d9488');
  ctx.fillStyle=g;rr(px-10,py-30+bob*0.4,20,22,9);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(px-7,py-28+bob*0.4,6,16,3);ctx.fill();
  ctx.fillStyle='#ffd9b3';circ(px,py-36+bob*0.4,9);
  ctx.fillStyle='#3b2b1a';ctx.beginPath();ctx.arc(px,py-38+bob*0.4,9,3.3,6.1);ctx.fill();
  ctx.fillStyle='#1f2937';
  circ(px-3+p.face*1.6,py-36+bob*0.4,1.8);circ(px+3+p.face*1.6,py-36+bob*0.4,1.8);
  ctx.strokeStyle='#1f2937';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(px+p.face*2,py-33+bob*0.4,4,0.4,2.7);ctx.stroke();
  if(gotKey){
    ctx.fillStyle='#ffb703';rr(px-17,py-28+bob*0.4,7,13,3);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🔑',px-13.5,py-21+bob*0.4);
  }
}
function draw(t){
  ctx.textBaseline='alphabetic';
  drawBG(t);drawLadders();drawPlats();drawMonkey();drawPrincess(t);drawCoins(t);drawBarrels();drawPlayer(t);
  if(msgT>0){
    ctx.font='bold 15px sans-serif';
    var w=ctx.measureText(msg).width+30;
    ctx.fillStyle='rgba(20,8,40,.85)';rr(W/2-w/2,6,w,30,15);ctx.fill();
    ctx.strokeStyle='rgba(255,225,89,.6)';ctx.lineWidth=1.5;rr(W/2-w/2,6,w,30,15);ctx.stroke();
    ctx.fillStyle='#ffe259';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(msg,W/2,22);
  }
  if(!started){
    ctx.fillStyle='rgba(20,8,40,.35)';ctx.fillRect(0,0,W,H);
  }
}

/* ---------- 主迴圈 ---------- */
var last=0;
function loop(ts){
  var t=ts/1000,dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  if(started&&!over)update(dt);
  draw(t);
  requestAnimationFrame(loop);
}

/* ---------- 輸入 ---------- */
function bindHold(el,prop){
  el.addEventListener('pointerdown',function(e){e.preventDefault();input[prop]=true;});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    el.addEventListener(ev,function(){input[prop]=false;});
  });
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
bindHold(document.getElementById('btnL'),'l');
bindHold(document.getElementById('btnR'),'r');
bindHold(document.getElementById('btnU'),'u');
bindHold(document.getElementById('btnD'),'d');
function doJump(){
  if(!over&&started&&player&&!player.climb&&player.ground){player.vy=-9.2;player.ground=false;beep(440,0.12,'triangle');}
}
document.getElementById('jumpBtn').addEventListener('pointerdown',function(e){e.preventDefault();doJump();});
document.addEventListener('keydown',function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)>=0)e.preventDefault();
  if(e.key==='ArrowLeft')input.l=true;if(e.key==='ArrowRight')input.r=true;
  if(e.key==='ArrowUp')input.u=true;if(e.key==='ArrowDown')input.d=true;
  if(e.key===' '&&player)doJump();
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')input.l=false;if(e.key==='ArrowRight')input.r=false;
  if(e.key==='ArrowUp')input.u=false;if(e.key==='ArrowDown')input.d=false;
});

/* ---------- 難度選擇 & 覆層 ---------- */
document.getElementById('conceptTxt').textContent=DIFFS.easy.concept;
var diffBtns=document.querySelectorAll('.diff');
diffBtns.forEach(function(b){
  b.addEventListener('click',function(){
    diffBtns.forEach(function(x){x.classList.remove('sel');});
    b.classList.add('sel');
    diff=b.getAttribute('data-d');
    document.getElementById('conceptTxt').textContent=DIFFS[diff].concept;
    beep(660,0.08);
  });
});
document.getElementById('startBtn').addEventListener('click',function(){
  document.getElementById('intro').classList.add('hide');
  started=true;beep(660,0.1);newGame();
});
document.getElementById('againBtn').addEventListener('click',function(){started=true;newGame();beep(660,0.1);});
document.getElementById('changeDiffBtn').addEventListener('click',function(){
  document.getElementById('endOverlay').classList.add('hide');
  document.getElementById('intro').classList.remove('hide');
});

updHud();
requestAnimationFrame(loop);
})();
</script>
